# GitHub Pages（Jekyll）が配信しないものの指定。
#
# **このリポジトリはユーザーサイト（chem-assembler.github.io）で、
# 既定では追跡されている全ファイルが chem.schoollenz.com から読めてしまう。**
# 2026-08-04 に実際に確認したところ、次がすべて HTTP 200 で返っていた:
#   /video-scripts/QUEUE.md          … 投稿計画・視聴回数・配信制限の実験結果
#   /video-scripts/LANES.md          … 制作の内部手順
#   /video-scripts/ORDER_blocking_*  … アプリの未修正の不具合一覧
#   /CLAUDE.md                       … 構成と開発規約
#
# 機密や資格情報は含まないが、**未公開の企画・台本・不具合が誰でも読める**状態だった。
# ここに挙げたものは配信されなくなる。**GitHub 上のリポジトリでは依然として見える**ので、
# 本当に隠したいものはリポジトリの外へ出すか、リポジトリを非公開にすること。
exclude:
  - video-scripts/
  - past-exams/
  - tools/
  - docs/
  - "*.md"          # ルートの設計書・開発方針はすべて（DESIGN_* だけで18本ある）
  - .claude/

# 上の exclude から**明示的に戻すもの**。include は exclude より優先される。
#
# tools/devices.html … 端末プレビュー（人が目で見る用）。
#   **実機の Pixel 10a で開いて viewport を測る**のが目的で、そのためには
#   スマホから届く必要がある。PC はスマホのテザリング（AQUOS）につながっており、
#   LAN 経由（192.168.3.187:8134）は同じホットスポットに入る必要があるうえ、
#   テザリングの端末間通信の遮断で弾かれることがある。**公開してしまえば
#   モバイル回線でも開ける**ので、測り直したいときの手間が毎回ゼロになる。
#
#   中身は「端末情報の表示」と「アプリを iframe で並べる」だけで、
#   **企画・台本・不具合の情報は含まない**（exclude を入れた理由に当たらない）。
#   依存ファイルの無い自己完結の1枚なので、これ1つで動く。
#   → https://chem.schoollenz.com/tools/devices.html
#
#   ⚠ tools/ の他のファイル（check-*.js・verify-*.js・record/ など）は
#   **除外されたまま**。ここに足すのは、公開してよいと判断した1件ずつに限ること。
include:
  - tools/devices.html
