# GitHub Pages（Jekyll）が配信しないものの指定。
#
# **このリポジトリはユーザーサイト（chem-assembler.github.io）で、
# 既定では追跡されている全ファイルが chem.schoollenz.com から読めてしまう。**
# 2026-08-04 に実際に確認したところ、次がすべて HTTP 200 で返っていた:
#   /video-scripts/QUEUE.md          … 投稿計画・視聴回数・配信制限の実験結果
#   /video-scripts/LANES.md          … 制作の内部手順
#   /video-scripts/ORDER_blocking_*  … アプリの未修正の不具合一覧
#   /CLAUDE.md                       … 構成と開発規約
#
# 機密や資格情報は含まないが、**未公開の企画・台本・不具合が誰でも読める**状態だった。
# ここに挙げたものは配信されなくなる。**GitHub 上のリポジトリでは依然として見える**ので、
# 本当に隠したいものはリポジトリの外へ出すか、リポジトリを非公開にすること。
exclude:
  - video-scripts/
  - past-exams/
  - tools/
  - docs/
  - "*.md"          # ルートの設計書・開発方針はすべて（DESIGN_* だけで18本ある）
  - .claude/

# ⚠ **`include:` で「exclude したディレクトリの中の1ファイル」を戻すことはできない**
#    （2026-08-04 に実測）。`include: [tools/devices.html]` を書いて push し、
#    6分待っても /tools/devices.html は 404 のまま。同時刻に /assembler/ は 200 で、
#    Pages のビルド自体は正常だった。Jekyll は exclude したディレクトリを
#    **ファイルを数える段階で丸ごと外す**ので、その中身は include の対象にならない。
#
#    公開したい1枚は**除外していない場所に置く**こと。
#    端末プレビューを `tools/devices.html` → **ルートの `devices.html`** へ移したのはこの理由。
#    → https://chem.schoollenz.com/devices.html
#    （ルートの `*.md` は除外しているが、html は除外していないのでそのまま配信される）
