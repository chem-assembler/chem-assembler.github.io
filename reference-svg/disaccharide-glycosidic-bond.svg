<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
  <!-- マルトースの構造式で、2つの環をつなぐ -O-（グリコシド結合）だけに印を付ける。
       左の環の1位と、右の環の4位が、酸素1個をはさんでつながっている（α-1,4 結合）。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .bond { stroke: #333; stroke-width: 2.5; fill: none; }
    .atom { font-size: 17px; fill: #222; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5; }
    .num { font-size: 14px; fill: #888; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4; }
    .ttl { font-size: 20px; fill: #222; text-anchor: middle; }
    .note { font-size: 16px; fill: #333; text-anchor: middle; }
    .hl { stroke: #6a1b9a; stroke-width: 3.5; fill: none; }
    .mark { fill: none; stroke: #6a1b9a; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .cap { font-size: 18px; fill: #6a1b9a; text-anchor: middle; }
  </style>

  <text class="ttl" x="420" y="40">マルトース</text>

  <!-- ===== 左の環 ===== -->
  <path class="bond" d="M 348 200 L 318 149" />
  <path class="bond" d="M 299 133 L 231 133" />
  <path class="bond" d="M 348 200 L 309 267 L 231 267 L 192 200 L 231 133" />
  <text class="atom" x="309" y="140">O</text>

  <path class="bond" d="M 231 133 L 231 97" />
  <text class="atom" x="231" y="88">CH₂OH</text>
  <path class="bond" d="M 309 267 L 309 303" />
  <text class="atom" x="309" y="323">OH</text>
  <path class="bond" d="M 231 267 L 231 303" />
  <text class="atom" x="231" y="323">OH</text>
  <path class="bond" d="M 192 200 L 152 200" />
  <text class="atom" x="137" y="206">OH</text>

  <text class="num" x="322" y="205">1</text>

  <!-- ===== 右の環 ===== -->
  <path class="bond" d="M 648 200 L 618 149" />
  <path class="bond" d="M 599 133 L 531 133" />
  <path class="bond" d="M 648 200 L 609 267 L 531 267 L 492 200 L 531 133" />
  <text class="atom" x="609" y="140">O</text>

  <path class="bond" d="M 531 133 L 531 97" />
  <text class="atom" x="531" y="88">CH₂OH</text>
  <path class="bond" d="M 609 267 L 609 303" />
  <text class="atom" x="609" y="323">OH</text>
  <path class="bond" d="M 531 267 L 531 303" />
  <text class="atom" x="531" y="323">OH</text>
  <path class="bond" d="M 648 200 L 688 200" />
  <text class="atom" x="708" y="206">OH</text>

  <text class="num" x="518" y="205">4</text>

  <!-- ===== つなぎの -O-（ここが印） ===== -->
  <path class="hl" d="M 348 200 L 406 200" />
  <path class="hl" d="M 434 200 L 492 200" />
  <text class="atom" x="420" y="206" fill="#6a1b9a">O</text>
  <ellipse class="mark" cx="420" cy="200" rx="52" ry="30" />

  <text class="cap" x="420" y="116">グリコシド結合</text>
  <path class="mark" d="M 420 128 L 420 166" stroke-dasharray="0" />

  <text class="note" x="420" y="372">α-グルコース2分子が、左の環の1位と右の環の4位でつながっている</text>
</svg>
