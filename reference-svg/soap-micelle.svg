  <text class="lab" x="240" y="206" text-anchor="middle">内側は</text>
  <text class="lab" x="240" y="230" text-anchor="middle">疎水基</text>

  <path class="lead" d="M 430 196 L 366 208" />
  <text class="lab" x="440" y="192">外側は親水基（丸い頭）</text>
  <text class="small" x="440" y="220">水のほうを向いているので、水の中に散らばれる</text>

  <path class="lead" d="M 430 292 L 320 258" />
  <text class="lab" x="440" y="298">中は油になじむ部分の集まり</text>
