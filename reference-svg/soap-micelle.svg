<svg xmlns="http://www.w3.org/2000/svg" width="705.882" height="370.588" viewBox="0 0 800 420" role="img">
  <!-- ミセルの断面。疎水基（棒）が内側、親水基（頭）が外側。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。
       ⚠ 向きを逆に描かないこと（内側が疎水基）。 -->
  <style>
    .tail { stroke: #e65100; stroke-width: 7; stroke-linecap: round; fill: none; }
    .head { fill: #1565c0; }
    .core { fill: #fff3e0; }
    .lab { font-size: 17px; fill: #222; }
    .small { font-size: 15px; fill: #444; }
    .lead { stroke: #666; stroke-width: 1.5; fill: none; }
  </style>

  <circle class="core" cx="240" cy="210" r="52" />

