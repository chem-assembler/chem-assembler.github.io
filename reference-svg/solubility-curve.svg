<svg xmlns="http://www.w3.org/2000/svg" width="716.667" height="375" viewBox="0 0 860 450" role="img">
  <!-- 溶解度曲線。多くの固体は高温ほど溶けるが、NaCl はほとんど変わらず、Ca(OH)2 は減る（本文の「例外2つ」）。
       ⚠ Ca(OH)2 は 0.2 g 未満で目盛りでは軸に重なるため、見えるように持ち上げて描き、札に実際の大きさを書いた。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .ax { stroke: #333; stroke-width: 2; fill: none; }
    .grid { stroke: #bbb; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .c1 { stroke: #1565c0; stroke-width: 3; fill: none; }
    .c2 { stroke: #c62828; stroke-width: 3; fill: none; }
    .c3 { stroke: #2e7d32; stroke-width: 3; fill: none; }
    .c4 { stroke: #6a1b9a; stroke-width: 3; stroke-dasharray: 9 5; fill: none; }
    .lab { font-size: 19px; fill: #222; }
    .small { font-size: 16px; fill: #444; }
    .tick { font-size: 15px; fill: #555; }
  </style>

  <!-- 軸 -->
  <path class="ax" d="M 110 50 L 110 380 L 585 380" />
  <polygon points="110,40 105,54 115,54" fill="#333" />
  <polygon points="595,380 581,375 581,385" fill="#333" />
  <text class="lab" x="24" y="34">溶解度（水 100 g あたりの g）</text>
  <text class="lab" x="270" y="432">温度（℃）</text>

  <!-- 目盛り -->
  <path class="grid" d="M 110 290 L 560 290 M 110 200 L 560 200 M 110 110 L 560 110" />
  <text class="tick" x="100" y="386" text-anchor="end">0</text>
  <text class="tick" x="100" y="296" text-anchor="end">50</text>
  <text class="tick" x="100" y="206" text-anchor="end">100</text>
  <text class="tick" x="100" y="116" text-anchor="end">150</text>
  <path class="ax" d="M 200 380 L 200 386 M 290 380 L 290 386 M 380 380 L 380 386 M 470 380 L 470 386 M 560 380 L 560 386" stroke-width="1.5" />
  <text class="tick" x="110" y="402" text-anchor="middle">0</text>
  <text class="tick" x="200" y="402" text-anchor="middle">20</text>
  <text class="tick" x="290" y="402" text-anchor="middle">40</text>
  <text class="tick" x="380" y="402" text-anchor="middle">60</text>
  <text class="tick" x="470" y="402" text-anchor="middle">80</text>
  <text class="tick" x="560" y="402" text-anchor="middle">100</text>

  <!-- 硝酸カリウム：大きく増える -->
  <polyline class="c1" points="110,356 155,342 200,323 245,298 290,265 335,226 380,182 425,132 470,76" />
  <text class="small" x="484" y="82" fill="#1565c0">KNO₃</text>

  <!-- 硫酸銅(II)：増える -->
  <polyline class="c2" points="110,354 155,349 200,343 245,336 290,329 335,319 380,308 425,294 470,279 515,263 560,244" />
  <text class="small" x="606" y="249" fill="#c62828">CuSO₄</text>

  <!-- 塩化ナトリウム：ほとんど変わらない -->
  <polyline class="c3" points="110,316 155,316 200,315 245,315 290,314 335,313 380,313 425,312 470,311 515,310 560,308" />
  <text class="small" x="606" y="306" fill="#2e7d32">NaCl</text>
  <text class="small" x="606" y="328">温度でほとんど変わらない</text>

  <!-- 水酸化カルシウム：高温ほど減る（実際の値は目盛りでは軸に重なる） -->
  <polyline class="c4" points="110,372 200,373 290,374 380,375 470,377 560,378" />
  <text class="small" x="606" y="374" fill="#6a1b9a">Ca(OH)₂</text>
  <text class="small" x="606" y="399">高温ほど減る（0.2 g 未満）</text>
</svg>
