<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
  <!-- 同じ大気圧（1.013×10⁵ Pa）とつり合う液体の柱の高さを、水銀と水で比べる図（2026-09-25・ユーザーの校正
       「ここは図もつかってちゃんと説明する」）。水銀は密度が水の約 13.6 倍なので、柱は水の約 1/13.6（76cm と 約 10m）。
       水の柱は長すぎるので、途中を2本の波線で省いて描く（高さの比は正しくない ＝ 図の中にそう書く）。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <defs>
    <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .glass { fill: none; stroke: #333; stroke-width: 2.5; }
    .hg { fill: #8a939b; }
    .water { fill: #90caf9; }
    .vac { fill: #ffffff; }
    .dim { stroke: #333; stroke-width: 1.5; fill: none; }
    .cut { fill: #ffffff; stroke: none; }
    .wave { fill: none; stroke: #333; stroke-width: 1.8; }
    .t { font-family: system-ui, sans-serif; font-size: 17px; fill: #222; }
    .k { font-family: system-ui, sans-serif; font-size: 18px; fill: #222; font-weight: 700; }
    .s { font-family: system-ui, sans-serif; font-size: 15px; fill: #444; }
  </style>

  <!-- 水銀: 水銀だめに立てた管 -->
  <text class="k" x="180" y="30" text-anchor="middle">水銀</text>
  <rect class="hg" x="112" y="344" width="136" height="36" />
  <path class="glass" d="M 110 318 L 110 382 L 250 382 L 250 318" />
  <rect class="vac" x="162" y="170" width="36" height="30" />
  <rect class="hg" x="162" y="200" width="36" height="170" />
  <path class="glass" d="M 161 370 L 161 186 A 19 19 0 0 1 199 186 L 199 370" />
  <path class="dim" marker-start="url(#dm)" marker-end="url(#dm)" d="M 90 204 L 90 340" />
  <text class="t" x="82" y="278" text-anchor="end">76cm</text>
  <text class="s" x="180" y="408" text-anchor="middle">密度 13.6g/cm³</text>

  <!-- 水: 水だめに立てた管（途中を省く） -->
  <text class="k" x="470" y="30" text-anchor="middle">水</text>
  <rect class="water" x="402" y="344" width="136" height="36" />
  <path class="glass" d="M 400 318 L 400 382 L 540 382 L 540 318" />
  <rect class="vac" x="452" y="46" width="36" height="20" />
  <rect class="water" x="452" y="66" width="36" height="304" />
  <path class="glass" d="M 451 370 L 451 60 A 19 19 0 0 1 489 60 L 489 370" />
  <!-- 省略の印: 管を横切る2本の波線と、そのあいだの白い帯 -->
  <path class="cut" d="M 440 190 Q 450 182 460 190 T 480 190 T 500 190 L 500 206 Q 490 198 480 206 T 460 206 T 440 206 Z" />
  <path class="wave" d="M 440 190 Q 450 182 460 190 T 480 190 T 500 190" />
  <path class="wave" d="M 440 206 Q 450 198 460 206 T 480 206 T 500 206" />
  <path class="dim" marker-start="url(#dm)" marker-end="url(#dm)" d="M 566 70 L 566 340" />
  <text class="t" x="576" y="200">約 10m</text>
  <text class="s" x="576" y="226">（途中を省いて</text>
  <text class="s" x="576" y="246">描いています）</text>
  <text class="s" x="470" y="408" text-anchor="middle">密度 1.0g/cm³</text>

  <!-- 結論 -->
  <text class="t" x="325" y="120" text-anchor="middle">同じ大気圧でも</text>
  <text class="t" x="325" y="146" text-anchor="middle">重い液体ほど柱は短い</text>
</svg>
