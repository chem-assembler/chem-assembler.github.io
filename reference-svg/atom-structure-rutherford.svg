<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
  <!-- ラザフォードの実験（2026-09-25・ユーザーの校正「ラザフォードの実験を追加で」）。
       薄い金箔に α線（α粒子）を当てると、ほとんどはまっすぐ通り抜け、ごく一部だけが大きく曲がったり跳ね返ったりした。
       右は拡大: 原子のほとんどは空っぽで、中心の小さな原子核に正の電荷と質量が集まっている。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100" />
    </marker>
  </defs>
  <style>
    .foil { fill: #ffd54f; stroke: #b28900; stroke-width: 1.5; }
    .ray { stroke: #e65100; stroke-width: 2; fill: none; }
    .t { font-family: system-ui, sans-serif; font-size: 17px; fill: #222; }
    .b { font-family: system-ui, sans-serif; font-size: 17px; fill: #222; font-weight: 700; }
    .s { font-family: system-ui, sans-serif; font-size: 15px; fill: #444; }
    .atom { fill: #f5f5f5; stroke: #999; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .nuc { fill: #c62828; }
    .e { fill: #1565c0; }
    .zoom { stroke: #999; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>

  <!-- 左: 実験 -->
  <text class="b" x="30" y="30">α線</text>
  <rect class="foil" x="200" y="50" width="12" height="220" />
  <text class="s" x="206" y="292" text-anchor="middle">金箔</text>
  <!-- ほとんどは素通り -->
  <path class="ray" marker-end="url(#ar)" d="M 30 80 L 360 80" />
  <path class="ray" marker-end="url(#ar)" d="M 30 120 L 360 120" />
  <path class="ray" marker-end="url(#ar)" d="M 30 200 L 360 200" />
  <path class="ray" marker-end="url(#ar)" d="M 30 240 L 360 240" />
  <!-- 少しだけ大きく曲がる -->
  <path class="ray" marker-end="url(#ar)" d="M 30 150 L 206 150 L 330 60" />
  <!-- ごくまれに跳ね返る -->
  <path class="ray" marker-end="url(#ar)" d="M 30 170 L 206 170 L 60 214" />
  <text class="t" x="372" y="85">ほとんどは素通り</text>
  <text class="t" x="336" y="52">一部は大きく曲がる</text>
  <text class="t" x="30" y="318">ごくまれに跳ね返る</text>

  <!-- 右: 拡大した原子 -->
  <path class="zoom" d="M 212 160 L 470 150" />
  <circle class="atom" cx="560" cy="200" r="90" />
  <circle class="nuc" cx="560" cy="200" r="5" />
  <circle class="e" cx="500" cy="150" r="4" />
  <circle class="e" cx="628" cy="170" r="4" />
  <circle class="e" cx="590" cy="270" r="4" />
  <text class="s" x="560" y="316" text-anchor="middle">原子のほとんどは空っぽ</text>
  <path class="zoom" d="M 556 206 L 530 240" />
  <text class="s" x="528" y="256" text-anchor="end">原子核（＋）</text>
</svg>
