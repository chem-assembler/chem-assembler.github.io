    .i { fill: #e1bee7; stroke: #6a1b9a; stroke-width: 1.6; }
    .name { font-size: 20px; fill: #222; }
    .cnt { font-size: 20px; fill: #444; }
    .frac { font-size: 20px; fill: #444; }
  </style>

