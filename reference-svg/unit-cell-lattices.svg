<svg xmlns="http://www.w3.org/2000/svg" width="675.294" height="288.235" viewBox="0 0 820 350" role="img">
  <!-- 金属の3つの結晶格子。球は位置を見せるための小さい球で、実際は接している。
       ⚠ 数え方の色分け: 青＝頂点（1／8 個）・橙＝面の中心（1／2 個）・紫＝内部（1 個）。
       ⚠ 六方最密構造は六角柱で描いてある（六角柱では 6 個・単位格子では 2 個。本文の表と同じ）。
       ⚠ 中ほどの 3 個は、そのまま投影すると六角柱の奥の頂点と重なって読めないので、
          中心寄りに置いてある（位置関係を見せるための図）。
