<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
  <!-- 緩衝液の中和を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .hPlus { fill: #d35400; stroke: #993d00; stroke-width: 1.5; }
    .ohMinus { fill: #165b7c; stroke: #10425a; stroke-width: 1.5; }
    .negIon { fill: #a5d4a1; stroke: #222; stroke-width: 1.5; }
    .posIon { fill: #f0cbb5; stroke: #222; stroke-width: 1.5; }
    .h2oPool { fill: #009966; stroke: #004d33; stroke-width: 1.5; }
    .arrow { fill: #ffff00; stroke: #000; stroke-width: 1.5; }
    .arrowBlue { fill: #004466; stroke: #002233; stroke-width: 1.5; }
    .brace { fill: none; stroke: #004466; stroke-width: 3; }
    .labelBox { fill: #fff; stroke: #004466; stroke-width: 2; }
    .textOrange { fill: #e0762b; font-weight: bold; font-size: 20px; }
  </style>

  <!-- 上段: 弱酸の中和 -->
  <g transform="translate(150, 10)">
    <!-- 1行目 (OH- + H+ -> H2O) -->
    <ellipse cx="40" cy="90" rx="30" ry="20" class="ohMinus" />
    <text x="40" y="96" class="wtext" font-size="16">OH<tspan font-size="12" dy="-8">-</tspan></text>
    
    <polygon points="90,95 75,90 75,85 85,95 75,105 75,100 90,95" class="arrow" transform="rotate(-20, 85, 95)" />
    
    <circle cx="160" cy="30" r="18" class="hPlus" />
    <text x="160" y="36" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    
    <polygon points="150,85 155,70 160,70 150,60 140,70 145,70 150,85" class="arrow" transform="rotate(-30, 150, 75)" />

    <ellipse cx="140" cy="120" rx="30" ry="22" class="h2oPool" />
    <text x="140" y="126" class="wtext" font-size="16">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
    <text x="140" y="165" class="textOrange">中和</text>

    <!-- 弱酸の列 -->
    <polygon points="215,30 200,30 200,25 190,35 200,45 200,40 215,40" class="arrow" />
    <ellipse cx="260" cy="35" rx="30" ry="20" class="negIon" />
    <text x="260" y="40" font-size="14">－イオン</text>

    <!-- 2行目 -->
    <circle cx="215" cy="85" r="18" class="hPlus" />
    <text x="215" y="91" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="260" cy="85" rx="30" ry="20" class="negIon" />
    <text x="260" y="90" font-size="14">－イオン</text>

    <!-- 3行目 -->
    <circle cx="215" cy="135" r="18" class="hPlus" />
    <text x="215" y="141" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="260" cy="135" rx="30" ry="20" class="negIon" />
    <text x="260" y="140" font-size="14">－イオン</text>

    <!-- 4行目 -->
    <circle cx="215" cy="185" r="18" class="hPlus" />
    <text x="215" y="191" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="260" cy="185" rx="30" ry="20" class="negIon" />
    <text x="260" y="190" font-size="14">－イオン</text>

    <!-- 5行目 -->
    <circle cx="215" cy="235" r="18" class="hPlus" />
    <text x="215" y="241" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="260" cy="235" rx="30" ry="20" class="negIon" />
    <text x="260" y="240" font-size="14">－イオン</text>

    <path class="brace" d="M 300 10 L 310 10 L 310 260 L 300 260" />
    <rect class="labelBox" x="320" y="20" width="60" height="35" />
    <text x="350" y="45" font-size="20">弱酸</text>
    
    <text x="350" y="90" font-size="20">一</text>
    <text x="350" y="120" font-size="20">部</text>
    <text x="350" y="150" font-size="20">が</text>
    <text x="350" y="180" font-size="20">電</text>
    <text x="350" y="210" font-size="20">離</text>
  </g>

  <!-- 中央の矢印 (下向き) -->
  <polygon points="330,290 350,290 350,330 360,330 340,350 320,330 330,330" class="arrowBlue" />

  <!-- 下段: 反応後 -->
  <g transform="translate(150, 360)">
    <!-- H2O -->
    <ellipse cx="20" cy="180" rx="30" ry="22" class="h2oPool" />
    <text x="20" y="186" class="wtext" font-size="16">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

    <!-- 1行目 (塩) -->
    <ellipse cx="80" cy="35" rx="30" ry="20" class="posIon" />
    <text x="80" y="40" font-size="14">＋イオン</text>
    <ellipse cx="145" cy="35" rx="30" ry="20" class="negIon" />
    <text x="145" y="40" font-size="14">－イオン</text>
    <path class="brace" d="M 185 15 L 195 15 L 195 55 L 185 55" />
    <rect class="labelBox" x="205" y="15" width="40" height="35" />
    <text x="225" y="40" font-size="20">塩</text>

    <!-- 2行目 (新たに電離) -->
    <circle cx="100" cy="85" r="18" class="hPlus" />
    <text x="100" y="91" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <polygon points="140,85 125,85 125,80 115,90 125,100 125,95 140,95" class="arrow" />
    <ellipse cx="185" cy="85" rx="30" ry="20" class="negIon" />
    <text x="185" y="90" font-size="14">－イオン</text>

    <!-- 3行目 -->
    <circle cx="140" cy="135" r="18" class="hPlus" />
    <text x="140" y="141" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="185" cy="135" rx="30" ry="20" class="negIon" />
    <text x="185" y="140" font-size="14">－イオン</text>

    <!-- 4行目 -->
    <circle cx="140" cy="185" r="18" class="hPlus" />
    <text x="140" y="191" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="185" cy="185" rx="30" ry="20" class="negIon" />
    <text x="185" y="190" font-size="14">－イオン</text>

    <!-- 5行目 -->
    <circle cx="140" cy="235" r="18" class="hPlus" />
    <text x="140" y="241" class="wtext" font-size="16">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="185" cy="235" rx="30" ry="20" class="negIon" />
    <text x="185" y="240" font-size="14">－イオン</text>

    <path class="brace" d="M 225 65 L 235 65 L 235 260 L 225 260" />
    <rect class="labelBox" x="245" y="80" width="60" height="35" />
    <text x="275" y="105" font-size="20">弱酸</text>
    
    <text x="275" y="145" font-size="20">一</text>
    <text x="275" y="175" font-size="20">部</text>
    <text x="275" y="205" font-size="20">が</text>
    <text x="275" y="235" font-size="20">電</text>
    <text x="275" y="265" font-size="20">離</text>
  </g>

</svg>
