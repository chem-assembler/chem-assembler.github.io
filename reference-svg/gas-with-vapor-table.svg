<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
  <!-- 気体と蒸気の反応量テーブル。
       元はスライドの図で横に長いため、文字サイズを確保するためボックスを上下に配置して SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 18px; }
    .eq { font-family: "Times New Roman", serif; font-size: 26px; }
    .eq tspan.s { font-size: 16px; }
    .box { fill: #fff; stroke: #e0762b; stroke-width: 1.5; }
    .box-blue { fill: #fff; stroke: #0078d7; stroke-width: 1.5; }
    .line-blue { stroke: #0078d7; stroke-width: 2; }
    .text-blue { fill: #0078d7; }
    .text-orange { fill: #e0762b; }
    .lead { stroke: #e0762b; stroke-width: 1.5; fill: none; }
    .coef { fill: none; stroke: #e0762b; stroke-width: 1.5; rx: 4; }
  </style>

  <!-- 左の箱（上部に配置） -->
  <rect class="box" x="20" y="20" width="640" height="60" />
  <text x="35" y="45">同一容器内では<tspan font-family="Times New Roman, serif" font-style="italic">T</tspan>と<tspan font-family="Times New Roman, serif" font-style="italic">V</tspan>が共通であるため<tspan font-family="Times New Roman, serif" font-style="italic">P</tspan>と<tspan font-family="Times New Roman, serif" font-style="italic">n</tspan>が比例するので</text>
  <text x="35" y="70">molの代わりに圧力Paで計算できる</text>

  <!-- 反応式とテーブル -->
  <rect class="box-blue" x="20" y="100" width="130" height="35" />
  <text x="30" y="125">単位は10<tspan font-size="12" dy="-8">5</tspan><tspan dy="8">Pa</tspan></text>

  <rect class="coef" x="180" y="102" width="22" height="28" />
  <text class="eq" x="184" y="125">2<tspan dx="5">H</tspan><tspan class="s" dy="8">2</tspan><tspan dy="-8" dx="15">+</tspan></text>

  <rect class="coef" x="280" y="102" width="22" height="28" />
  <text class="eq" x="284" y="125">1<tspan dx="5">O</tspan><tspan class="s" dy="8">2</tspan><tspan dy="-8" dx="20">→</tspan></text>

  <rect class="coef" x="420" y="102" width="22" height="28" />
  <text class="eq" x="424" y="125">2<tspan dx="5">H</tspan><tspan class="s" dy="8">2</tspan><tspan dy="-8">O</tspan></text>

  <text class="text-blue" x="40" y="165">反応前</text>
  <text class="text-blue" x="190" y="165">0.8</text>
  <text class="text-blue" x="290" y="165">1.0</text>

  <text class="text-blue" x="40" y="200">変化量</text>
  <text class="text-orange" x="175" y="200">−0.8</text>
  <text class="text-orange" x="275" y="200">−0.4</text>
  <text class="text-orange" x="415" y="200">+0.8</text>

  <line class="line-blue" x1="40" y1="210" x2="490" y2="210" />

  <text class="text-blue" x="40" y="235">反応後</text>
  <text class="text-blue" x="200" y="235">0</text>
  <text class="text-blue" x="290" y="235">0.6</text>
  
  <rect class="coef" x="420" y="215" width="38" height="26" />
  <text class="text-blue" x="424" y="235">0.8</text>

  <!-- 右の箱 1 -->
  <rect class="box" x="480" y="140" width="180" height="35" />
  <text x="490" y="165">係数の比はmolの比</text>
  <path class="lead" d="M 480 157 L 440 185" />

  <!-- 右の箱 2 -->
  <rect class="box" x="150" y="280" width="510" height="60" />
  <text x="160" y="305">飽和蒸気圧を超えているので燃焼後のH<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">Oの分圧</tspan></text>
  <text x="160" y="330">は飽和蒸気圧に等しい</text>
  <path class="lead" d="M 458 230 L 480 280" />

</svg>
