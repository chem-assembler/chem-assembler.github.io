<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
  <!-- 原子の考え方の年表（上から下へ時代が進む）。紀元前のデモクリトスから、ドルトンの原子説（1803年ごろ）を経て20世紀の量子論まで。
       右の帯: 高校化学のおもな範囲（19世紀までに形づくられた化学）と、高校で使う原子のモデル（ボーア）。
       ⚠ 間隔は年代に比例させていない（本文と alt にも書く）。
       ⚠ 字の床（2026-09-24）: 幅 680 ＝ 公開ページの本文の幅なので、字はそのままの大きさで見える。いちばん小さい字を 16px にした。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    text { font-family: system-ui, sans-serif; }
    .axis { stroke: #333; stroke-width: 3; }
    .brk { stroke: #333; stroke-width: 2.5; }
    .dot { fill: #fff; stroke: #333; stroke-width: 2.5; }
    .key { fill: #1565c0; stroke: #0d47a1; stroke-width: 2.5; }
    .yr { font-size: 17px; fill: #333; text-anchor: end; }
    .ev { font-size: 18px; fill: #222; }
    .evk { font-size: 18px; fill: #0d47a1; font-weight: bold; }
    .band { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.5; }
    .bt { font-size: 16px; fill: #e65100; }
    .band2 { fill: #ede7f6; stroke: #5e35b1; stroke-width: 1.5; }
    .bt2 { font-size: 16px; fill: #4527a0; }
    .note { font-size: 16px; fill: #666; text-anchor: end; }
  </style>

  <!-- 縦の軸 -->
  <line class="axis" x1="170" y1="30" x2="170" y2="520" />
  <!-- 軸の途中を省いた印（年代に比例していない） -->
  <path class="brk" d="M 158 102 L 182 94 M 158 114 L 182 106" />

  <!-- 右の帯（高校化学のおもな範囲・ボーアのモデル） -->
  <rect class="band" x="470" y="178" width="196" height="196" rx="8" />
  <text class="bt" x="484" y="206">高校化学の</text>
  <text class="bt" x="484" y="228">おもな範囲</text>
  <text class="bt" x="484" y="250">（19世紀までの化学）</text>
  <rect class="band2" x="470" y="388" width="196" height="56" rx="8" />
  <text class="bt2" x="484" y="414">＋ 高校で使う</text>
  <text class="bt2" x="484" y="436">原子のモデル</text>

  <circle class="dot" cx="170" cy="60" r="9" />
  <text class="yr" x="150" y="66">紀元前5世紀ごろ</text>
  <text class="ev" x="192" y="66">デモクリトス「アトモス」</text>

  <circle class="dot" cx="170" cy="150" r="9" />
  <text class="yr" x="150" y="156">中世</text>
  <text class="ev" x="192" y="156">錬金術</text>

  <circle class="dot" cx="170" cy="210" r="9" />
  <text class="yr" x="150" y="216">1774年ごろ</text>
  <text class="ev" x="192" y="216">ラボアジエ　質量保存の法則</text>

  <circle class="key" cx="170" cy="265" r="11" />
  <text class="yr" x="150" y="271">1803年ごろ</text>
  <text class="evk" x="192" y="271">ドルトン　原子説</text>

  <circle class="dot" cx="170" cy="320" r="9" />
  <text class="yr" x="150" y="326">1869年</text>
  <text class="ev" x="192" y="326">メンデレーエフ　周期表</text>

  <circle class="dot" cx="170" cy="365" r="9" />
  <text class="yr" x="150" y="371">1897年</text>
  <text class="ev" x="192" y="371">電子の発見</text>

  <circle class="dot" cx="170" cy="416" r="9" />
  <text class="yr" x="150" y="422">1913年</text>
  <text class="ev" x="192" y="422">ボーアの原子モデル</text>

  <circle class="dot" cx="170" cy="480" r="9" />
  <text class="yr" x="150" y="486">1920年代</text>
  <text class="ev" x="192" y="486">量子力学（量子論）</text>

  <text class="note" x="666" y="548">※ 間隔は年代に比例していません</text>
</svg>
