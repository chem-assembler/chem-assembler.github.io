<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
  <!-- 弱酸の遊離と塩の加水分解を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .eq { font-family: "Times New Roman", serif; font-size: 22px; }
    .boxGreen { fill: #4caf50; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
    .circleRed { fill: #ff0000; stroke: #b71c1c; stroke-width: 1.5; }
    .boxOrange { fill: none; stroke: #e0762b; stroke-width: 2; rx: 4; }
    .textOrange { fill: #e0762b; font-size: 14px; }
    .textPurple { fill: #6a1b9a; font-size: 14px; }
    .dashedPurple { fill: none; stroke: #6a1b9a; stroke-width: 1.5; stroke-dasharray: 2 2; rx: 4; }
    .textGreen { fill: #2e7d32; font-size: 14px; }
    .water { fill: #d4e6f1; }
    .beaker { fill: none; stroke: #222; stroke-width: 2; }
    .circleH { fill: #e0762b; stroke: #b71c1c; stroke-width: 1.5; }
    .circleCl { fill: #00acc1; stroke: #00838f; stroke-width: 1.5; }
    .circleOH { fill: #00838f; stroke: #006064; stroke-width: 1.5; }
    .bottomBox { fill: #fff; stroke: #ffcc00; stroke-width: 2; }
    .bottomText { font-size: 20px; }
    .arrowGreen { stroke: #2e7d32; stroke-width: 3; fill: none; marker-end: url(#arrowheadGreen); }
    .redLine { stroke: #ff0000; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrowheadGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#2e7d32" />
    </marker>
  </defs>

  <!-- 左側: 弱酸の遊離 -->
  <g transform="translate(10, 10)">
    <rect x="75" y="0" width="100" height="25" fill="#fff" stroke="#4caf50" stroke-width="1.5" />
    <text x="125" y="18" fill="#4caf50" font-size="18">弱酸の遊離</text>

    <!-- ビーカー -->
    <path class="beaker" d="M 20 20 L 20 200 L 250 200 L 250 20" />
    <rect class="water" x="21" y="60" width="228" height="139" />
    <line class="beaker" x1="21" y1="60" x2="249" y2="60" />

    <!-- 添加する物質 -->
    <rect class="boxGreen" x="40" y="30" width="70" height="25" />
    <text x="75" y="48" class="wtext eq" font-size="16">CH<tspan font-size="12" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="12" dy="-8">-</tspan></text>
    
    <circle cx="125" cy="42" r="12" class="circleRed" />
    <text x="125" y="47" class="wtext eq" font-size="14">Na<tspan font-size="10" dy="-5">+</tspan></text>

    <text x="85" y="75" class="textOrange">すべて電離する</text>

    <!-- 遊離したCH3COOHの空枠 -->
    <rect class="boxOrange" x="35" y="85" width="85" height="30" />
    <text x="77" y="130" class="textOrange">遊離した</text>
    
    <!-- HCl -->
    <text x="160" y="160" class="eq textPurple" font-size="18">HCl</text>
    
    <circle cx="110" cy="175" r="12" class="circleH" />
    <text x="110" y="180" class="wtext eq" font-size="14">H<tspan font-size="10" dy="-5">+</tspan></text>

    <circle cx="210" cy="175" r="12" class="circleCl" />
    <text x="210" y="180" class="wtext eq" font-size="14">Cl<tspan font-size="10" dy="-5">-</tspan></text>

    <!-- 電離している枠 -->
    <rect class="dashedPurple" x="90" y="155" width="140" height="40" />
    <text x="160" y="210" class="textPurple">電離している</text>

    <!-- 右側の縦の電離している枠 (Cl-用) -->
    <rect class="dashedPurple" x="190" y="100" width="40" height="95" />
    <text x="240" y="115" class="textPurple">電</text>
    <text x="240" y="130" class="textPurple">離</text>
    <text x="240" y="145" class="textPurple">し</text>
    <text x="240" y="160" class="textPurple">て</text>
    <text x="240" y="175" class="textPurple">い</text>
    <text x="240" y="190" class="textPurple">る</text>
  </g>

  <!-- 右側: 弱酸の塩の加水分解 -->
  <g transform="translate(320, 10)">
    <rect x="75" y="0" width="130" height="25" fill="#fff" stroke="#4caf50" stroke-width="1.5" />
    <text x="140" y="18" fill="#4caf50" font-size="18">弱酸の塩の加水分解</text>

    <!-- ビーカー -->
    <path class="beaker" d="M 20 20 L 20 200 L 250 200 L 250 20" />
    <rect class="water" x="21" y="60" width="228" height="139" />
    <line class="beaker" x1="21" y1="60" x2="249" y2="60" />

    <!-- 添加する物質 -->
    <rect class="boxGreen" x="40" y="30" width="70" height="25" />
    <text x="75" y="48" class="wtext eq" font-size="16">CH<tspan font-size="12" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="12" dy="-8">-</tspan></text>
    
    <circle cx="125" cy="42" r="12" class="circleRed" />
    <text x="125" y="47" class="wtext eq" font-size="14">Na<tspan font-size="10" dy="-5">+</tspan></text>

    <text x="85" y="75" class="textOrange">すべて電離する</text>

    <!-- 電離していないCH3COOHの空枠 -->
    <rect class="boxOrange" x="35" y="85" width="85" height="30" />
    <text x="77" y="130" class="textOrange">電離していない</text>

    <!-- H2O -->
    <text x="190" y="145" class="eq textPurple" font-size="18">H<tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
    
    <circle cx="160" cy="165" r="12" class="circleH" />
    <text x="160" y="170" class="wtext eq" font-size="14">H<tspan font-size="10" dy="-5">+</tspan></text>

    <ellipse cx="205" cy="165" rx="20" ry="12" class="circleOH" />
    <text x="205" y="170" class="wtext eq" font-size="14">OH<tspan font-size="10" dy="-5">-</tspan></text>

    <rect class="dashedPurple" x="140" y="150" width="95" height="30" />

    <!-- 縦枠 (OH-用) -->
    <rect class="dashedPurple" x="180" y="85" width="50" height="95" />
    <text x="240" y="90" class="textPurple">電</text>
    <text x="240" y="105" class="textPurple">離</text>
    <text x="240" y="120" class="textPurple">し</text>
    <text x="240" y="135" class="textPurple">て</text>
    <text x="240" y="150" class="textPurple">い</text>
    <text x="240" y="165" class="textPurple">る</text>

    <!-- 分解する -->
    <line class="redLine" x1="175" y1="135" x2="175" y2="185" />
    <text x="175" y="125" fill="#ff0000" font-size="14">分解する</text>
    
    <text x="200" y="195" fill="#ff0000" font-size="14">OH<tspan font-size="10" dy="-5">-</tspan><tspan dy="5">が余る</tspan></text>
    <text x="200" y="210" fill="#ff0000" font-size="14">ので塩基性</text>

    <!-- 矢印 -->
    <path class="arrowGreen" d="M 165 145 L 130 105" />

    <text x="85" y="160" class="textGreen">中和してもとに戻る</text>
    <text x="85" y="180" class="textGreen">こともある可逆反応</text>
  </g>

  <!-- 反応式 -->
  <text x="160" y="270" class="eq" font-size="20">CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COONa + HCl → CH</tspan><tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COOH + NaCl</tspan></text>
  <text x="500" y="270" class="eq" font-size="20">CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8"> + H</tspan><tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O ⇄ CH</tspan><tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COOH + OH</tspan><tspan font-size="14" dy="-8">-</tspan></text>

  <!-- 下のテキスト枠 -->
  <rect class="bottomBox" x="30" y="290" width="620" height="40" />
  <text x="340" y="315" class="bottomText"><tspan fill="#e0762b">弱酸の</tspan><tspan font-weight="bold">遊離</tspan>，<tspan fill="#4caf50">弱酸の塩の</tspan><tspan font-weight="bold">加水分解</tspan>，どちらもCH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8">がH</tspan><tspan font-size="14" dy="-8">+</tspan><tspan dy="8">とくっつく反応</tspan></text>

</svg>
