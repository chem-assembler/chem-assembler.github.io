<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
  <!-- 弱酸の遊離と塩の加水分解を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .eq { font-family: "Times New Roman", serif; font-size: 24px; }
    .boxGreen { fill: #4caf50; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
    .circleRed { fill: #ff0000; stroke: #b71c1c; stroke-width: 1.5; }
    .boxOrange { fill: none; stroke: #e0762b; stroke-width: 2; rx: 4; }
    .textOrange { fill: #e0762b; font-size: 16px; }
    .textPurple { fill: #6a1b9a; font-size: 16px; }
    .dashedPurple { fill: none; stroke: #6a1b9a; stroke-width: 1.5; stroke-dasharray: 2 2; rx: 4; }
    .textGreen { fill: #2e7d32; font-size: 16px; }
    .water { fill: #d4e6f1; }
    .beaker { fill: none; stroke: #222; stroke-width: 2; }
    .circleH { fill: #e0762b; stroke: #b71c1c; stroke-width: 1.5; }
    .circleCl { fill: #00acc1; stroke: #00838f; stroke-width: 1.5; }
    .circleOH { fill: #00838f; stroke: #006064; stroke-width: 1.5; }
    .bottomBox { fill: #fff; stroke: #ffcc00; stroke-width: 2; }
    .bottomText { font-size: 20px; text-anchor: start; }
    .arrowGreen { stroke: #2e7d32; stroke-width: 3; fill: none; marker-end: url(#arrowheadGreen); }
    .redLine { stroke: #ff0000; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrowheadGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#2e7d32" />
    </marker>
  </defs>

  <!-- 上段: 弱酸の遊離 -->
  <g transform="translate(20, 10)">
    <rect x="75" y="0" width="100" height="25" fill="#fff" stroke="#4caf50" stroke-width="1.5" />
    <text x="125" y="18" fill="#4caf50" font-size="18">弱酸の遊離</text>

    <!-- ビーカー -->
    <path class="beaker" d="M 20 20 L 20 220 L 270 220 L 270 20" />
    <rect class="water" x="21" y="70" width="248" height="149" />
    <line class="beaker" x1="21" y1="70" x2="269" y2="70" />

    <!-- 添加する物質 -->
    <rect class="boxGreen" x="30" y="30" width="95" height="30" />
    <text x="77" y="52" class="wtext eq" font-size="18">CH<tspan font-size="12" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="12" dy="-8">-</tspan></text>
    
    <circle cx="145" cy="45" r="16" class="circleRed" />
    <text x="145" y="52" class="wtext eq" font-size="16">Na<tspan font-size="12" dy="-5">+</tspan></text>

    <text x="90" y="85" class="textOrange">すべて電離する</text>

    <!-- 遊離したCH3COOHの空枠 -->
    <rect class="boxOrange" x="35" y="95" width="95" height="40" />
    <text x="82" y="152" class="textOrange">遊離した</text>
    
    <!-- HCl -->
    <text x="155" y="155" class="eq textPurple" font-size="20">HCl</text>
    
    <!-- 電離している枠 -->
    <rect class="dashedPurple" x="80" y="165" width="160" height="48" />
    
    <circle cx="110" cy="190" r="16" class="circleH" />
    <text x="110" y="196" class="wtext eq" font-size="16">H<tspan font-size="12" dy="-5">+</tspan></text>

    <circle cx="210" cy="190" r="16" class="circleCl" />
    <text x="210" y="196" class="wtext eq" font-size="16">Cl<tspan font-size="12" dy="-5">-</tspan></text>

    <text x="160" y="235" class="textPurple">電離している</text>

    <!-- 右側の縦の電離している枠 (Cl-用) -->
    <rect class="dashedPurple" x="185" y="110" width="50" height="120" />
    <text x="252" y="125" class="textPurple">電</text>
    <text x="252" y="145" class="textPurple">離</text>
    <text x="252" y="165" class="textPurple">し</text>
    <text x="252" y="185" class="textPurple">て</text>
    <text x="252" y="205" class="textPurple">い</text>
    <text x="252" y="225" class="textPurple">る</text>
  </g>
  
  <text x="490" y="140" class="eq" font-size="22">CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COONa + HCl</tspan></text>
  <text x="490" y="175" class="eq" font-size="22">→ CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COOH + NaCl</tspan></text>

  <!-- 下段: 弱酸の塩の加水分解 -->
  <g transform="translate(20, 270)">
    <rect x="50" y="0" width="160" height="25" fill="#fff" stroke="#4caf50" stroke-width="1.5" />
    <text x="130" y="18" fill="#4caf50" font-size="18">弱酸の塩の加水分解</text>

    <!-- ビーカー -->
    <path class="beaker" d="M 20 20 L 20 220 L 270 220 L 270 20" />
    <rect class="water" x="21" y="70" width="248" height="149" />
    <line class="beaker" x1="21" y1="70" x2="269" y2="70" />

    <!-- 添加する物質 -->
    <rect class="boxGreen" x="30" y="30" width="95" height="30" />
    <text x="77" y="52" class="wtext eq" font-size="18">CH<tspan font-size="12" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="12" dy="-8">-</tspan></text>
    
    <circle cx="145" cy="45" r="16" class="circleRed" />
    <text x="145" y="52" class="wtext eq" font-size="16">Na<tspan font-size="12" dy="-5">+</tspan></text>

    <text x="90" y="85" class="textOrange">すべて電離する</text>

    <!-- 電離していないCH3COOHの空枠 -->
    <rect class="boxOrange" x="35" y="95" width="95" height="40" />
    <text x="82" y="152" class="textOrange">電離していない</text>

    <rect class="dashedPurple" x="125" y="155" width="120" height="55" />

    <!-- H2O -->
    <text x="180" y="145" class="eq textPurple" font-size="20">H<tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
    
    <circle cx="150" cy="180" r="16" class="circleH" />
    <text x="150" y="186" class="wtext eq" font-size="16">H<tspan font-size="12" dy="-5">+</tspan></text>

    <ellipse cx="210" cy="180" rx="26" ry="16" class="circleOH" />
    <text x="210" y="186" class="wtext eq" font-size="16">OH<tspan font-size="12" dy="-5">-</tspan></text>

    <!-- 縦枠 (OH-用) -->
    <rect class="dashedPurple" x="175" y="90" width="70" height="125" />
    <text x="252" y="105" class="textPurple">電</text>
    <text x="252" y="125" class="textPurple">離</text>
    <text x="252" y="145" class="textPurple">し</text>
    <text x="252" y="165" class="textPurple">て</text>
    <text x="252" y="185" class="textPurple">い</text>
    <text x="252" y="205" class="textPurple">る</text>

    <!-- 分解する -->
    <line class="redLine" x1="175" y1="130" x2="175" y2="210" />
    <text x="145" y="115" fill="#ff0000" font-size="14">分解する</text>
    
    <text x="210" y="235" fill="#ff0000" font-size="14">OH<tspan font-size="12" dy="-5">-</tspan><tspan dy="5">が余る</tspan></text>
    <text x="210" y="250" fill="#ff0000" font-size="14">ので塩基性</text>

    <!-- 矢印 -->
    <path class="arrowGreen" d="M 160 150 L 120 100" />

    <text x="65" y="180" class="textGreen" font-size="14">中和してもと</text>
    <text x="65" y="195" class="textGreen" font-size="14">に戻ることも</text>
    <text x="65" y="210" class="textGreen" font-size="14">ある可逆反応</text>
  </g>

  <text x="490" y="380" class="eq" font-size="22">CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8"> + H</tspan><tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  <text x="490" y="415" class="eq" font-size="22">⇄ CH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COOH + OH</tspan><tspan font-size="14" dy="-8">-</tspan></text>

  <!-- 下のテキスト枠 -->
  <rect class="bottomBox" x="10" y="530" width="660" height="40" />
  <text x="20" y="557" class="bottomText"><tspan fill="#e0762b">弱酸の</tspan><tspan font-weight="bold">遊離</tspan>，<tspan fill="#4caf50">弱酸の塩の</tspan><tspan font-weight="bold">加水分解</tspan>，どちらもCH<tspan font-size="14" dy="5">3</tspan><tspan dy="-5">COO</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8">がH</tspan><tspan font-size="14" dy="-8">+</tspan><tspan dy="8">とくっつく反応</tspan></text>

</svg>
