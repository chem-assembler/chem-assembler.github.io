<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
  <!-- 金属樹の生成と酸への溶解を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; }
    .titleText { font-family: "Times New Roman", serif; font-size: 20px; font-weight: bold; }
    .eq { font-family: "Times New Roman", serif; font-size: 20px; }
    .water { fill: #d4e6f1; }
    .beaker { fill: none; stroke: #222; stroke-width: 1.5; }
    .electrode { fill: #b0bec5; stroke: #222; stroke-width: 1.5; }
    .cuLayer { fill: #e0762b; stroke: #222; stroke-width: 1.5; }
    .circleZn { fill: #9e9e9e; stroke: #222; stroke-width: 1.5; }
    .circleCu { fill: #e0762b; stroke: #222; stroke-width: 1.5; }
    .circleH { fill: #2e7d32; stroke: #222; stroke-width: 1.5; }
    .arrowBlue { stroke: #1f618d; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadBlue); }
    .arrowYellow { fill: #ffff00; stroke: #222; stroke-width: 1.5; }
    .lead { stroke: #e0762b; stroke-width: 1.5; fill: none; }
    .textOrange { fill: #e0762b; }
    .lineEq { stroke: #222; stroke-width: 1.5; }
    .wtext { fill: #fff; text-anchor: middle; }
    .ctext { text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowheadBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#1f618d" />
    </marker>
  </defs>

  <!-- 左側: 金属樹の生成 -->
  <g transform="translate(10, 10)">
    <text x="0" y="15" class="titleText">【金属樹の生成】</text>
    
    <!-- ビーカー -->
    <path class="beaker" d="M 0 30 L 0 180 L 120 180 L 120 30" />
    <rect class="water" x="1" y="80" width="118" height="99" />
    <line class="beaker" x1="1" y1="80" x2="119" y2="80" />

    <!-- 銅樹 -->
    <rect class="cuLayer" x="5" y="75" width="40" height="65" />
    <!-- 亜鉛板 -->
    <rect class="electrode" x="10" y="30" width="30" height="105" />
    <!-- Move Zn text slightly up so it's not in the cuLayer -->
    <text x="25" y="65" class="eq ctext">Zn</text>

    <!-- 電子の流れ -->
    <path class="arrowYellow" d="M 25 90 L 25 110 A 10 10 0 0 0 35 120 L 45 120 L 45 115 L 55 125 L 45 135 L 45 130 L 35 130 A 20 20 0 0 1 15 110 L 15 90 Z" />
    <text x="65" y="145" class="eq ctext">e<tspan font-size="12" dy="-8">-</tspan></text>

    <!-- 引き出し線 -->
    <text x="65" y="45" class="textOrange">銅樹</text>
    <path class="lead" d="M 60 50 L 45 75" />

    <!-- イオン -->
    <circle cx="85" cy="155" r="22" class="circleCu" />
    <text x="85" y="161" class="wtext eq">Cu<tspan font-size="12" dy="-8">2+</tspan></text>
    <path class="arrowBlue" d="M 70 145 L 55 135" />

    <!-- Shift Zn2+ left to not overflow beaker -->
    <circle cx="85" cy="100" r="22" class="circleZn" />
    <text x="85" y="106" class="eq ctext">Zn<tspan font-size="12" dy="-8">2+</tspan></text>
    <path class="arrowBlue" d="M 55 120 L 65 105" />

    <!-- テキスト -->
    <text x="135" y="65">イオン化傾向は Zn ＞ Cu</text>
    <text x="135" y="90">なのでZnの方が陽イオ</text>
    <text x="135" y="115">ンになりやすい</text>

    <!-- 反応式 -->
    <text x="40" y="215" class="eq">Zn</text>
    <text x="140" y="215" class="eq">→ Zn<tspan font-size="14" dy="-8">2+</tspan><tspan dy="8"> ＋ 2e</tspan><tspan font-size="14" dy="-8">-</tspan></text>
    
    <text x="10" y="245" class="eq">＋）</text>
    <text x="40" y="245" class="eq">Cu<tspan font-size="14" dy="-8">2+</tspan><tspan dy="8"> ＋ 2e</tspan><tspan font-size="14" dy="-8">-</tspan></text>
    <text x="140" y="245" class="eq">→ Cu</text>

    <line class="lineEq" x1="15" y1="255" x2="275" y2="255" />

    <text x="40" y="280" class="eq">Zn ＋ Cu<tspan font-size="14" dy="-8">2+</tspan></text>
    <text x="140" y="280" class="eq">→ Zn<tspan font-size="14" dy="-8">2+</tspan><tspan dy="8"> ＋ Cu</tspan></text>
  </g>

  <!-- 右側: 金属が希酸に溶解する反応 -->
  <g transform="translate(340, 10)">
    <text x="0" y="15" class="titleText">【金属が希酸に溶解する反応】</text>
    
    <!-- ビーカー -->
    <path class="beaker" d="M 0 30 L 0 180 L 120 180 L 120 30" />
    <rect class="water" x="1" y="80" width="118" height="99" />
    <line class="beaker" x1="1" y1="80" x2="119" y2="80" />

    <!-- 亜鉛板 -->
    <rect class="electrode" x="10" y="30" width="30" height="105" />
    <text x="25" y="65" class="eq ctext">Zn</text>

    <!-- 電子の流れ -->
    <path class="arrowYellow" d="M 25 90 L 25 110 A 10 10 0 0 0 35 120 L 45 120 L 45 115 L 55 125 L 45 135 L 45 130 L 35 130 A 20 20 0 0 1 15 110 L 15 90 Z" />
    <text x="65" y="145" class="eq ctext">e<tspan font-size="12" dy="-8">-</tspan></text>

    <!-- イオン -->
    <circle cx="85" cy="155" r="22" class="circleH" />
    <text x="85" y="161" class="wtext eq">H<tspan font-size="12" dy="-5">+</tspan></text>
    <path class="arrowBlue" d="M 70 145 L 55 130" />

    <circle cx="85" cy="110" r="22" class="circleZn" />
    <text x="85" y="116" class="eq ctext">Zn<tspan font-size="12" dy="-8">2+</tspan></text>
    <path class="arrowBlue" d="M 55 125 L 65 115" />

    <circle cx="80" cy="50" r="22" class="circleH" />
    <text x="80" y="56" class="wtext eq">H<tspan font-size="12" dy="5">2</tspan></text>
    <path class="arrowBlue" d="M 55 120 L 70 65" />

    <!-- テキスト -->
    <text x="135" y="65">イオン化傾向は Zn ＞ H<tspan font-size="12" dy="5">2</tspan></text>
    <text x="135" y="90">なのでZnの方が陽イオ</text>
    <text x="135" y="115">ンになりやすい</text>

    <!-- 反応式 -->
    <text x="40" y="215" class="eq">Zn</text>
    <text x="140" y="215" class="eq">→ Zn<tspan font-size="14" dy="-8">2+</tspan><tspan dy="8"> ＋ 2e</tspan><tspan font-size="14" dy="-8">-</tspan></text>
    
    <text x="10" y="245" class="eq">＋）</text>
    <text x="40" y="245" class="eq">2H<tspan font-size="14" dy="-8">+</tspan><tspan dy="8"> ＋ 2e</tspan><tspan font-size="14" dy="-8">-</tspan></text>
    <text x="140" y="245" class="eq">→ H<tspan font-size="14" dy="5">2</tspan><tspan dy="-5">↑</tspan></text>

    <line class="lineEq" x1="15" y1="255" x2="275" y2="255" />

    <text x="40" y="280" class="eq">Zn ＋ 2H<tspan font-size="14" dy="-8">+</tspan></text>
    <text x="140" y="280" class="eq">→ Zn<tspan font-size="14" dy="-8">2+</tspan><tspan dy="8"> ＋ H</tspan><tspan font-size="14" dy="5">2</tspan><tspan dy="-5">↑</tspan></text>
  </g>

  <!-- 下部テキスト -->
  <circle cx="20" cy="355" r="4" fill="#222" />
  <text x="35" y="360">Hは非金属元素だが例外的に陽イオンになるので，他の金属と同じようにイオン</text>
  <text x="35" y="380">化列の位置から性質を考えることができる</text>

  <circle cx="20" cy="405" r="4" fill="#222" />
  <text x="35" y="410">「金属樹の生成」と「金属が希酸に溶解する反応」は同じ仕組みであり，生じた</text>
  <text x="35" y="430">単体が「金属の固体」か「非金属の気体」かの違いしかない</text>

</svg>
