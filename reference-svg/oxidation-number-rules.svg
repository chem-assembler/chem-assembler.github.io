<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
  <!-- 酸化数の決定ルールと優先順位を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
    .leftText { text-anchor: start; }
    .eq { font-family: "Times New Roman", serif; font-size: 26px; }
    .lineTable { stroke: #222; stroke-width: 1.5; fill: none; }
    .arrowBlue { stroke: #1f618d; stroke-width: 4; fill: none; marker-end: url(#arrowheadBlue); }
    .arrowOrange { stroke: #e0762b; stroke-width: 2; fill: none; marker-end: url(#arrowheadOrange); }
    .textBlue { fill: #1f618d; font-size: 20px; font-weight: bold; }
    .boxOrange { fill: #fff; stroke: #e0762b; stroke-width: 1.5; }
    .boxText { font-size: 16px; }
    .textOrange { fill: #e0762b; font-size: 18px; }
    .textOxi { fill: #1f618d; font-size: 18px; }
    .underline { stroke: #222; stroke-width: 1.5; }
    .lead { stroke: #e0762b; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="arrowheadBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#1f618d" />
    </marker>
    <marker id="arrowheadOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#e0762b" />
    </marker>
  </defs>

  <!-- 上部: 優先順位の矢印 -->
  <path class="arrowBlue" d="M 30 40 L 30 200" />
  <text x="20" y="100" class="textBlue">優</text>
  <text x="20" y="125" class="textBlue">先</text>
  <text x="20" y="150" class="textBlue">順</text>
  <text x="20" y="175" class="textBlue">位</text>

  <!-- 上部: テーブル -->
  <!-- 横線 -->
  <line class="lineTable" x1="50" y1="10" x2="670" y2="10" />
  <line class="lineTable" x1="50" y1="40" x2="670" y2="40" />
  <line class="lineTable" x1="50" y1="75" x2="670" y2="75" />
  <line class="lineTable" x1="50" y1="110" x2="670" y2="110" />
  <line class="lineTable" x1="50" y1="145" x2="670" y2="145" />
  <line class="lineTable" x1="50" y1="180" x2="670" y2="180" />
  <line class="lineTable" x1="50" y1="215" x2="670" y2="215" />

  <!-- 縦線 -->
  <line class="lineTable" x1="50" y1="10" x2="50" y2="215" />
  <line class="lineTable" x1="220" y1="10" x2="220" y2="215" />
  <line class="lineTable" x1="280" y1="10" x2="280" y2="215" />
  <line class="lineTable" x1="670" y1="10" x2="670" y2="215" />

  <!-- 見出し行 -->
  <text x="135" y="32">原子</text>
  <text x="250" y="32">酸化数</text>
  <text x="475" y="32">備考</text>

  <!-- 1行目 -->
  <text x="135" y="65">アルカリ金属</text>
  <text x="250" y="65">+1</text>
  <text x="290" y="65" class="leftText">絶対に+1</text>

  <!-- 2行目 -->
  <text x="135" y="100">アルカリ土類金属</text>
  <text x="250" y="100">+2</text>
  <text x="290" y="100" class="leftText">絶対に+2，Mgも+2</text>

  <!-- 3行目 -->
  <text x="135" y="135" class="eq" font-size="22">H</text>
  <text x="250" y="135">+1</text>
  <text x="290" y="135" class="leftText">NaHなど金属の水素化物中ではH<tspan font-size="12" dy="-8">-</tspan><tspan dy="8">となっており−1</tspan></text>

  <!-- 4行目 -->
  <text x="135" y="170" class="eq" font-size="22">O</text>
  <text x="250" y="170">-2</text>
  <text x="290" y="170" class="leftText">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan font-size="12" dy="5">2</tspan><tspan dy="-5">など過酸化物中では−1</tspan></text>

  <!-- 5行目 -->
  <text x="135" y="205">ハロゲン</text>
  <text x="250" y="205">-1</text>
  <text x="290" y="205" class="leftText">F以外は−1〜+7の酸化数をとり例外はそれなりにある</text>

  <!-- 下部テキスト -->
  <text x="20" y="250" class="leftText" font-size="22">電解質はまずイオンに分解し，優先順位にしたがって酸化数を決定する</text>

  <!-- 例の計算 -->
  <g transform="translate(0, 40)">
    <!-- 反応式 -->
    <text x="140" y="340" class="eq">Cu(NO<tspan font-size="16" dy="5">3</tspan><tspan dy="-5">)</tspan><tspan font-size="16" dy="5">2</tspan></text>
    <text x="205" y="335" class="eq">→</text>
    
    <text x="235" y="340" class="eq">Cu<tspan font-size="16" dy="-10">2+</tspan></text>
    <line class="underline" x1="225" y1="345" x2="255" y2="345" />
    <text x="240" y="365" class="textOxi">+2</text>
    
    <text x="270" y="335" class="eq">＋</text>
    <text x="310" y="340" class="eq">2NO<tspan font-size="16" dy="5">3</tspan><tspan font-size="16" dy="-15">-</tspan></text>

    <!-- さらに分解 -->
    <text x="400" y="325" class="textOrange">さらに分解</text>
    <path class="arrowOrange" d="M 350 335 L 450 335" />

    <text x="490" y="340" class="eq">NO<tspan font-size="16" dy="5">3</tspan><tspan font-size="16" dy="-15">-</tspan></text>
    <text x="535" y="335" class="eq">→</text>

    <text x="560" y="340" class="eq">N<tspan font-size="16" dy="-10">5+</tspan></text>
    <line class="underline" x1="552" y1="345" x2="577" y2="345" />
    <text x="565" y="365" class="textOxi">+5</text>

    <text x="590" y="335" class="eq">＋</text>
    
    <text x="625" y="340" class="eq">3O<tspan font-size="16" dy="-10">2-</tspan></text>
    <line class="underline" x1="615" y1="345" x2="640" y2="345" />
    <text x="628" y="365" class="textOxi">-2</text>

    <!-- 吹き出し 1 -->
    <rect class="boxOrange" x="30" y="260" width="130" height="40" />
    <text x="95" y="278" class="boxText">①電離できるもの</text>
    <text x="95" y="295" class="boxText">はまず電離する</text>
    <path class="lead" d="M 160 290 L 175 320" />

    <!-- 吹き出し 2 -->
    <rect class="boxOrange" x="175" y="260" width="165" height="40" />
    <text x="257" y="278" class="boxText">②単原子イオンの酸化</text>
    <text x="257" y="295" class="boxText">数は電荷と一致する</text>
    <path class="lead" d="M 210 300 L 225 320" />

    <!-- 吹き出し 4 (左から順に並べるため調整) -->
    <rect class="boxOrange" x="355" y="260" width="130" height="40" />
    <text x="420" y="278" class="boxText">④イオン全体の電</text>
    <text x="420" y="295" class="boxText">荷を合わせる</text>
    <path class="lead" d="M 470 300 L 490 320" />

    <!-- 吹き出し 3 -->
    <rect class="boxOrange" x="500" y="260" width="170" height="40" />
    <text x="585" y="278" class="boxText">③酸化数がわかる原子</text>
    <text x="585" y="295" class="boxText">から酸化数を決める</text>
    <path class="lead" d="M 520 300 L 515 320" />
    <path class="lead" d="M 620 300 L 625 320" />
  </g>

</svg>
