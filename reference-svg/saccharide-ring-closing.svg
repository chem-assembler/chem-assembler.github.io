<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img">
  <!-- 鎖状のグルコースが巻き込んで六員環になるところ。
       左＝鎖を丸めて 5位の -OH の酸素を 1位の炭素に近づけた形（矢印でつなぐ先を示す）。
       右＝閉じたあとの六員環（1位に新しくできた -OH を丸で囲む）。
       ⚠ 1位の -OH の向き（α形・β形）はここでは決めない ＝ 次の図の役目。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .bond { stroke: #333; stroke-width: 2.5; fill: none; }
    .atom { font-size: 17px; fill: #222; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5; }
    .num { font-size: 13px; fill: #888; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4; }
    .ttl { font-size: 19px; fill: #222; text-anchor: middle; }
    .note { font-size: 16px; fill: #333; text-anchor: middle; }
    .hl { stroke: #6a1b9a; stroke-width: 3; fill: none; }
    .mark { fill: none; stroke: #6a1b9a; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .pur { fill: #6a1b9a; }
  </style>

  <!-- ================= 左: 鎖を丸めたところ ================= -->
  <text class="ttl" x="200" y="44">鎖状構造を丸める</text>

  <!-- 炭素の骨格 1-2-3-4-5-6 -->
  <path class="bond" d="M 220 104 L 130 120 L 85 200 L 130 280 L 220 310 L 300 275" />

  <text class="atom" x="220" y="96" fill="#6a1b9a">CHO</text>
  <text class="atom" x="330" y="268">CH₂OH</text>

  <!-- 2・3・4 位の -OH（外向き） -->
  <path class="bond" d="M 130 120 L 118 82" />
  <text class="atom" x="114" y="72">OH</text>
  <path class="bond" d="M 85 200 L 45 200" />
  <text class="atom" x="30" y="206">OH</text>
  <path class="bond" d="M 130 280 L 118 318" />
  <text class="atom" x="114" y="336">OH</text>

  <!-- 5位の -OH（環の中へ向く） -->
  <path class="hl" d="M 220 310 L 220 272" />
  <text class="atom" x="220" y="262" fill="#6a1b9a">OH</text>

  <text class="num" x="246" y="116">1</text>
  <text class="num" x="152" y="140">2</text>
  <text class="num" x="110" y="200">3</text>
  <text class="num" x="152" y="268">4</text>
  <text class="num" x="238" y="296">5</text>
  <text class="num" x="296" y="252">6</text>

  <!-- 酸素が 1位の炭素へ向かう矢印 -->
  <path class="hl" d="M 220 248 L 220 132" stroke-dasharray="7 5" />
  <polygon points="220 120, 213 136, 227 136" class="pur" />

  <text class="note" x="196" y="378">5位の −OH の酸素が</text>
  <text class="note" x="196" y="402">1位の炭素とつながる</text>

  <!-- ================= まん中の矢印 ================= -->
  <path class="bond" d="M 396 200 L 456 200" stroke-width="3" />
  <polygon points="470 200, 452 193, 452 207" fill="#333" />
  <text class="note" x="433" y="182">環が閉じる</text>

  <!-- ================= 右: 六員環 ================= -->
  <text class="ttl" x="650" y="44">環状構造</text>

  <path class="bond" d="M 730 200 L 690 131" />
  <path class="bond" d="M 670 131 L 610 131" />
  <path class="bond" d="M 610 131 L 570 200 L 610 269 L 690 269 L 730 200" />
  <text class="atom" x="680" y="138">O</text>

  <!-- 5位の CH2OH -->
  <path class="bond" d="M 610 131 L 610 95" />
  <text class="atom" x="610" y="86">CH₂OH</text>
  <!-- 2・3・4 位の -OH -->
  <path class="bond" d="M 690 269 L 690 305" />
  <text class="atom" x="690" y="325">OH</text>
  <path class="bond" d="M 610 269 L 610 305" />
  <text class="atom" x="610" y="325">OH</text>
  <path class="bond" d="M 570 200 L 530 200" />
  <text class="atom" x="517" y="206">OH</text>

  <!-- 1位に新しくできた -OH -->
  <path class="hl" d="M 730 200 L 772 200" />
  <text class="atom" x="792" y="206" fill="#6a1b9a">OH</text>
  <ellipse class="mark" cx="784" cy="200" rx="38" ry="22" />

  <text class="num" x="704" y="205">1</text>
  <text class="num" x="677" y="247">2</text>
  <text class="num" x="623" y="247">3</text>
  <text class="num" x="596" y="205">4</text>
  <text class="num" x="623" y="158">5</text>

  <text class="note" x="650" y="378">1位に新しく −OH ができる</text>
  <text class="note" x="650" y="402">（この −OH の向きが α形・β形の違い）</text>
</svg>
