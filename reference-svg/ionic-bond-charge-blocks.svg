<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
  <!-- 組成式は電荷の合計が0になる比（2026-09-25・ユーザーの校正「ここは補足でなくて重要な式…具体例で説明しながら」）。
       Al³⁺ と SO₄²⁻ を、電荷1つ＝ブロック1個で並べ、＋の列と−の列の長さがそろうところ（＋6 と −6）で数が決まることを見せる。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <style>
    .p { fill: #ffcc80; stroke: #e65100; stroke-width: 1.5; }
    .m { fill: #90caf9; stroke: #1565c0; stroke-width: 1.5; }
    .grp { fill: none; stroke: #333; stroke-width: 2; rx: 6; }
    .sign { font-family: system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #333; }
    .t { font-family: system-ui, sans-serif; font-size: 18px; fill: #222; }
    .b { font-family: system-ui, sans-serif; font-size: 20px; fill: #222; font-weight: 700; }
    .s { font-family: system-ui, sans-serif; font-size: 16px; fill: #444; }
  </style>
  <!-- 1ブロック 48px。＋6 と −6 はどちらも 288px -->
  <text class="b" x="30" y="40">Al³⁺ を2個 ＝ ＋6</text>
  <!-- Al³⁺ 1個目 -->
  <rect class="p" x="150" y="56" width="48" height="48" /><text class="sign" x="174" y="88" text-anchor="middle">＋</text>
  <rect class="p" x="198" y="56" width="48" height="48" /><text class="sign" x="222" y="88" text-anchor="middle">＋</text>
  <rect class="p" x="246" y="56" width="48" height="48" /><text class="sign" x="270" y="88" text-anchor="middle">＋</text>
  <rect class="grp" x="148" y="54" width="148" height="52" />
  <!-- Al³⁺ 2個目 -->
  <rect class="p" x="294" y="56" width="48" height="48" /><text class="sign" x="318" y="88" text-anchor="middle">＋</text>
  <rect class="p" x="342" y="56" width="48" height="48" /><text class="sign" x="366" y="88" text-anchor="middle">＋</text>
  <rect class="p" x="390" y="56" width="48" height="48" /><text class="sign" x="414" y="88" text-anchor="middle">＋</text>
  <rect class="grp" x="292" y="54" width="148" height="52" />
  <text class="s" x="222" y="126" text-anchor="middle">Al³⁺</text>
  <text class="s" x="366" y="126" text-anchor="middle">Al³⁺</text>

  <text class="b" x="30" y="170">SO₄²⁻ を3個 ＝ −6</text>
  <rect class="m" x="150" y="186" width="48" height="48" /><text class="sign" x="174" y="218" text-anchor="middle">−</text>
  <rect class="m" x="198" y="186" width="48" height="48" /><text class="sign" x="222" y="218" text-anchor="middle">−</text>
  <rect class="grp" x="148" y="184" width="100" height="52" />
  <rect class="m" x="246" y="186" width="48" height="48" /><text class="sign" x="270" y="218" text-anchor="middle">−</text>
  <rect class="m" x="294" y="186" width="48" height="48" /><text class="sign" x="318" y="218" text-anchor="middle">−</text>
  <rect class="grp" x="244" y="184" width="100" height="52" />
  <rect class="m" x="342" y="186" width="48" height="48" /><text class="sign" x="366" y="218" text-anchor="middle">−</text>
  <rect class="m" x="390" y="186" width="48" height="48" /><text class="sign" x="414" y="218" text-anchor="middle">−</text>
  <rect class="grp" x="340" y="184" width="100" height="52" />
  <text class="s" x="198" y="256" text-anchor="middle">SO₄²⁻</text>
  <text class="s" x="294" y="256" text-anchor="middle">SO₄²⁻</text>
  <text class="s" x="390" y="256" text-anchor="middle">SO₄²⁻</text>

  <!-- 長さがそろう -->
  <path d="M 440 50 L 440 240" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" />
  <text class="t" x="458" y="110">＋と−の列が</text>
  <text class="t" x="458" y="136">同じ長さ（6）で</text>
  <text class="t" x="458" y="162">そろう</text>
  <text class="b" x="458" y="206">2 : 3</text>
  <text class="b" x="458" y="236">→ Al₂(SO₄)₃</text>
  <text class="s" x="30" y="300">電荷1つをブロック1個で表す。＋と−の合計が等しくなる（合わせて 0 になる）ところで数の比が決まる</text>
</svg>
