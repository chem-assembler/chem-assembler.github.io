<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img">
  <!-- シリコーンゴムの主鎖 −Si(CH₃)₂−O−。Si と O が交互に並び、Si には CH₃ が2個ずつ付く（Si の手は4本）。
       ★ 主鎖に炭素が無いことを見せたいので、主鎖の一列だけ地色を敷く。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .bond { stroke: #333; stroke-width: 2.5; fill: none; }
    .atom { font-size: 26px; fill: #222; }
    .side { font-size: 22px; fill: #222; }
    .cont { font-size: 26px; fill: #888; }
    .band { fill: #e3f0fb; }
    .leader { stroke: #666; stroke-width: 1.5; fill: none; }
    .lab { font-size: 16px; fill: #333; }
  </style>

  <!-- 主鎖の地色 -->
  <rect class="band" x="120" y="136" width="600" height="46" rx="8" />

  <!-- 主鎖 …−Si−O−Si−O−Si−O−… -->
  <text class="cont" x="100" y="169" text-anchor="middle">…</text>
  <path class="bond" d="M 118 160 L 158 160" />
  <text class="atom" x="180" y="169" text-anchor="middle">Si</text>
  <path class="bond" d="M 202 160 L 266 160" />
  <text class="atom" x="280" y="169" text-anchor="middle">O</text>
  <path class="bond" d="M 294 160 L 358 160" />
  <text class="atom" x="380" y="169" text-anchor="middle">Si</text>
  <path class="bond" d="M 402 160 L 466 160" />
  <text class="atom" x="480" y="169" text-anchor="middle">O</text>
  <path class="bond" d="M 494 160 L 558 160" />
  <text class="atom" x="580" y="169" text-anchor="middle">Si</text>
  <path class="bond" d="M 602 160 L 666 160" />
  <text class="atom" x="680" y="169" text-anchor="middle">O</text>
  <path class="bond" d="M 694 160 L 730 160" />
  <text class="cont" x="750" y="169" text-anchor="middle">…</text>

  <!-- 側鎖のメチル基（Si 1個に2個ずつ） -->
  <path class="bond" d="M 180 144 L 180 112" />
  <text class="side" x="180" y="102" text-anchor="middle">CH₃</text>
  <path class="bond" d="M 180 176 L 180 208" />
  <text class="side" x="180" y="236" text-anchor="middle">CH₃</text>
  <path class="bond" d="M 380 144 L 380 112" />
  <text class="side" x="380" y="102" text-anchor="middle">CH₃</text>
  <path class="bond" d="M 380 176 L 380 208" />
  <text class="side" x="380" y="236" text-anchor="middle">CH₃</text>
  <path class="bond" d="M 580 144 L 580 112" />
  <text class="side" x="580" y="102" text-anchor="middle">CH₃</text>
  <path class="bond" d="M 580 176 L 580 208" />
  <text class="side" x="580" y="236" text-anchor="middle">CH₃</text>

  <path class="leader" d="M 652 92 L 612 98" />
  <text class="lab" x="658" y="97" text-anchor="start">メチル基</text>
  <text class="lab" x="420" y="290" text-anchor="middle">主鎖 —— Si と O が交互に並び、C を含まない</text>
</svg>
