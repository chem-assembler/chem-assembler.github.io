<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img">
  <!-- 酸・塩基の価数を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 20px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .baseBox { fill: #0070c0; stroke: #003366; stroke-width: 2; rx: 8; }
    .acidBox { fill: #ff0000; stroke: #990000; stroke-width: 2; rx: 8; }
    .h2oPool { fill: #009966; stroke: #004d33; stroke-width: 2; }
    .arrow { fill: #ffff00; stroke: #000; stroke-width: 2; }
    
    .posIon { fill: #f0cbb5; stroke: #222; stroke-width: 1.5; }
    .negIon { fill: #a5d4a1; stroke: #222; stroke-width: 1.5; }
    .ohMinus { fill: #165b7c; stroke: #10425a; stroke-width: 1.5; }
    .hPlus { fill: #d35400; stroke: #993d00; stroke-width: 1.5; }
    
    .valenceBox { fill: #cba0c9; rx: 8; }
    .descBox { fill: #fff; stroke: #e0762b; stroke-width: 2; }
    .bottomBox { fill: #fff; stroke: #222; stroke-width: 2; }
    .lead { stroke: #e0762b; stroke-width: 2; fill: none; }
  </style>

  <!-- 上段: 中和の基本 -->
  <rect class="baseBox" x="180" y="20" width="80" height="70" />
  <text x="220" y="60" class="wtext" font-size="22">塩基</text>

  <rect class="acidBox" x="420" y="20" width="80" height="70" />
  <text x="460" y="60" class="wtext" font-size="22">酸</text>

  <ellipse cx="340" cy="55" rx="35" ry="25" class="h2oPool" />
  <text x="340" y="62" class="wtext">H<tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  <text x="340" y="105" font-size="24" fill="#e0762b" font-weight="bold">中和</text>

  <polygon points="260,50 290,50 290,40 305,55 290,70 290,60 260,60" class="arrow" />
  <text x="280" y="35" font-size="22">OH<tspan font-size="14" dy="-8">-</tspan></text>

  <polygon points="420,50 390,50 390,40 375,55 390,70 390,60 420,60" class="arrow" />
  <text x="400" y="35" font-size="22">H<tspan font-size="14" dy="-8">+</tspan></text>

  <!-- 中段タイトル -->
  <text x="340" y="145" font-size="24">H<tspan font-size="16" dy="-10">+</tspan><tspan dy="10">とOH</tspan><tspan font-size="16" dy="-10">-</tspan><tspan dy="10"> 2個ずつで中和反応してH</tspan><tspan font-size="16" dy="5">2</tspan><tspan dy="-5">Oを2個つくる場合</tspan></text>

  <!-- 左: 1価の酸2個 -->
  <!-- 1行目 -->
  <ellipse cx="60" cy="220" rx="30" ry="22" class="posIon" />
  <text x="60" y="226" font-size="16">＋イオン</text>
  <circle cx="115" cy="220" r="22" class="ohMinus" />
  <text x="115" y="226" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  <polygon points="140,215 155,215 155,210 165,220 155,230 155,225 140,225" class="arrow" />
  <ellipse cx="200" cy="220" rx="30" ry="22" class="h2oPool" />
  <text x="200" y="226" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

  <rect class="valenceBox" x="255" y="180" width="105" height="70" />
  <text x="307" y="198" class="wtext" font-size="16">1価</text>
  <polygon points="275,215 260,215 260,210 250,220 260,230 260,225 275,225" class="arrow" />
  <circle cx="295" cy="220" r="22" class="hPlus" />
  <text x="295" y="226" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <ellipse cx="330" cy="220" rx="30" ry="22" class="negIon" />
  <text x="330" y="226" font-size="16">－イオン</text>

  <!-- 2行目 -->
  <ellipse cx="60" cy="290" rx="30" ry="22" class="posIon" />
  <text x="60" y="296" font-size="16">＋イオン</text>
  <circle cx="115" cy="290" r="22" class="ohMinus" />
  <text x="115" y="296" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  <polygon points="140,285 155,285 155,280 165,290 155,300 155,295 140,295" class="arrow" />
  <ellipse cx="200" cy="290" rx="30" ry="22" class="h2oPool" />
  <text x="200" y="296" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

  <rect class="valenceBox" x="255" y="250" width="105" height="70" />
  <text x="307" y="268" class="wtext" font-size="16">1価</text>
  <polygon points="275,285 260,285 260,280 250,290 260,300 260,295 275,295" class="arrow" />
  <circle cx="295" cy="290" r="22" class="hPlus" />
  <text x="295" y="296" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <ellipse cx="330" cy="290" rx="30" ry="22" class="negIon" />
  <text x="330" y="296" font-size="16">－イオン</text>

  <rect class="descBox" x="20" y="340" width="310" height="40" />
  <text x="175" y="367" font-size="20">2個のH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">を出すのに2個の酸が必要</tspan></text>
  <path class="lead" d="M 280 340 L 305 320" />


  <!-- 右: 2価の酸1個 -->
  <!-- 1行目 -->
  <ellipse cx="380" cy="220" rx="30" ry="22" class="posIon" />
  <text x="380" y="226" font-size="16">＋イオン</text>
  <circle cx="435" cy="220" r="22" class="ohMinus" />
  <text x="435" y="226" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  <polygon points="460,215 475,215 475,210 485,220 475,230 475,225 460,225" class="arrow" />
  <ellipse cx="520" cy="220" rx="30" ry="22" class="h2oPool" />
  <text x="520" y="226" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

  <!-- 2行目 -->
  <ellipse cx="380" cy="290" rx="30" ry="22" class="posIon" />
  <text x="380" y="296" font-size="16">＋イオン</text>
  <circle cx="435" cy="290" r="22" class="ohMinus" />
  <text x="435" y="296" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  <polygon points="460,285 475,285 475,280 485,290 475,300 475,295 460,295" class="arrow" />
  <ellipse cx="520" cy="290" rx="30" ry="22" class="h2oPool" />
  <text x="520" y="296" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

  <rect class="valenceBox" x="555" y="200" width="105" height="110" />
  <text x="607" y="218" class="wtext" font-size="16">2価</text>

  <!-- 矢印斜め -->
  <polygon points="575,240 565,235 567,230 555,225 560,240 562,235 572,240" class="arrow" transform="rotate(30, 565, 230)" />
  <circle cx="590" cy="235" r="22" class="hPlus" />
  <text x="590" y="241" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>

  <polygon points="575,270 565,275 567,280 555,285 560,270 562,275 572,270" class="arrow" transform="rotate(-30, 565, 280)" />
  <circle cx="590" cy="275" r="22" class="hPlus" />
  <text x="590" y="281" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>

  <ellipse cx="625" cy="255" rx="30" ry="22" class="negIon" />
  <text x="625" y="261" font-size="16">－イオン</text>

  <rect class="descBox" x="350" y="340" width="310" height="40" />
  <text x="505" y="367" font-size="20">1個の酸で2個のH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">酸を出せる</tspan></text>
  <path class="lead" d="M 540 340 L 590 300" />

  <!-- 下段テキスト -->
  <rect class="bottomBox" x="10" y="400" width="660" height="40" />
  <text x="340" y="427" font-size="22">1個の酸が出すH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">の数が酸の価数， 1個の塩基が出すOH</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8">の数が塩基の価数</tspan></text>

</svg>
