<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img">
  <!-- 酸・塩基の価数を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .baseBox { fill: #0070c0; stroke: #003366; stroke-width: 2; rx: 8; }
    .acidBox { fill: #ff0000; stroke: #990000; stroke-width: 2; rx: 8; }
    .h2oPool { fill: #009966; stroke: #004d33; stroke-width: 2; }
    .arrow { fill: #ffff00; stroke: #000; stroke-width: 2; }
    
    .posIon { fill: #f0cbb5; stroke: #222; stroke-width: 1.5; }
    .negIon { fill: #a5d4a1; stroke: #222; stroke-width: 1.5; }
    .ohMinus { fill: #165b7c; stroke: #10425a; stroke-width: 1.5; }
    .hPlus { fill: #d35400; stroke: #993d00; stroke-width: 1.5; }
    
    .valenceBox { fill: #cba0c9; rx: 8; }
    .descBox { fill: #fff; stroke: #e0762b; stroke-width: 2; }
    .bottomBox { fill: #fff; stroke: #222; stroke-width: 2; }
    .lead { stroke: #e0762b; stroke-width: 2; fill: none; }
  </style>

  <!-- 上段: 中和の基本 -->
  <rect class="baseBox" x="180" y="20" width="80" height="70" />
  <text x="220" y="60" class="wtext" font-size="22">塩基</text>

  <rect class="acidBox" x="420" y="20" width="80" height="70" />
  <text x="460" y="60" class="wtext" font-size="22">酸</text>

  <ellipse cx="340" cy="55" rx="35" ry="25" class="h2oPool" />
  <text x="340" y="62" class="wtext">H<tspan font-size="14" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  <text x="340" y="105" font-size="24" fill="#e0762b" font-weight="bold">中和</text>

  <polygon points="260,50 290,50 290,40 305,55 290,70 290,60 260,60" class="arrow" />
  <text x="280" y="35" font-size="22">OH<tspan font-size="14" dy="-8">-</tspan></text>

  <polygon points="420,50 390,50 390,40 375,55 390,70 390,60 420,60" class="arrow" />
  <text x="400" y="35" font-size="22">H<tspan font-size="14" dy="-8">+</tspan></text>

  <!-- 中段タイトル -->
  <text x="340" y="145" font-size="20">H<tspan font-size="14" dy="-10">+</tspan><tspan dy="10">とOH</tspan><tspan font-size="14" dy="-10">-</tspan><tspan dy="10"> 2個ずつで中和反応してH</tspan><tspan font-size="14" dy="5">2</tspan><tspan dy="-5">Oを2個つくる場合</tspan></text>

  <!-- Line 1: 1価 -->
  <ellipse cx="160" cy="200" rx="42" ry="24" class="posIon" />
  <text x="160" y="206" font-size="16">＋イオン</text>
  
  <circle cx="240" cy="200" r="24" class="ohMinus" />
  <text x="240" y="206" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  
  <polygon points="270,195 285,195 285,190 300,200 285,210 285,205 270,205" class="arrow" />
  
  <ellipse cx="340" cy="200" rx="35" ry="24" class="h2oPool" />
  <text x="340" y="206" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  
  <polygon points="410,195 395,195 395,190 380,200 395,210 395,205 410,205" class="arrow" />
  
  <rect class="valenceBox" x="405" y="165" width="165" height="70" />
  <text x="430" y="185" class="wtext" font-size="16">1価</text>
  <circle cx="440" cy="200" r="24" class="hPlus" />
  <text x="440" y="206" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <ellipse cx="520" cy="200" rx="40" ry="24" class="negIon" />
  <text x="520" y="206" font-size="16">－イオン</text>

  <!-- Line 2: 1価 -->
  <ellipse cx="160" cy="280" rx="42" ry="24" class="posIon" />
  <text x="160" y="286" font-size="16">＋イオン</text>
  
  <circle cx="240" cy="280" r="24" class="ohMinus" />
  <text x="240" y="286" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  
  <polygon points="270,275 285,275 285,270 300,280 285,290 285,285 270,285" class="arrow" />
  
  <ellipse cx="340" cy="280" rx="35" ry="24" class="h2oPool" />
  <text x="340" y="286" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  
  <polygon points="410,275 395,275 395,270 380,280 395,290 395,285 410,285" class="arrow" />

  <rect class="valenceBox" x="405" y="245" width="165" height="70" />
  <text x="430" y="265" class="wtext" font-size="16">1価</text>
  <circle cx="440" cy="280" r="24" class="hPlus" />
  <text x="440" y="286" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <ellipse cx="520" cy="280" rx="40" ry="24" class="negIon" />
  <text x="520" y="286" font-size="16">－イオン</text>
  
  <!-- 1価の説明 -->
  <rect class="descBox" x="170" y="330" width="340" height="40" />
  <text x="340" y="357" font-size="20">2個のH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">を出すのに2個の酸が必要</tspan></text>

  <!-- Line 3: 2価 (top half) -->
  <ellipse cx="160" cy="420" rx="42" ry="24" class="posIon" />
  <text x="160" y="426" font-size="16">＋イオン</text>
  
  <circle cx="240" cy="420" r="24" class="ohMinus" />
  <text x="240" y="426" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  
  <polygon points="270,415 285,415 285,410 300,420 285,430 285,425 270,425" class="arrow" />
  
  <ellipse cx="340" cy="420" rx="35" ry="24" class="h2oPool" />
  <text x="340" y="426" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  
  <polygon points="410,415 395,415 395,410 380,420 395,430 395,425 410,425" class="arrow" />
  
  <!-- Line 4: 2価 (bottom half) -->
  <ellipse cx="160" cy="500" rx="42" ry="24" class="posIon" />
  <text x="160" y="506" font-size="16">＋イオン</text>
  
  <circle cx="240" cy="500" r="24" class="ohMinus" />
  <text x="240" y="506" class="wtext" font-size="18">OH<tspan font-size="12" dy="-8">-</tspan></text>
  
  <polygon points="270,495 285,495 285,490 300,500 285,510 285,505 270,505" class="arrow" />
  
  <ellipse cx="340" cy="500" rx="35" ry="24" class="h2oPool" />
  <text x="340" y="506" class="wtext" font-size="18">H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  
  <polygon points="410,495 395,495 395,490 380,500 395,510 395,505 410,505" class="arrow" />

  <rect class="valenceBox" x="405" y="380" width="165" height="160" />
  <text x="430" y="405" class="wtext" font-size="16">2価</text>
  <circle cx="440" cy="420" r="24" class="hPlus" />
  <text x="440" y="426" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <circle cx="440" cy="500" r="24" class="hPlus" />
  <text x="440" y="506" class="wtext" font-size="18">H<tspan font-size="12" dy="-8">+</tspan></text>
  <ellipse cx="520" cy="460" rx="40" ry="30" class="negIon" />
  <text x="520" y="466" font-size="16">－イオン</text>
  
  <!-- 2価の説明 -->
  <rect class="descBox" x="170" y="560" width="340" height="40" />
  <text x="340" y="587" font-size="20">1個の酸で2個のH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">を出せる</tspan></text>

  <!-- Bottom text -->
  <rect class="bottomBox" x="10" y="620" width="660" height="40" />
  <text x="340" y="647" font-size="18">1個の酸が出すH<tspan font-size="14" dy="-8">+</tspan><tspan dy="8">の数が酸の価数， 1個の塩基が出すOH</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8">の数が塩基の価数</tspan></text>
</svg>
