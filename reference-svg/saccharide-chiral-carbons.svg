<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img">
  <!-- 鎖状グルコースの示性式を横に並べ、不斉炭素原子（まん中の CHOH 4個）を丸で囲む。
       両端が不斉炭素原子でない理由を、その下に短く添える。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .grp { font-size: 22px; fill: #222; text-anchor: middle; }
    .num { font-size: 14px; fill: #888; text-anchor: middle; }
    .ttl { font-size: 19px; fill: #222; text-anchor: middle; }
    .bond { stroke: #333; stroke-width: 2.5; fill: none; }
    .mark { fill: none; stroke: #6a1b9a; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .brace { stroke: #6a1b9a; stroke-width: 2.5; fill: none; }
    .cap { font-size: 18px; fill: #6a1b9a; text-anchor: middle; }
    .side { font-size: 16px; fill: #555; text-anchor: middle; }
    .lead { stroke: #999; stroke-width: 1.5; fill: none; }
  </style>

  <text class="ttl" x="440" y="40">鎖状のグルコース</text>

  <!-- 不斉炭素原子をまとめる括弧 -->
  <text class="cap" x="452" y="82">不斉炭素原子 4個</text>
  <path class="brace" d="M 271 106 L 271 94 L 633 94 L 633 106" />

  <!-- 位置番号 -->
  <text class="num" x="212" y="136">6</text>
  <text class="num" x="311" y="136">5</text>
  <text class="num" x="405" y="136">4</text>
  <text class="num" x="499" y="136">3</text>
  <text class="num" x="593" y="136">2</text>
  <text class="num" x="680" y="136">1</text>

  <!-- 主鎖の結合 -->
  <path class="bond" d="M 247 171 L 281 171" />
  <path class="bond" d="M 341 171 L 375 171" />
  <path class="bond" d="M 435 171 L 469 171" />
  <path class="bond" d="M 529 171 L 563 171" />
  <path class="bond" d="M 623 171 L 657 171" />

  <!-- 不斉炭素原子の印（4個） -->
  <ellipse class="mark" cx="311" cy="170" rx="42" ry="28" />
  <ellipse class="mark" cx="405" cy="170" rx="42" ry="28" />
  <ellipse class="mark" cx="499" cy="170" rx="42" ry="28" />
  <ellipse class="mark" cx="593" cy="170" rx="42" ry="28" />

  <!-- 示性式 -->
  <text class="grp" x="212" y="178">CH₂OH</text>
  <text class="grp" x="311" y="178">CHOH</text>
  <text class="grp" x="405" y="178">CHOH</text>
  <text class="grp" x="499" y="178">CHOH</text>
  <text class="grp" x="593" y="178">CHOH</text>
  <text class="grp" x="680" y="178">CHO</text>

  <!-- 両端はなぜ不斉炭素原子でないか -->
  <path class="lead" d="M 212 200 L 212 238" />
  <text class="side" x="200" y="262">H が2個ついている</text>
  <path class="lead" d="M 680 200 L 680 238" />
  <text class="side" x="672" y="262">二重結合をもっている</text>
  <text class="side" x="440" y="304">—— どちらも「4つとも違う」にならないので数えない ——</text>
</svg>
