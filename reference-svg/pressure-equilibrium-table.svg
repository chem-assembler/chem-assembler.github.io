<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img">
  <!-- 圧力で考える化学平衡の量的関係の表を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 24px; text-anchor: middle; }
    .eq { font-family: "Times New Roman", serif; font-size: 28px; }
    .math { font-family: "Times New Roman", serif; font-style: italic; font-size: 28px; }
    .textBlue { fill: #1f618d; }
    .textOrange { fill: #e0762b; }
    .boxOrange { fill: none; stroke: #e0762b; stroke-width: 2; rx: 4; }
    .lineBlue { stroke: #1f618d; stroke-width: 2; }
  </style>

  <g transform="translate(40, 20)">
    <!-- 反応式 -->
    <rect class="boxOrange" x="140" y="5" width="25" height="35" />
    <text x="152.5" y="32" class="eq">1</text>
    <text x="210" y="35" class="eq">N<tspan font-size="16" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan font-size="16" dy="5">4</tspan></text>
    
    <text x="310" y="35" class="eq">⇄</text>

    <rect class="boxOrange" x="380" y="5" width="25" height="35" />
    <text x="392.5" y="32" class="eq">2</text>
    <text x="445" y="35" class="eq">NO<tspan font-size="16" dy="5">2</tspan></text>

    <text x="560" y="35">（全体）</text>

    <!-- 縦線 -->
    <line class="lineBlue" x1="490" y1="0" x2="490" y2="160" />

    <!-- 1行目: 反応前 -->
    <text x="75" y="80" class="textBlue">反応前</text>
    <text x="240" y="80" class="math textBlue"><tspan font-style="italic">p</tspan><tspan font-style="normal" font-family="system-ui, sans-serif" font-size="24"> Pa</tspan></text>
    <!-- NO2はなし -->
    <text x="560" y="80" class="math textBlue"><tspan font-style="italic">p</tspan><tspan font-style="normal" font-family="system-ui, sans-serif" font-size="24"> Pa</tspan></text>

    <!-- 2行目: 変化量 -->
    <text x="5" y="120" class="textBlue">＋）</text>
    <text x="75" y="120" class="textBlue">変化量</text>
    
    <text x="225" y="120" class="math textOrange">−<tspan font-style="italic">pα</tspan></text>
    <line class="lineBlue" x1="165" y1="125" x2="255" y2="125" />
    <text x="275" y="120" class="textBlue">Pa</text>
    
    <text x="420" y="120" class="math textOrange">＋<tspan font-style="italic">2pα</tspan></text>
    <line class="lineBlue" x1="365" y1="125" x2="455" y2="125" />
    <text x="475" y="120" class="textBlue">Pa</text>

    <text x="560" y="120" class="math textOrange">＋<tspan font-style="italic">pα</tspan></text>
    <line class="lineBlue" x1="515" y1="125" x2="585" y2="125" />
    <text x="605" y="120" class="textBlue">Pa</text>

    <!-- 横線 -->
    <line class="lineBlue" x1="0" y1="135" x2="630" y2="135" />

    <!-- 3行目: 反応後 -->
    <text x="75" y="170" class="textBlue">反応後</text>
    
    <text x="210" y="170" class="math textOrange"><tspan font-style="italic">p</tspan>(1−<tspan font-style="italic">α</tspan>)</text>
    <line class="lineBlue" x1="150" y1="175" x2="265" y2="175" />
    <text x="285" y="170" class="textBlue">Pa</text>
    
    <text x="425" y="170" class="math textOrange"><tspan font-style="italic">2pα</tspan></text>
    <line class="lineBlue" x1="395" y1="175" x2="455" y2="175" />
    <text x="475" y="170" class="textBlue">Pa</text>

    <text x="545" y="170" class="math textOrange"><tspan font-style="italic">p</tspan>(1＋<tspan font-style="italic">α</tspan>)</text>
    <line class="lineBlue" x1="495" y1="175" x2="590" y2="175" />
    <text x="610" y="170" class="textBlue">Pa</text>

  </g>

</svg>
