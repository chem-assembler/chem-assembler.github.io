<svg xmlns="http://www.w3.org/2000/svg" width="680" height="464" viewBox="0 0 680 464" role="img">
  <!-- ケトンの命名（2-プロパノン＝アセトン・2-ブタノン＝メチルエチルケトン）と、アルキル基の並べ方の注。
