  <text x="120.0" y="170.0" font-size="17" fill="#e0762b" text-anchor="middle" dominant-baseline="central" font-family='system-ui, sans-serif' font-weight="700">（アセトン，ジメチルケトン）</text>
  <rect x="290" y="52" width="378" height="64" fill="#fff" stroke="#e0762b" stroke-width="1.6"/>
  <text x="302.0" y="73.5" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>2つのアルキル基が同じ場合は「ジ○○ケトン」</text>
  <text x="302.0" y="98.5" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>ただしアセトンの方が圧倒的によく使われる</text>
