    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a3aa8"/></marker>
  </defs>
  <text x="50.0" y="58.0" font-size="22" fill="#222" text-anchor="middle" dominant-baseline="central" font-family='"Times New Roman", serif'>CH<tspan font-size="15" dy="6">3</tspan><tspan dy="-6">​</tspan></text>
