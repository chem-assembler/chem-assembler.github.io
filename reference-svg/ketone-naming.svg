  <rect x="300" y="224" width="368" height="64" fill="#fff" stroke="#e0762b" stroke-width="1.6"/>
  <text x="312.0" y="245.5" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>エチル(ethyl)とメチル(methyl)では</text>
  <text x="312.0" y="270.5" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>C原子の数が少ないメチルを先に書く</text>
  <line x1="248" y1="330" x2="300" y2="266.0" stroke="#e0762b" stroke-width="1.4"/>
  <text x="20.0" y="388.0" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>※慣用名なのでアルキル基の順番はアルファベット順でも炭素数順でも</text>
  <text x="20.0" y="414.0" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>　構わないが，なぜかメチルエチルエーテルよりエチルメチルエーテル，</text>
  <text x="20.0" y="440.0" font-size="16" fill="#222" text-anchor="start" dominant-baseline="central" font-family='system-ui, sans-serif'>　エチルメチルケトンよりメチルエチルケトンの方がよく使われる</text>
</svg>
