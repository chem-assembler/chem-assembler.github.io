<svg xmlns="http://www.w3.org/2000/svg" width="602.105" height="335.263" viewBox="0 0 880 490" role="img">
  <!-- 弱酸を薄めると電離度 α が大きくなる理由を、粒の混み具合で見せる模式図。
       左＝濃い（粒がぎっしり。電離した H+ はすぐ CH3COO- に出会って戻る ＝ 電離している割合が小さい）。
       右＝薄い（同じ大きさの器に粒が少ない。H+ は相手に出会いにくく、電離したままでいる ＝ 割合が大きい）。
       ⚠ 数の比は「向き」を見せるためのもの。α ＝ √(Ka／c) の値を読ませる図ではない。
       ⚠ 粒の数: 左は CH3COOH 13 個＋電離した1組、右は CH3COOH 2 個＋電離した1組（字の床のために枠を広げたときも数は変えていない）。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .beaker { fill: none; stroke: #333; stroke-width: 3; }
    .water { fill: #eaf3fb; stroke: none; }
    .surf { stroke: #90caf9; stroke-width: 2; fill: none; }
    .ttl { font-size: 26px; fill: #222; text-anchor: middle; }
    .note { font-size: 25px; fill: #333; text-anchor: middle; }
    .key { font-size: 25px; fill: #6a1b9a; text-anchor: middle; }
    .p { font-size: 25px; text-anchor: middle; fill: #222; }
    .acid { fill: #fff; stroke: #c62828; stroke-width: 2; }
    .anion { fill: #e8f1fb; stroke: #1565c0; stroke-width: 2; }
    .far { stroke: #6a1b9a; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>

  <!-- ================= 左: 濃い ================= -->
  <text class="ttl" x="225" y="44">濃い（c が大きい）</text>
  <path class="water" d="M 22 138 L 22 364 Q 22 378 38 378 L 412 378 Q 428 378 428 364 L 428 138 Z" />
  <path class="beaker" d="M 20 100 L 20 364 Q 20 380 36 380 L 414 380 Q 430 380 430 364 L 430 100" />
  <path class="surf" d="M 22 138 L 428 138" />

  <g class="acid">
    <rect x="31" y="152" width="124" height="34" rx="14" />
    <rect x="163" y="152" width="124" height="34" rx="14" />
    <rect x="295" y="152" width="124" height="34" rx="14" />
    <rect x="31" y="196" width="124" height="34" rx="14" />
    <rect x="163" y="196" width="124" height="34" rx="14" />
    <rect x="295" y="196" width="124" height="34" rx="14" />
    <rect x="31" y="240" width="124" height="34" rx="14" />
    <rect x="31" y="284" width="124" height="34" rx="14" />
    <rect x="163" y="284" width="124" height="34" rx="14" />
    <rect x="295" y="284" width="124" height="34" rx="14" />
    <rect x="31" y="328" width="124" height="34" rx="14" />
    <rect x="163" y="328" width="124" height="34" rx="14" />
    <rect x="295" y="328" width="124" height="34" rx="14" />
  </g>
  <g class="p">
    <text x="93" y="176">CH₃COOH</text><text x="225" y="176">CH₃COOH</text><text x="357" y="176">CH₃COOH</text>
    <text x="93" y="220">CH₃COOH</text><text x="225" y="220">CH₃COOH</text><text x="357" y="220">CH₃COOH</text>
    <text x="93" y="264">CH₃COOH</text>
    <text x="93" y="308">CH₃COOH</text><text x="225" y="308">CH₃COOH</text><text x="357" y="308">CH₃COOH</text>
    <text x="93" y="352">CH₃COOH</text><text x="225" y="352">CH₃COOH</text><text x="357" y="352">CH₃COOH</text>
  </g>
  <!-- 電離した1組（となり合っている） -->
  <rect class="anion" x="163" y="240" width="124" height="34" rx="14" />
  <text class="p" x="225" y="264">CH₃COO⁻</text>
  <circle cx="306" cy="257" r="16" fill="#c62828" />
  <text class="p" x="306" y="263" fill="#fff">H⁺</text>

  <!-- ================= 右: 薄い ================= -->
  <text class="ttl" x="655" y="44">薄い（c が小さい）</text>
  <path class="water" d="M 452 138 L 452 364 Q 452 378 468 378 L 842 378 Q 858 378 858 364 L 858 138 Z" />
  <path class="beaker" d="M 450 100 L 450 364 Q 450 380 466 380 L 844 380 Q 860 380 860 364 L 860 100" />
  <path class="surf" d="M 452 138 L 858 138" />

  <g class="acid">
    <rect x="478" y="160" width="124" height="34" rx="14" />
    <rect x="716" y="318" width="124" height="34" rx="14" />
  </g>
  <g class="p">
    <text x="540" y="184">CH₃COOH</text>
    <text x="778" y="342">CH₃COOH</text>
  </g>
  <!-- 電離した1組（遠く離れている） -->
  <rect class="anion" x="482" y="290" width="124" height="34" rx="14" />
  <text class="p" x="544" y="314">CH₃COO⁻</text>
  <circle cx="790" cy="214" r="16" fill="#c62828" />
  <text class="p" x="790" y="220" fill="#fff">H⁺</text>
  <path class="far" d="M 606 294 L 770 222" />

  <!-- ================= 下の一言（2行に割る） ================= -->
  <text class="note" x="225" y="414">ぎっしり ＝ H⁺ はすぐ</text>
  <text class="note" x="225" y="443">相手に出会って戻る</text>
  <text class="key" x="225" y="476">電離度 α は小さい</text>
  <text class="note" x="655" y="414">まばら ＝ H⁺ は相手に</text>
  <text class="note" x="655" y="443">出会えず電離したまま</text>
  <text class="key" x="655" y="476">電離度 α は大きい</text>
</svg>
