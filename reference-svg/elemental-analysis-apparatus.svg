<svg xmlns="http://www.w3.org/2000/svg" width="694.737" height="268.421" viewBox="0 0 880 340" role="img">
  <!-- 元素分析の装置。左から 乾燥した O2 → 燃焼管（試料＋CuO・加熱）→ 塩化カルシウム管（H2O）→ ソーダ石灰管（CO2）。
       ★ 順番が命の図: 水を先に取ってからでないと CO2 だけを量れない。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .glass { stroke: #333; stroke-width: 3; fill: #fff; }
    .pipe { stroke: #333; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .name { font-size: 18px; fill: #222; text-anchor: middle; }
    .role { font-size: 15px; fill: #555; text-anchor: middle; }
    .in { font-size: 15px; fill: #444; text-anchor: middle; }
    .gas { font-size: 15px; fill: #1565c0; text-anchor: middle; }
  </style>

  <!-- ===== 名前と役目 ===== -->
  <text class="name" x="250" y="46">燃焼管</text>
  <text class="role" x="250" y="68">試料を完全に酸化する</text>
  <text class="name" x="535" y="46">塩化カルシウム管</text>
  <text class="role" x="535" y="68">H₂O だけを吸収</text>
  <text class="name" x="755" y="46">ソーダ石灰管</text>
  <text class="role" x="755" y="68">CO₂ を吸収</text>

  <!-- ===== 入口 ===== -->
  <path class="pipe" d="M 30 175 L 96 175" />
  <polygon points="104 175 86 167 86 183" fill="#1565c0" />
  <text class="gas" x="66" y="146">乾燥した O₂</text>

  <!-- ===== 燃焼管 ===== -->
  <path class="glass" d="M 130 140 L 370 140 A 35 35 0 0 1 370 210 L 130 210 A 35 35 0 0 1 130 140 Z" />
  <path class="pipe" d="M 96 175 L 136 175 M 364 175 L 452 175" />
  <!-- 試料（磁製のボート） -->
  <path d="M 150 206 L 226 206 L 232 190 L 144 190 Z" fill="#e0e0e0" stroke="#777" stroke-width="1.5" />
  <path d="M 156 190 C 172 182, 202 182, 220 190 Z" fill="#9e9e9e" stroke="#777" stroke-width="1.5" />
  <text class="in" x="188" y="172">試料</text>
  <!-- 酸化銅(II) -->
  <g fill="#c8b4a0" stroke="#7d6652" stroke-width="1.2">
    <circle cx="266" cy="200" r="7" /><circle cx="284" cy="192" r="7" /><circle cx="302" cy="201" r="7" />
    <circle cx="320" cy="192" r="7" /><circle cx="338" cy="201" r="7" /><circle cx="276" cy="205" r="5" />
    <circle cx="312" cy="206" r="5" /><circle cx="348" cy="194" r="5" /><circle cx="294" cy="207" r="5" />
    <circle cx="330" cy="205" r="5" />
  </g>
  <text class="in" x="306" y="172">CuO（酸化銅(II)）</text>

  <!-- ===== バーナー2つ ===== -->
  <g stroke-width="2.5" fill="none">
    <path d="M 178 268 C 174 250, 190 246, 188 218 C 202 240, 208 252, 204 268 Z" stroke="#c62828" />
    <rect x="182" y="268" width="16" height="36" stroke="#333" />
    <path d="M 168 304 L 212 304 L 222 320 L 158 320 Z" stroke="#333" />
    <path d="M 296 268 C 292 250, 308 246, 306 218 C 320 240, 326 252, 322 268 Z" stroke="#c62828" />
    <rect x="300" y="268" width="16" height="36" stroke="#333" />
    <path d="M 286 304 L 330 304 L 340 320 L 276 320 Z" stroke="#333" />
  </g>
  <text class="in" x="392" y="300">加熱する</text>

  <!-- ===== 塩化カルシウム管 ===== -->
  <path class="glass" d="M 470 152 L 600 152 A 24 24 0 0 1 600 200 L 470 200 A 24 24 0 0 1 470 152 Z" />
  <path class="pipe" d="M 452 175 L 472 175 M 598 175 L 672 175" />
  <g fill="#eceff1" stroke="#90a4ae" stroke-width="1.2">
    <circle cx="488" cy="166" r="7" /><circle cx="506" cy="184" r="7" /><circle cx="524" cy="166" r="7" />
    <circle cx="542" cy="184" r="7" /><circle cx="560" cy="166" r="7" /><circle cx="578" cy="184" r="7" />
    <circle cx="500" cy="167" r="5" /><circle cx="536" cy="167" r="5" /><circle cx="572" cy="167" r="5" />
    <circle cx="520" cy="186" r="5" /><circle cx="556" cy="186" r="5" /><circle cx="590" cy="172" r="5" />
  </g>

  <!-- ===== ソーダ石灰管 ===== -->
  <path class="glass" d="M 690 152 L 820 152 A 24 24 0 0 1 820 200 L 690 200 A 24 24 0 0 1 690 152 Z" />
  <path class="pipe" d="M 672 175 L 692 175 M 818 175 L 856 175" />
  <g fill="#d7ccc8" stroke="#8d6e63" stroke-width="1.2">
    <circle cx="708" cy="166" r="7" /><circle cx="726" cy="184" r="7" /><circle cx="744" cy="166" r="7" />
    <circle cx="762" cy="184" r="7" /><circle cx="780" cy="166" r="7" /><circle cx="798" cy="184" r="7" />
    <circle cx="720" cy="167" r="5" /><circle cx="756" cy="167" r="5" /><circle cx="792" cy="167" r="5" />
    <circle cx="740" cy="186" r="5" /><circle cx="776" cy="186" r="5" /><circle cx="810" cy="172" r="5" />
  </g>

  <!-- ===== 流れていくもの ===== -->
  <polygon points="440 175 424 167 424 183" fill="#1565c0" />
  <polygon points="660 175 644 167 644 183" fill="#1565c0" />
  <text class="gas" x="424" y="244">H₂O と CO₂</text>
  <text class="gas" x="646" y="244">CO₂ だけ</text>
  <path d="M 424 230 L 424 198" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />
  <path d="M 646 230 L 646 198" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />
</svg>
