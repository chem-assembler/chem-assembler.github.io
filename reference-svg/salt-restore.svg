<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
  <!-- 塩から元の酸と塩基を復元する手順。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。
       2026-09-25: 説明の囲みが図の外・枠からはみ出していたので、囲みの字を 16px にして改行し、囲みを広げた。
       ⚠ text 要素の font-size 属性は下の text { font-size } に負けるので、大きさは style で指定する -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 20px; }
    .wtext { fill: #fff; text-anchor: middle; }
    .ionPos { fill: #f0cbb5; stroke: #222; stroke-width: 1.5; }
    .ionNeg { fill: #a5d4a1; stroke: #222; stroke-width: 1.5; }
    .hPlus { fill: #d35400; stroke: #993d00; stroke-width: 1.5; }
    .ohMinus { fill: #165b7c; stroke: #10425a; stroke-width: 1.5; }
    .eq { font-family: "Times New Roman", serif; font-size: 24px; }
    .brace { fill: none; stroke-width: 3; }
    .braceAcid { stroke: #27ae60; }
    .braceBase { stroke: #27ae60; }
    .braceSalt { stroke: #f1c40f; }
    .braceWater { stroke: #27ae60; }
    .box { fill: #fff; stroke: #e0762b; stroke-width: 2; }
    .boxText { font-size: 16px; }
    .lead { stroke: #e0762b; stroke-width: 2; fill: none; }
    .orangeText { fill: #e0762b; font-size: 16px; }
    .blueText { fill: #1f618d; font-size: 16px; }
    .underline { stroke: #e0762b; stroke-width: 2; }
    .ionLabel { font-size: 14px; text-anchor: middle; }
    .ionChar { font-size: 18px; }
    .op { font-size: 26px; text-anchor: middle; }
  </style>

  <text x="20" y="30">塩の化学式から，もとの酸と塩基を復元し，反応式が書ける</text>

  <!-- 上段: 一般式 -->
  <g transform="translate(10, 55)">
    <!-- 酸 -->
    <circle cx="40" cy="25" r="20" class="hPlus" />
    <text x="40" y="32" class="wtext ionChar">H<tspan font-size="12" dy="-8">+</tspan></text>
    <ellipse cx="96" cy="25" rx="36" ry="20" class="ionNeg" />
    <text x="96" y="30" class="ionLabel">－イオン</text>
    <path class="brace braceAcid" d="M 20 50 L 20 55 L 132 55 L 132 50" />
    <text x="76" y="80" text-anchor="middle">酸</text>

    <text x="152" y="34" class="op">＋</text>

    <!-- 塩基 -->
    <ellipse cx="208" cy="25" rx="36" ry="20" class="ionPos" />
    <text x="208" y="30" class="ionLabel">＋イオン</text>
    <circle cx="264" cy="25" r="20" class="ohMinus" />
    <text x="264" y="32" class="wtext ionChar">OH<tspan font-size="12" dy="-8">-</tspan></text>
    <path class="brace braceBase" d="M 172 50 L 172 55 L 284 55 L 284 50" />
    <text x="228" y="80" text-anchor="middle">塩基</text>

    <text x="312" y="34" class="op">→</text>

    <!-- 塩 -->
    <ellipse cx="376" cy="25" rx="36" ry="20" class="ionPos" />
    <text x="376" y="30" class="ionLabel">＋イオン</text>
    <ellipse cx="448" cy="25" rx="36" ry="20" class="ionNeg" />
    <text x="448" y="30" class="ionLabel">－イオン</text>
    <path class="brace braceSalt" d="M 340 50 L 340 55 L 484 55 L 484 50" />
    <text x="412" y="80" text-anchor="middle">塩</text>

    <text x="506" y="34" class="op">＋</text>

    <!-- 水 -->
    <circle cx="550" cy="25" r="20" class="hPlus" />
    <text x="550" y="32" class="wtext ionChar">H<tspan font-size="12" dy="-8">+</tspan></text>
    <circle cx="590" cy="25" r="20" class="ohMinus" />
    <text x="590" y="32" class="wtext ionChar">OH<tspan font-size="12" dy="-8">-</tspan></text>
    <path class="brace braceWater" d="M 530 50 L 530 55 L 610 55 L 610 50" />
    <text x="570" y="80" text-anchor="middle">水</text>
  </g>

  <!-- 中段: 例1 NaCl -->
  <text class="eq" x="20" y="200">例1：</text>
  <text class="eq" x="80" y="200">NaCl</text>
  <text class="eq" x="140" y="200">→</text>
  <text class="eq" x="180" y="200">Na<tspan font-size="16" dy="-10">+</tspan></text>
  <line class="underline" x1="175" y1="205" x2="225" y2="205" />
  <text class="orangeText" x="160" y="228">もとはNaOH</text>

  <text class="eq" x="240" y="200">＋</text>

  <text class="eq" x="280" y="200">Cl<tspan font-size="16" dy="-10">-</tspan></text>
  <line class="underline" x1="275" y1="205" x2="315" y2="205" />
  <text class="orangeText" x="258" y="228">もとはHCl</text>

  <rect class="box" x="360" y="150" width="310" height="82" />
  <text class="boxText" x="370" y="174">塩をイオンに分解して，陽イオンには</text>
  <text class="boxText" x="370" y="198">OH<tspan font-size="12" dy="-7">-</tspan><tspan dy="7">，陰イオンにはH</tspan><tspan font-size="12" dy="-7">+</tspan><tspan dy="7">を組み合わせて，</tspan></text>
  <text class="boxText" x="370" y="222">もとの酸・塩基を復元する</text>
  <path class="lead" d="M 360 195 L 330 198" />

  <text x="40" y="275">よって，中和によってNaClが生じる反応式は</text>
  <text class="eq" x="40" y="315">HCl + NaOH → NaCl + H<tspan font-size="16" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

  <rect class="box" x="370" y="292" width="300" height="36" />
  <text class="boxText" x="380" y="316">加えたH<tspan font-size="12" dy="-7">+</tspan><tspan dy="7">とOH</tspan><tspan font-size="12" dy="-7">-</tspan><tspan dy="7">の分だけH</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">Oが生じる</tspan></text>
  <path class="lead" d="M 370 310 L 345 310" />


  <!-- 下段: 例2 NaHSO4 -->
  <!-- まとめてHSO4- -->
  <text class="blueText" x="290" y="364">まとめてHSO<tspan font-size="12" dy="4">4</tspan><tspan font-size="12" dy="-11">-</tspan></text>
  <path class="lead" d="M 305 388 Q 350 368 395 388" stroke="#1f618d" />

  <text class="eq" x="20" y="420">例2：</text>
  <text class="eq" x="80" y="420">NaHSO<tspan font-size="16" dy="5">4</tspan></text>
  <text class="eq" x="172" y="420" dy="0">→</text>
  <text class="eq" x="205" y="420">Na<tspan font-size="16" dy="-10">+</tspan></text>
  <line class="underline" x1="200" y1="425" x2="250" y2="425" />
  <text class="orangeText" x="182" y="448">もとはNaOH</text>

  <text class="eq" x="258" y="420">＋</text>

  <text class="eq" x="295" y="420">H<tspan font-size="16" dy="-10">+</tspan></text>
  <text class="eq" x="322" y="420">＋</text>
  <text class="eq" x="356" y="420">SO<tspan font-size="16" dy="5">4</tspan><tspan font-size="16" dy="-15">2-</tspan></text>
  <line class="underline" x1="290" y1="425" x2="415" y2="425" />
  <text class="orangeText" x="310" y="448">もとはH<tspan font-size="12" dy="3">2</tspan><tspan dy="-3">SO</tspan><tspan font-size="12" dy="3">4</tspan></text>

  <rect class="box" x="432" y="372" width="238" height="82" />
  <text class="boxText" x="442" y="396">H<tspan font-size="12" dy="-7">+</tspan><tspan dy="7">は酸由来なので陰イオン</tspan></text>
  <text class="boxText" x="442" y="420">と，OH<tspan font-size="12" dy="-7">-</tspan><tspan dy="7">は塩基由来なので</tspan></text>
  <text class="boxText" x="442" y="444">陽イオンとまとめる</text>
  <path class="lead" d="M 432 400 L 415 404" />

  <text x="40" y="495">よって，中和によってNaHSO<tspan font-size="14" dy="5">4</tspan><tspan dy="-5">が生じる反応式は</tspan></text>
  <text class="eq" x="40" y="535">H<tspan font-size="16" dy="5">2</tspan><tspan dy="-5">SO</tspan><tspan font-size="16" dy="5">4</tspan><tspan dy="-5"> + NaOH → NaHSO</tspan><tspan font-size="16" dy="5">4</tspan><tspan dy="-5"> + H</tspan><tspan font-size="16" dy="5">2</tspan><tspan dy="-5">O</tspan></text>

</svg>
