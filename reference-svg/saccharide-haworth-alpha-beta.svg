<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img">
  <!-- α-グルコースと β-グルコースを、環を斜めに置いた形（ハース式）で並べる。
       作図器の直交の図では「1位の -OH が環の上か下か」が見えないので、ここだけを見せる図。
       ★ H は省いて -OH と -CH2OH だけ描く（1位の向きに目を集めるため）。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .back { stroke: #333; stroke-width: 2; fill: none; }
    .front { stroke: #333; stroke-width: 4.5; fill: none; }
    .sub { stroke: #333; stroke-width: 2; fill: none; }
    .ttl { font-size: 21px; fill: #222; text-anchor: middle; }
    /* 文字は白でふちどってから塗る（環の線と重なっても読める） */
    .atom { font-size: 17px; fill: #222; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5; }
    .num { font-size: 13px; fill: #888; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4; }
    .note { font-size: 16px; fill: #6a1b9a; text-anchor: middle; }
    .foot { font-size: 17px; fill: #333; text-anchor: middle; }
    .mark { fill: none; stroke: #6a1b9a; stroke-width: 2.5; stroke-dasharray: 6 4; }
  </style>

  <!-- ================= α-グルコース（左・cx=230 cy=200） ================= -->
  <text class="ttl" x="230" y="46">α-グルコース</text>

  <!-- 環（奥は細線・手前は太線）。右奥の頂点は O -->
  <path class="back" d="M 135 200 L 182 156 L 264 156" />
  <path class="back" d="M 292 156 L 325 200" />
  <path class="front" d="M 135 200 L 182 244 L 278 244 L 325 200" />
  <text class="atom" x="278" y="162">O</text>

  <!-- 位置番号 -->
  <text class="num" x="289" y="205">1</text>
  <text class="num" x="260" y="227">2</text>
  <text class="num" x="200" y="227">3</text>
  <text class="num" x="171" y="205">4</text>
  <text class="num" x="200" y="183">5</text>

  <!-- 側鎖 -->
  <path class="sub" d="M 182 156 L 182 122" />
  <text class="atom" x="182" y="112">CH₂OH</text>
  <path class="sub" d="M 182 244 L 182 216" />
  <text class="atom" x="182" y="208">OH</text>
  <path class="sub" d="M 135 200 L 135 238" />
  <text class="atom" x="135" y="258">OH</text>
  <path class="sub" d="M 278 244 L 278 278" />
  <text class="atom" x="278" y="298">OH</text>

  <!-- 1位の -OH（下向き） -->
  <path class="sub" d="M 325 200 L 325 240" stroke="#6a1b9a" stroke-width="3" />
  <text class="atom" x="325" y="260" fill="#6a1b9a">OH</text>
  <ellipse class="mark" cx="325" cy="252" rx="30" ry="24" />

  <!-- ================= β-グルコース（右・cx=670 cy=200） ================= -->
  <text class="ttl" x="670" y="46">β-グルコース</text>

  <path class="back" d="M 575 200 L 622 156 L 704 156" />
  <path class="back" d="M 732 156 L 765 200" />
  <path class="front" d="M 575 200 L 622 244 L 718 244 L 765 200" />
  <text class="atom" x="718" y="162">O</text>

  <text class="num" x="729" y="205">1</text>
  <text class="num" x="700" y="227">2</text>
  <text class="num" x="640" y="227">3</text>
  <text class="num" x="611" y="205">4</text>
  <text class="num" x="640" y="183">5</text>

  <path class="sub" d="M 622 156 L 622 122" />
  <text class="atom" x="622" y="112">CH₂OH</text>
  <path class="sub" d="M 622 244 L 622 216" />
  <text class="atom" x="622" y="208">OH</text>
  <path class="sub" d="M 575 200 L 575 238" />
  <text class="atom" x="575" y="258">OH</text>
  <path class="sub" d="M 718 244 L 718 278" />
  <text class="atom" x="718" y="298">OH</text>

  <!-- 1位の -OH（上向き） -->
  <path class="sub" d="M 765 200 L 765 158" stroke="#6a1b9a" stroke-width="3" />
  <text class="atom" x="765" y="150" fill="#6a1b9a">OH</text>
  <ellipse class="mark" cx="765" cy="142" rx="30" ry="24" />

  <!-- まん中の対比 -->
  <path class="sub" d="M 400 200 L 496 200" stroke="#6a1b9a" />
  <polygon points="506,200 492,195 492,205" fill="#6a1b9a" />
  <polygon points="390,200 404,195 404,205" fill="#6a1b9a" />

  <text class="foot" x="450" y="368">つながり方は同じ。違うのは丸で囲んだ 1位の −OH だけで、</text>
  <text class="foot" x="450" y="396">α形は環の下、β形は環の上を向く</text>
</svg>
