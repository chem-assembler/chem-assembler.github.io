<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img">
  <!-- 化学基礎の終章の見取り図。2本の柱（物質の構成 ＝ 結合の型、物質の変化 ＝ 中和と酸化還元）と、資源の話。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。
       ★ 中身はページ本文（chemistry-world.md）に書いてあることだけ。本文の2つの表を写さず、束ね方だけを見せる。 -->
  <style>
    .lab { font-size: 19px; fill: #222; }
    .small { font-size: 16px; fill: #444; }
    .head { font-size: 23px; font-weight: bold; }
    .bold { font-weight: bold; }
    .mid { text-anchor: middle; }
    .box { fill: #fff; stroke: #666; stroke-width: 1.5; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; }
  </style>

  <!-- ===== 物質の構成 ===== -->
  <rect x="20" y="20" width="410" height="330" rx="10" fill="#f4f8fd" stroke="#1565c0" stroke-width="2" />
  <text class="head" x="40" y="56" fill="#1565c0">物質の構成</text>
  <text class="small" x="170" y="56">何からできているか</text>

  <text class="small" x="200" y="92">例: 銅 Cu</text>

  <rect class="box" x="44" y="104" width="130" height="44" rx="6" />
  <text class="lab mid bold" x="109" y="133">結合の型</text>
  <text class="lab" x="200" y="133">金属結晶</text>

  <path class="arrow" d="M 109 148 L 109 184" />
  <polygon points="109,192 103,180 115,180" fill="#333" />

  <rect class="box" x="44" y="194" width="130" height="44" rx="6" />
  <text class="lab mid bold" x="109" y="223">性質</text>
  <text class="lab" x="200" y="212">電気をよく通し、</text>
  <text class="lab" x="200" y="236">細く延ばせる</text>

  <path class="arrow" d="M 109 238 L 109 274" />
  <polygon points="109,282 103,270 115,270" fill="#333" />

  <rect class="box" x="44" y="284" width="130" height="44" rx="6" />
  <text class="lab mid bold" x="109" y="313">用途</text>
  <text class="lab" x="200" y="313">電線</text>

  <!-- ===== 物質の変化 ===== -->
  <rect x="450" y="20" width="410" height="330" rx="10" fill="#fdf5f5" stroke="#c62828" stroke-width="2" />
  <text class="head" x="470" y="56" fill="#c62828">物質の変化</text>
  <text class="small" x="600" y="56">どう変わるか</text>

  <rect class="box" x="470" y="78" width="370" height="96" rx="8" />
  <text class="lab bold" x="490" y="112">中和</text>
  <text class="lab" x="596" y="112">H⁺ のやりとり</text>
  <text class="small" x="490" y="150">例: 胃薬（炭酸水素ナトリウム）</text>

  <rect class="box" x="470" y="190" width="370" height="140" rx="8" />
  <text class="lab bold" x="490" y="224">酸化還元</text>
  <text class="lab" x="596" y="224">電子 e⁻ のやりとり</text>
  <text class="small" x="490" y="262">例: リチウムイオン電池・鉄の製錬</text>
  <text class="small" x="490" y="290">　 ビタミン C（酸化防止剤）</text>
  <text class="small" x="490" y="318">　 水道水の塩素消毒</text>

  <!-- ===== 資源 ===== -->
  <rect x="20" y="370" width="840" height="70" rx="10" fill="#f3f8f2" stroke="#2e7d32" stroke-width="2" />
  <text class="lab bold" x="40" y="412" fill="#2e7d32">限りある資源</text>
  <text class="lab" x="180" y="412">使い終わった製品から金属などを取り出して、もう一度使う（リサイクル）</text>
</svg>
