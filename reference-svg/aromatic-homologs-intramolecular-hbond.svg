<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img">
  <!-- 左: o-ニトロフェノールは 1分子の中で −OH…O=N の水素結合をつくる。
       右: p- 体は −OH と −NO₂ が遠いので、分子どうしで水素結合する。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。
       ★ 文字は枠の中に収める。点線（水素結合）は赤の破線で、ふつうの結合（黒の実線）と形で区別する。 -->
  <style>
    .bond { stroke: #333; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .ring { stroke: #333; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .inner { stroke: #333; stroke-width: 2; fill: none; }
    .hb { stroke: #c62828; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
    .leader { stroke: #c62828; stroke-width: 1.5; fill: none; }
    .atom { font-size: 21px; fill: #222; }
    .head { font-size: 19px; fill: #222; }
    .small { font-size: 15px; fill: #444; }
    .red { fill: #c62828; }
    .divider { stroke: #bbb; stroke-width: 1; stroke-dasharray: 5 5; }
  </style>

  <path class="divider" d="M 440 58 L 440 344" />

  <!-- ================= 左: o- 体 ================= -->
  <text class="head" x="24" y="40">o- 体（となり合う）</text>

  <!-- ベンゼン環（中心 240,230・R=60） -->
  <polygon class="ring" points="300,230 270,178 210,178 180,230 210,282 270,282" />
  <circle class="inner" cx="240" cy="230" r="36" />

  <!-- −O−H -->
  <path class="bond" d="M 210 178 L 186 146" />
  <text class="atom" x="176" y="135" text-anchor="middle">O</text>
  <path class="bond" d="M 188 120 L 206 106" />
  <text class="atom" x="218" y="107" text-anchor="middle">H</text>

  <!-- −N(=O)O -->
  <path class="bond" d="M 270 178 L 294 146" />
  <text class="atom" x="304" y="135" text-anchor="middle">N</text>
  <path class="bond" d="M 296 114 L 276 92" />
  <text class="atom" x="268" y="89" text-anchor="middle">O</text>
  <path class="bond" d="M 317.3 122.7 L 345.3 112.7" />
  <path class="bond" d="M 314.7 117.3 L 342.7 107.3" />
  <text class="atom" x="356" y="111" text-anchor="middle">O</text>

  <!-- 分子内水素結合 -->
  <path class="hb" d="M 231 96 L 255 88" />
  <path class="leader" d="M 243 54 L 243 78" />
  <text class="small red" x="243" y="46" text-anchor="middle">分子内水素結合</text>

  <text class="small" x="24" y="330">o-ニトロフェノール</text>
  <text class="small" x="24" y="362">1つの分子の中で結びつく</text>
  <text class="small" x="24" y="386">→ 分子どうしで結びつく手が減り、沸点が低い</text>

  <!-- ================= 右: p- 体 ================= -->
  <text class="head" x="462" y="40">p- 体（向かい合う）</text>

  <!-- 分子A（中心 600,140・R=44） -->
  <polygon class="ring" points="644,140 622,102 578,102 556,140 578,178 622,178" />
  <circle class="inner" cx="600" cy="140" r="27" />
  <path class="bond" d="M 556 140 L 532 140" />
  <text class="atom" x="526" y="147" text-anchor="end">H−O</text>
  <path class="bond" d="M 644 140 L 668 140" />
  <text class="atom" x="674" y="147" text-anchor="start">NO₂</text>

  <!-- 分子B（中心 770,286・R=44） -->
  <polygon class="ring" points="814,286 792,248 748,248 726,286 748,324 792,324" />
  <circle class="inner" cx="770" cy="286" r="27" />
  <path class="bond" d="M 726 286 L 702 286" />
  <text class="atom" x="696" y="293" text-anchor="end">H−O</text>
  <path class="bond" d="M 814 286 L 838 286" />
  <text class="atom" x="844" y="293" text-anchor="start">NO₂</text>

  <!-- 分子間水素結合 -->
  <path class="hb" d="M 694 162 L 680 272" />
  <text class="small red" x="706" y="222" text-anchor="start">分子どうしで水素結合</text>

  <text class="small" x="462" y="362">−OH と −NO₂ が遠く、分子の中では届かない</text>
  <text class="small" x="462" y="386">→ 分子どうしで強く引き合い、沸点が高い</text>
</svg>
