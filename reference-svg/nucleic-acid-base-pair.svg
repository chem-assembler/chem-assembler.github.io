  <text class="sym" x="499" y="272" text-anchor="middle" fill="#2e7d32">C</text>
  <text class="small" x="499" y="328" text-anchor="middle">シトシン</text>

  <path class="hb" d="M 288 242 L 462 242 M 288 262 L 462 262 M 288 282 L 462 282" />
