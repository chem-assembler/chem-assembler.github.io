<svg xmlns="http://www.w3.org/2000/svg" width="418.421" height="244.868" viewBox="0 0 880 515" role="img">
  <!-- アンモニアソーダ法（ソルベー法）の物質の流れ。
       左＝ナトリウムの流れ（NaCl → NaHCO3 → Na2CO3）／右＝カルシウムの流れ（CaCO3 → CaO → Ca(OH)2 → CaCl2）。
       点線＝工程の中で回収して使い回すもの（CO2・NH3・NH4Cl）。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <defs>
    <marker id="ad" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#333" /></marker>
    <marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1565c0" /></marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2e7d32" /></marker>
    <marker id="ap" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6a1b9a" /></marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 2; }
    .edge { fill: #eceff1; stroke: #333; stroke-width: 3; }
    .t { font-size: 23px; fill: #222; text-anchor: middle; }
    .tb { font-size: 25px; fill: #222; text-anchor: middle; }
    .tag { font-size: 23px; fill: #555; }
    .note { font-size: 23px; fill: #555; }
    .flow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#ad); }
    .co2 { stroke: #1565c0; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#ab); }
    .co2p { stroke: #1565c0; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
    .nh3 { stroke: #2e7d32; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#ag); }
    .nh4 { stroke: #6a1b9a; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
    .nh4e { stroke: #6a1b9a; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#ap); }
    .cb { fill: #1565c0; } .cg { fill: #2e7d32; } .cp { fill: #6a1b9a; }
  </style>

  <!-- ===== 左: ナトリウムの流れ ===== -->
  <text class="tag" x="80" y="30">原料</text>
  <rect class="edge" x="80" y="40" width="290" height="65" rx="10" />
  <text class="tb" x="225" y="81">NaCl の飽和水溶液</text>

  <rect class="box" x="80" y="147" width="290" height="72" rx="10" />
  <text class="t" x="225" y="176">① NH₃ と CO₂ を吹き込む</text>
  <text class="t" x="225" y="205">NaHCO₃ が沈殿する</text>

  <rect class="box" x="80" y="261" width="290" height="72" rx="10" />
  <text class="t" x="225" y="305">② NaHCO₃ を取り出して加熱</text>

  <text class="tag" x="80" y="367">製品</text>
  <rect class="edge" x="80" y="375" width="290" height="65" rx="10" />
  <text class="tb" x="225" y="416">Na₂CO₃</text>

  <path class="flow" d="M 225 100 L 225 145" />
  <path class="flow" d="M 225 214 L 225 259" />
  <path class="flow" d="M 225 328 L 225 373" />

  <!-- ===== 右: カルシウムの流れ ===== -->
  <text class="tag" x="610" y="30">原料</text>
  <rect class="edge" x="610" y="40" width="255" height="65" rx="10" />
  <text class="tb" x="737" y="81">CaCO₃（石灰石）</text>

  <rect class="box" x="610" y="147" width="255" height="72" rx="10" />
  <text class="t" x="737" y="176">③ 石灰石を熱分解する</text>
  <text class="t" x="737" y="205">CaO と CO₂ ができる</text>

  <rect class="box" x="610" y="261" width="255" height="72" rx="10" />
  <text class="t" x="737" y="290">④ CaO に水を加える</text>
  <text class="t" x="737" y="319">Ca(OH)₂ になる</text>

  <rect class="box" x="610" y="375" width="255" height="72" rx="10" />
  <text class="t" x="737" y="404">⑤ Ca(OH)₂ ＋ NH₄Cl</text>
  <text class="t" x="737" y="433">NH₃ を追い出す</text>

  <path class="flow" d="M 737 100 L 737 145" />
  <path class="flow" d="M 737 214 L 737 259" />
  <path class="flow" d="M 737 328 L 737 373" />
  <path class="flow" d="M 737 442 L 737 474" />
  <text class="tag" x="662" y="503">CaCl₂（副産物）</text>

  <!-- ===== 回収して使い回すもの（点線） ===== -->
  <!-- ② の CO₂ → ①（左まわり） -->
  <path class="co2" d="M 80 300 C 36 286, 36 200, 74 186" />
  <text class="note cb" transform="rotate(-90 30 266)" x="30" y="266">CO₂</text>

  <!-- ③ の CO₂ → ①（上まわり・不足分を補う） -->
  <path class="co2" d="M 610 165 L 400 165 L 400 125 L 280 125 L 280 145" />
  <text class="note cb" x="428" y="155">CO₂</text>

  <!-- ① の NH₄Cl → ⑤ -->
  <path class="nh4" d="M 370 205 L 390 205 L 390 415 L 486 415" />
  <path class="nh4e" d="M 514 415 L 606 415" />
  <text class="note cp" x="398" y="250">NH₄Cl</text>

  <!-- ⑤ で回収した NH₃ → ① -->
  <path class="nh3" d="M 610 435 L 500 435 L 500 185 L 374 185" />
  <text class="note cg" x="508" y="310">NH₃</text>

  <text class="note" x="40" y="503">点線 ＝ 工程の中で回収して、もう一度使うもの</text>
</svg>
