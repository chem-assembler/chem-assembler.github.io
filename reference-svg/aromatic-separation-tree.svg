<svg xmlns="http://www.w3.org/2000/svg" width="663.158" height="309.474" viewBox="0 0 900 420" role="img">
  <!-- 4成分を3回の分液で分ける樹形図。まっすぐ下がエーテル層、右へ出るのが水層。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。
       ⚠ 順序: ①塩酸（アニリン）→ ②NaHCO3（安息香酸）→ ③NaOH（フェノール）。②と③は入れ替えられない。
       ⚠ 「① 塩酸を加える」などの札は、上の箱と右へ出る矢印のあいだに置く（矢印が字の下すれすれを通ると取り消し線に見える）。 -->
  <style>
    .eth { fill: #fff3e0; stroke: #e65100; stroke-width: 2; }
    .aq { fill: #e3f0fb; stroke: #1565c0; stroke-width: 2; }
    .arw { stroke: #333; stroke-width: 2; fill: none; }
    .ttl { font-size: 22px; fill: #222; }
    .name { font-size: 21px; fill: #222; }
    .small { font-size: 19px; fill: #444; }
    .step { font-size: 21px; fill: #c62828; }
  </style>

  <!-- 縦の流れ（エーテル層） -->
  <rect class="eth" x="40" y="20" width="395" height="61" rx="8" />
  <text class="ttl" x="230" y="43" text-anchor="middle">はじめのエーテル溶液</text>
  <text class="small" x="230" y="66" text-anchor="middle">安息香酸・フェノール・アニリン・ニトロベンゼン</text>

  <path class="arw" d="M 230 76 L 230 130" />
  <polygon points="230,138 224,124 236,124" fill="#333" />
  <rect class="eth" x="40" y="138" width="395" height="45" rx="8" />
  <text class="name" x="230" y="164" text-anchor="middle">安息香酸・フェノール・ニトロベンゼン</text>

  <path class="arw" d="M 230 178 L 230 232" />
  <polygon points="230,240 224,226 236,226" fill="#333" />
  <rect class="eth" x="40" y="240" width="395" height="45" rx="8" />
  <text class="name" x="230" y="266" text-anchor="middle">フェノール・ニトロベンゼン</text>

  <path class="arw" d="M 230 280 L 230 334" />
  <polygon points="230,342 224,328 236,328" fill="#333" />
  <rect class="eth" x="40" y="342" width="395" height="61" rx="8" />
  <text class="ttl" x="230" y="365" text-anchor="middle">ニトロベンゼン</text>
  <text class="small" x="230" y="388" text-anchor="middle">中性なので塩にならず、最後までエーテル層に残る</text>

  <!-- 右へ出る枝（水層） -->
  <path class="arw" d="M 230 117 L 512 117" />
  <polygon points="520,117 506,111 506,123" fill="#333" />
  <text class="step" x="376" y="105" text-anchor="middle">① 塩酸を加える</text>
  <rect class="aq" x="520" y="89" width="375" height="61" rx="8" />
  <text class="ttl" x="540" y="112">水層へ　アニリン塩酸塩</text>
  <text class="small" x="540" y="135">NaOH を加えるとアニリンが遊離する</text>

  <path class="arw" d="M 230 219 L 512 219" />
  <polygon points="520,219 506,213 506,225" fill="#333" />
  <text class="step" x="376" y="207" text-anchor="middle">② NaHCO₃ 水溶液を加える</text>
  <rect class="aq" x="520" y="191" width="375" height="61" rx="8" />
  <text class="ttl" x="540" y="214">水層へ　安息香酸ナトリウム</text>
  <text class="small" x="540" y="237">塩酸を加えると安息香酸が遊離する</text>

  <path class="arw" d="M 230 321 L 512 321" />
  <polygon points="520,321 506,315 506,327" fill="#333" />
  <text class="step" x="376" y="309" text-anchor="middle">③ NaOH 水溶液を加える</text>
  <rect class="aq" x="520" y="293" width="375" height="61" rx="8" />
  <text class="ttl" x="540" y="316">水層へ　ナトリウムフェノキシド</text>
  <text class="small" x="540" y="339">塩酸を加えるとフェノールが遊離する</text>
</svg>
