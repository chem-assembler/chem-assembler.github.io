<svg xmlns="http://www.w3.org/2000/svg" width="741.053" height="421.053" viewBox="0 0 880 500" role="img">
  <!-- 中和滴定の4つの器具（線画）。左から、薄める → 測りとる → 滴下して中和させる の順。
