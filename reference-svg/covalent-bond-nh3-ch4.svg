<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" role="img">
  <!-- アンモニアとメタンの構造式（H を1つずつ書いた形）。手の本数を数えられるように、
       結合の線をすべて引いてある。⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。
       ★ 構造式はつながり方だけを表す図なので、立体（三角錐・正四面体）に見えないよう直交で組む。 -->
  <style>
    .bond { stroke: #333; stroke-width: 2.5; fill: none; }
    .atom { font-size: 27px; fill: #222; }
    .name { font-size: 18px; fill: #222; }
    .small { font-size: 15px; fill: #444; }
  </style>

  <!-- アンモニア NH₃ -->
  <path class="bond" d="M 200 152 L 200 116" />
  <path class="bond" d="M 136 168 L 178 168" />
  <path class="bond" d="M 222 168 L 264 168" />
  <text class="atom" x="200" y="108" text-anchor="middle">H</text>
  <text class="atom" x="200" y="177" text-anchor="middle">N</text>
  <text class="atom" x="124" y="177" text-anchor="middle">H</text>
  <text class="atom" x="276" y="177" text-anchor="middle">H</text>
  <text class="name" x="200" y="272" text-anchor="middle">アンモニア NH₃</text>
  <text class="small" x="200" y="300" text-anchor="middle">N の手3本をすべて使う</text>

  <!-- メタン CH₄ -->
  <path class="bond" d="M 500 152 L 500 116" />
  <path class="bond" d="M 436 168 L 478 168" />
  <path class="bond" d="M 522 168 L 564 168" />
  <path class="bond" d="M 500 184 L 500 220" />
  <text class="atom" x="500" y="108" text-anchor="middle">H</text>
  <text class="atom" x="500" y="177" text-anchor="middle">C</text>
  <text class="atom" x="424" y="177" text-anchor="middle">H</text>
  <text class="atom" x="576" y="177" text-anchor="middle">H</text>
  <text class="atom" x="500" y="240" text-anchor="middle">H</text>
  <text class="name" x="500" y="272" text-anchor="middle">メタン CH₄</text>
  <text class="small" x="500" y="300" text-anchor="middle">C の手4本をすべて使う</text>
</svg>
