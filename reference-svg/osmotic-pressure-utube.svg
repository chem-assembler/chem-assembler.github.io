<svg xmlns="http://www.w3.org/2000/svg" width="820" height="376" viewBox="0 0 820 376" role="img">
  <!-- 半透膜で仕切った U 字管の3段。① 入れた直後 ② 置くと溶液側が上がる ③ 圧力 Π で液面をそろえる。
