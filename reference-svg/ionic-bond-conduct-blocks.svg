<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img">
  <!-- イオン結晶が固体では電気を通さず、融解液・水溶液では通すわけ（2026-09-25・ユーザーの校正「レゴブロックモデルで説明、図が必要」）。
       ＋と−のブロックが、固体ではすき間なく組み上がって動けない／融けるとばらばらになり電極へ動いて電荷を運ぶ。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <defs>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .p { fill: #ffcc80; stroke: #e65100; stroke-width: 1.5; }
    .m { fill: #90caf9; stroke: #1565c0; stroke-width: 1.5; }
    .sign { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #333; }
    .b { font-family: system-ui, sans-serif; font-size: 18px; fill: #222; font-weight: 700; }
    .t { font-family: system-ui, sans-serif; font-size: 16px; fill: #222; }
    .el { fill: #9e9e9e; }
    .mv { stroke: #333; stroke-width: 1.8; fill: none; }
  </style>
  <!-- 左: 固体（4×4 をすき間なく） -->
  <text class="b" x="40" y="34">固体</text>
  <g>
    <rect class="p" x="40" y="50" width="40" height="40"/><text class="sign" x="60" y="77" text-anchor="middle">＋</text>
    <rect class="m" x="80" y="50" width="40" height="40"/><text class="sign" x="100" y="77" text-anchor="middle">−</text>
    <rect class="p" x="120" y="50" width="40" height="40"/><text class="sign" x="140" y="77" text-anchor="middle">＋</text>
    <rect class="m" x="160" y="50" width="40" height="40"/><text class="sign" x="180" y="77" text-anchor="middle">−</text>
    <rect class="m" x="40" y="90" width="40" height="40"/><text class="sign" x="60" y="117" text-anchor="middle">−</text>
    <rect class="p" x="80" y="90" width="40" height="40"/><text class="sign" x="100" y="117" text-anchor="middle">＋</text>
    <rect class="m" x="120" y="90" width="40" height="40"/><text class="sign" x="140" y="117" text-anchor="middle">−</text>
    <rect class="p" x="160" y="90" width="40" height="40"/><text class="sign" x="180" y="117" text-anchor="middle">＋</text>
    <rect class="p" x="40" y="130" width="40" height="40"/><text class="sign" x="60" y="157" text-anchor="middle">＋</text>
    <rect class="m" x="80" y="130" width="40" height="40"/><text class="sign" x="100" y="157" text-anchor="middle">−</text>
    <rect class="p" x="120" y="130" width="40" height="40"/><text class="sign" x="140" y="157" text-anchor="middle">＋</text>
    <rect class="m" x="160" y="130" width="40" height="40"/><text class="sign" x="180" y="157" text-anchor="middle">−</text>
    <rect class="m" x="40" y="170" width="40" height="40"/><text class="sign" x="60" y="197" text-anchor="middle">−</text>
    <rect class="p" x="80" y="170" width="40" height="40"/><text class="sign" x="100" y="197" text-anchor="middle">＋</text>
    <rect class="m" x="120" y="170" width="40" height="40"/><text class="sign" x="140" y="197" text-anchor="middle">−</text>
    <rect class="p" x="160" y="170" width="40" height="40"/><text class="sign" x="180" y="197" text-anchor="middle">＋</text>
  </g>
  <text class="t" x="40" y="244">組み上がって、決まった</text>
  <text class="t" x="40" y="268">位置から動けない</text>
  <text class="b" x="40" y="302">→ 電気を通さない</text>

  <!-- 右: 融解液・水溶液（ばらばらに動く・電極へ） -->
  <text class="b" x="330" y="34">融解液・水溶液</text>
  <rect class="el" x="330" y="56" width="12" height="160" />
  <text class="b" x="336" y="238" text-anchor="middle">−極</text>
  <rect class="el" x="628" y="56" width="12" height="160" />
  <text class="b" x="634" y="238" text-anchor="middle">＋極</text>
  <rect class="p" x="400" y="70" width="40" height="40"/><text class="sign" x="420" y="97" text-anchor="middle">＋</text>
  <path class="mv" marker-end="url(#mv)" d="M 396 90 L 356 90" />
  <rect class="m" x="520" y="80" width="40" height="40"/><text class="sign" x="540" y="107" text-anchor="middle">−</text>
  <path class="mv" marker-end="url(#mv)" d="M 564 100 L 612 100" />
  <rect class="p" x="450" y="150" width="40" height="40"/><text class="sign" x="470" y="177" text-anchor="middle">＋</text>
  <path class="mv" marker-end="url(#mv)" d="M 446 170 L 400 170" />
  <rect class="m" x="560" y="160" width="40" height="40"/><text class="sign" x="580" y="187" text-anchor="middle">−</text>
  <path class="mv" marker-end="url(#mv)" d="M 604 180 L 620 180" />
  <text class="t" x="330" y="268">ばらばらになって動き、電荷を運ぶ</text>
  <text class="b" x="330" y="302">→ 電気を通す</text>
</svg>
