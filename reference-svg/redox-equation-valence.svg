<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
  <!-- 酸化剤と還元剤の反応量の比（価数の逆の比）を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 20px; text-anchor: middle; }
    .wtext { fill: #fff; }
    .eq { font-size: 24px; text-anchor: start; }
    .boxYellow { fill: #fff; stroke: #ffcc00; stroke-width: 2; }
    .boxOrange { fill: #e0762b; stroke: #873600; stroke-width: 2; rx: 8; }
    .boxGreen { fill: #00b050; stroke: #005020; stroke-width: 2; rx: 8; }
    .pool { fill: #ffff00; stroke: #000; stroke-width: 2; }
    .arrow { fill: #ffff00; stroke: #000; stroke-width: 2; }
  </style>

  <!-- 上の式 -->
  <rect class="boxYellow" x="90" y="10" width="500" height="40" />
  <text x="340" y="37" font-size="22">（酸化剤の受け取るe<tspan font-size="14" dy="-8">-</tspan><tspan dy="8">の数） ＝ （還元剤の放出するe</tspan><tspan font-size="14" dy="-8">-</tspan><tspan dy="8">の数）</tspan></text>
  
  <rect class="boxYellow" x="30" y="60" width="620" height="40" />
  <text x="340" y="87" font-size="22">（酸化剤の価数） × （酸化剤の数） ＝ （還元剤の価数） × （還元剤の数）</text>

  <!-- 中央の図解 -->
  <!-- 左: 酸化剤 -->
  <rect class="boxOrange" x="200" y="120" width="90" height="60" />
  <text x="245" y="145" class="wtext">3価の</text>
  <text x="245" y="170" class="wtext">酸化剤</text>

  <rect class="boxOrange" x="200" y="200" width="90" height="60" />
  <text x="245" y="225" class="wtext">3価の</text>
  <text x="245" y="250" class="wtext">酸化剤</text>

  <!-- 電子プール -->
  <ellipse cx="340" cy="190" rx="30" ry="70" class="pool" />
  <text x="340" y="197" font-size="24">6e<tspan font-size="16" dy="-10">-</tspan></text>

  <!-- 右: 還元剤 -->
  <rect class="boxGreen" x="430" y="110" width="90" height="45" />
  <text x="475" y="130" class="wtext">2価の</text>
  <text x="475" y="150" class="wtext">還元剤</text>

  <rect class="boxGreen" x="430" y="167" width="90" height="45" />
  <text x="475" y="187" class="wtext">2価の</text>
  <text x="475" y="207" class="wtext">還元剤</text>

  <rect class="boxGreen" x="430" y="225" width="90" height="45" />
  <text x="475" y="245" class="wtext">2価の</text>
  <text x="475" y="265" class="wtext">還元剤</text>

  <!-- 矢印（右から中央へ） -->
  <polygon points="380,132 420,132 420,127 430,137 420,147 420,142 380,142" class="arrow" transform="rotate(180, 405, 137)" />
  <text x="405" y="125">2e<tspan font-size="12" dy="-8">-</tspan></text>

  <polygon points="380,189 420,189 420,184 430,194 420,204 420,199 380,199" class="arrow" transform="rotate(180, 405, 194)" />
  <text x="405" y="182">2e<tspan font-size="12" dy="-8">-</tspan></text>

  <polygon points="380,247 420,247 420,242 430,252 420,262 420,257 380,257" class="arrow" transform="rotate(180, 405, 252)" />
  <text x="405" y="240">2e<tspan font-size="12" dy="-8">-</tspan></text>

  <!-- 矢印（中央から左へ） -->
  <polygon points="300,150 350,150 350,145 360,155 350,165 350,160 300,160" class="arrow" transform="rotate(180, 330, 155)" />
  <text x="330" y="143">3e<tspan font-size="12" dy="-8">-</tspan></text>

  <polygon points="300,230 350,230 350,225 360,235 350,245 350,240 300,240" class="arrow" transform="rotate(180, 330, 235)" />
  <text x="330" y="223">3e<tspan font-size="12" dy="-8">-</tspan></text>

  <!-- 下のテキスト -->
  <text x="340" y="300" font-size="24">3価の酸化剤2個と2価の還元剤3個で完全に反応する</text>

  <rect class="boxYellow" x="140" y="320" width="400" height="45" />
  <text x="340" y="350" font-size="22">酸化剤と還元剤は<tspan font-weight="bold" font-size="26">価数の逆の比</tspan>で反応する</text>

</svg>
