<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img">
  <!-- 酸化剤と還元剤の役割と性質を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
    .titleText { font-family: "Times New Roman", serif; font-size: 20px; font-weight: bold; text-anchor: start; }
    .eq { font-family: "Times New Roman", serif; font-size: 22px; }
    .lineTable { stroke: #222; stroke-width: 1.5; fill: none; }
    .boxOrange { fill: #e0762b; stroke: #222; stroke-width: 1.5; rx: 8; }
    .boxGreen { fill: #00b050; stroke: #222; stroke-width: 1.5; rx: 8; }
    .wtext { fill: #fff; font-size: 16px; }
    .arrowYellow { fill: #ffff00; stroke: #222; stroke-width: 1.5; }
    .boxYellow { fill: none; stroke: #ffcc00; stroke-width: 2; }
    .textBold { font-weight: bold; }
  </style>

  <!-- タイトル -->
  <text x="10" y="30" class="titleText">【酸化剤と還元剤の役割・性質】</text>

  <!-- テーブル -->
  <g transform="translate(80, 50)">
    <!-- 横線 -->
    <line class="lineTable" x1="0" y1="0" x2="330" y2="0" />
    <line class="lineTable" x1="0" y1="25" x2="330" y2="25" />
    <line class="lineTable" x1="0" y1="50" x2="330" y2="50" />
    <line class="lineTable" x1="0" y1="75" x2="330" y2="75" />
    <line class="lineTable" x1="0" y1="100" x2="330" y2="100" />
    <line class="lineTable" x1="0" y1="125" x2="330" y2="125" />

    <!-- 縦線 -->
    <line class="lineTable" x1="0" y1="0" x2="0" y2="125" />
    <line class="lineTable" x1="110" y1="0" x2="110" y2="125" />
    <line class="lineTable" x1="220" y1="0" x2="220" y2="125" />
    <line class="lineTable" x1="330" y1="0" x2="330" y2="125" />

    <!-- 見出し -->
    <text x="165" y="18">酸化剤</text>
    <text x="275" y="18">還元剤</text>

    <!-- 1行目 -->
    <text x="55" y="43">相手を</text>
    <text x="165" y="43">酸化する</text>
    <text x="275" y="43">還元する</text>

    <!-- 2行目 -->
    <text x="55" y="68">自分は</text>
    <text x="165" y="68">還元される</text>
    <text x="275" y="68">酸化される</text>

    <!-- 3行目 -->
    <text x="55" y="93">電子を</text>
    <text x="165" y="93">受け取る</text>
    <text x="275" y="93">失う</text>

    <!-- 4行目 -->
    <text x="55" y="118">酸化数は</text>
    <text x="165" y="118">減る</text>
    <text x="275" y="118">増える</text>
  </g>

  <!-- 右側の図解 -->
  <g transform="translate(450, 80)">
    <rect class="boxOrange" x="0" y="0" width="65" height="50" />
    <text x="32.5" y="30" class="wtext">酸化剤</text>

    <rect class="boxGreen" x="130" y="0" width="65" height="50" />
    <text x="162.5" y="30" class="wtext">還元剤</text>

    <!-- 電子の矢印 -->
    <!-- 右から左へ -->
    <polygon points="75,25 90,15 90,20 120,20 120,30 90,30 90,35" class="arrowYellow" />
    <text x="100" y="10" class="eq">e<tspan font-size="12" dy="-8">-</tspan></text>
  </g>

  <!-- 下部テキスト枠 -->
  <rect class="boxYellow" x="30" y="190" width="600" height="25" />
  <text x="330" y="208">「反応によって<tspan class="textBold">酸化数</tspan>の<tspan class="textBold">変化</tspan>した原子がある」 ＝ 「<tspan class="textBold">酸化還元反応</tspan>である」</text>

  <rect class="boxYellow" x="150" y="225" width="340" height="50" />
  <text x="320" y="245">酸化数が<tspan class="textBold">減った</tspan>原子を含む物質が<tspan class="textBold">酸化剤</tspan></text>
  <text x="320" y="268">酸化数が<tspan class="textBold">増えた</tspan>原子を含む物質が<tspan class="textBold">還元剤</tspan></text>

</svg>
