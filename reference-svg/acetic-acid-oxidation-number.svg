<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="120 60 620 300" role="img">
  <!-- 酢酸の結合を、共有電子対が寄るほうへ向けた矢印で描いた図。
       C−H は C へ（−1 が3本）、C−C は偏らない（0）、C=O は O へ2本（＋2）、C−O は O へ1本（＋1）。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <defs>
    <marker id="mg" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2e7d32" /></marker>
    <marker id="mr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c62828" /></marker>
  </defs>
  <style>
    .atom { font-size: 30px; fill: #222; text-anchor: middle; }
    .plain { stroke: #333; stroke-width: 2.5; fill: none; }
    .toC { stroke: #2e7d32; stroke-width: 2.5; fill: none; marker-end: url(#mg); }
    .toO { stroke: #c62828; stroke-width: 2.5; fill: none; marker-end: url(#mr); }
    .m { font-size: 15px; text-anchor: middle; }
    .g { fill: #2e7d32; } .r { fill: #c62828; }
    .nm { font-size: 15px; fill: #555; text-anchor: middle; }
    .ox { font-size: 22px; fill: #6a1b9a; text-anchor: middle; }
    .small { font-size: 14px; fill: #444; text-anchor: middle; }
  </style>

  <!-- 原子 -->
  <text class="atom" x="300" y="215">C</text>
  <text class="atom" x="470" y="215">C</text>
  <text class="atom" x="470" y="120">O</text>
  <text class="atom" x="590" y="215">O</text>
  <text class="atom" x="676" y="215">H</text>
  <text class="atom" x="190" y="215">H</text>
  <text class="atom" x="232" y="138">H</text>
  <text class="atom" x="232" y="292">H</text>

  <!-- C−H は共有電子対が C 側へ -->
  <path class="toC" d="M 212 205 L 276 205" />
  <path class="toC" d="M 250 150 L 284 191" />
  <path class="toC" d="M 250 262 L 284 221" />
  <text class="m g" x="245" y="228">−1</text>
  <text class="m g" x="292" y="162">−1</text>
  <text class="m g" x="292" y="258">−1</text>

  <!-- C−C は偏らない -->
  <path class="plain" d="M 322 205 L 448 205" />
  <text class="small" x="385" y="188">C−C は 0</text>

  <!-- C=O と C−O は共有電子対が O 側へ -->
  <path class="toO" d="M 462 182 L 462 132" />
  <path class="toO" d="M 478 182 L 478 132" />
  <text class="m r" x="512" y="154">＋2</text>
  <path class="toO" d="M 492 205 L 566 205" />
  <text class="m r" x="528" y="190">＋1</text>
  <path class="plain" d="M 612 205 L 660 205" />

  <!-- それぞれの C の酸化数 -->
  <text class="nm" x="300" y="308">メチル基の C</text>
  <text class="ox" x="300" y="340">−3</text>
  <text class="nm" x="470" y="308">カルボキシ基の C</text>
  <text class="ox" x="470" y="340">＋3</text>
</svg>
