<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img">
  <!-- 左: 密度で質量と体積をつなぐ（1.51 g : 1 cm³ ＝ □ g : 200 cm³ の ×200）。
       右: 質量パーセント濃度の帯（63% の濃硝酸 100 g を 37 g と 63 g に分ける）。
       ⚠ 本文と同じ値（密度 1.51 g/cm³・200 cm³ で 302 g・HNO₃ 63 g ＝ 1.0 mol）でそろえる。
       ⚠ 箱の大きさを 1 cm³ と 200 cm³ で描き分けると縮尺が嘘になるので、比例の行で見せる。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <style>
    .cell { fill: #fcfcfc; stroke: #333; stroke-width: 2; }
    .val { font-size: 19px; fill: #222; }
    .head { font-size: 16px; fill: #555; }
    .title { font-size: 17px; fill: #222; }
    .small { font-size: 15px; fill: #444; }
  </style>

  <!-- ===== 左: 密度 ===== -->
  <text class="title" x="56" y="54">密度 1.51 g/cm³ でつなぐ</text>
  <text class="head" x="150" y="94" text-anchor="middle">質量</text>
  <text class="head" x="310" y="94" text-anchor="middle">体積</text>

  <rect class="cell" x="90" y="108" width="120" height="48" />
  <text class="val" x="150" y="139" text-anchor="middle">1.51 g</text>
  <rect class="cell" x="250" y="108" width="120" height="48" />
  <text class="val" x="310" y="139" text-anchor="middle">1 cm³</text>

  <rect class="cell" x="90" y="248" width="120" height="48" />
  <text class="val" x="150" y="279" text-anchor="middle">302 g</text>
  <rect class="cell" x="250" y="248" width="120" height="48" />
  <text class="val" x="310" y="279" text-anchor="middle">200 cm³</text>

  <path d="M 150 164 L 150 234" style="stroke:#1565c0;stroke-width:2;fill:none" />
  <polygon points="150,244 143,228 157,228" fill="#1565c0" />
  <text class="small" x="164" y="204" style="fill:#1565c0">×200</text>
  <path d="M 310 164 L 310 234" style="stroke:#1565c0;stroke-width:2;fill:none" />
  <polygon points="310,244 303,228 317,228" fill="#1565c0" />
  <text class="small" x="324" y="204" style="fill:#1565c0">×200</text>

  <text class="small" x="56" y="332">同じ倍率で両側を動かす。</text>
  <text class="small" x="56" y="354">200 cm³ の濃硝酸は 302 g ≒ 3.0×10² g。</text>

  <!-- 仕切り -->
  <path d="M 416 44 L 416 360" style="stroke:#e0e0e0;stroke-width:1.5;fill:none" />

  <!-- ===== 右: 質量パーセント濃度の帯 ===== -->
  <text class="title" x="456" y="54">63% の濃硝酸 100 g の帯</text>

  <path d="M 460 108 L 460 96 L 800 96 L 800 108" style="stroke:#555;stroke-width:1.5;fill:none" />
  <text class="head" x="630" y="86" text-anchor="middle">溶液 100 g</text>

  <rect x="460" y="134" width="126" height="52" fill="#ddeefb" stroke="#333" stroke-width="2" />
  <rect x="586" y="134" width="214" height="52" fill="#fae3c8" stroke="#333" stroke-width="2" />
  <text class="val" x="523" y="167" text-anchor="middle">水 37 g</text>
  <text class="val" x="693" y="167" text-anchor="middle">HNO₃ 63 g</text>

  <text class="small" x="523" y="212" text-anchor="middle">37%</text>
  <text class="small" x="693" y="212" text-anchor="middle">63%</text>

  <path d="M 693 224 L 693 250" style="stroke:#c62828;stroke-width:2;fill:none" />
  <polygon points="693,260 686,244 700,244" fill="#c62828" />
  <text class="val" x="693" y="290" text-anchor="middle" style="fill:#c62828">1.0 mol</text>
  <text class="small" x="693" y="318" text-anchor="middle">HNO₃ の式量 63 なので 1 mol : 63 g</text>
</svg>
