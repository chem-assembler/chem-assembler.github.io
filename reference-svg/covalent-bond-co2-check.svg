<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img">
  <!-- 二酸化炭素の電子式の間違い（共有電子対1組ずつ）と正しい形（2組ずつ）。原子ごとに丸で囲んで電子を数え、8個になっているかを確かめる。2026-09-26 ユーザー校正「実際に間違っている図を表示して何が違うかを説明」「確認を図で示す」。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; }
    .sym { font-size: 24px; font-weight: 700; text-anchor: middle; }
    .b { font-weight: 700; font-size: 17px; }
    .s { font-size: 15px; fill: #444; }
    .hd { font-weight: 700; font-size: 15px; fill: #333; text-anchor: middle; }
    .c { text-anchor: middle; }
    .red { fill: #c62828; font-weight: 700; }
    .blue { fill: #1f618d; font-weight: 700; }
    .grid { stroke: #cfd6de; stroke-width: 1; }
    .shell { fill: none; stroke: #1f618d; stroke-width: 2; }
    .nuc { fill: #fde2c4; stroke: #e0762b; stroke-width: 2; }
    .e { fill: #ffe14d; stroke: #1f618d; stroke-width: 2; }
    .bond { stroke: #222; stroke-width: 2.4; }
  </style>
  <text x="30" y="34" class="b red">✗ 共有電子対を1組ずつ</text>
  <text x="370" y="34" class="b blue">○ 構造式 O＝C＝O のとおり2組ずつ</text>
  <g transform="translate(0 130)">
