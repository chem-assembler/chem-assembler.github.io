  <text x="370" y="232" class="s">（共有電子対は両方に数える）</text>
  <text x="370" y="256" class="s">O: 8個　C: 8個　O: 8個</text>
  <text x="370" y="286" class="blue">→ どの原子も8個（オクテット）で完成</text>
