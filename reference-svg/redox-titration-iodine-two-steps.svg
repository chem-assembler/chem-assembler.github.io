<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
  <!-- 酸化還元滴定（ヨウ素滴定）の2段階の反応式を立てる手順。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。
       2026-09-25: 青い囲みを式の長さに合わせて広げた。吹き出し1の「I⁻はもともととくっついてK⁺だった」を「I⁻はもともとK⁺とくっついてKIだった」に直した。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; }
    .eq { font-family: "Times New Roman", serif; font-size: 20px; }
    .eq tspan.s { font-size: 14px; }
    .noteBox { fill: #fff; stroke: #e0762b; stroke-width: 1.5; }
    .lead { stroke: #e0762b; stroke-width: 1.5; fill: none; }
    .frame { fill: none; stroke: #0078d7; stroke-width: 2; }
    .line { stroke: #222; stroke-width: 1; }
  </style>

  <!-- (1) -->
  <text x="10" y="24">(1) 硫酸酸性条件でH<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">O</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">が酸化剤，KIが還元剤としてはたらく</tspan></text>
  
  <text class="eq" x="150" y="55">H<tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"> + 2H</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5"> + 2e</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"> → 2H</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan></text>
  <text class="eq" x="100" y="85">+)<tspan dx="115">2I</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"> → I</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"> + 2e</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"></tspan></text>
  <line x1="100" y1="95" x2="400" y2="95" class="line" />
  
  <text class="eq" x="150" y="120">H<tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"> + 2H</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5"> + 2I</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"> → 2H</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">O + I</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"></tspan></text>
  <text class="eq" x="100" y="150">+)<tspan dx="30">+ SO</tspan><tspan class="s" dy="5">4</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"> + 2K</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5" dx="20">+ 2K</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5"> + SO</tspan><tspan class="s" dy="5">4</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"></tspan></text>
  <line x1="100" y1="160" x2="420" y2="160" class="line" />
  
  <rect class="frame" x="100" y="170" width="390" height="32" />
  <text class="eq" x="110" y="193">H<tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"> + H</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">SO</tspan><tspan class="s" dy="5">4</tspan><tspan dy="-5"> + 2KI → 2H</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">O + I</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5"> + K</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">SO</tspan><tspan class="s" dy="5">4</tspan><tspan dy="-5"></tspan></text>

  <!-- 吹き出し1 -->
  <path class="lead" d="M 460 110 L 400 120" />
  <rect class="noteBox" x="460" y="30" width="210" height="110" />
  <text x="465" y="50">左辺のH<tspan font-size="12" dy="-5">+</tspan><tspan dy="5">はもともとSO</tspan><tspan font-size="12" dy="5">4</tspan><tspan font-size="12" dy="-10">2-</tspan><tspan dy="5"></tspan></text>
  <text x="465" y="70">とくっついてH<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">SO</tspan><tspan font-size="12" dy="5">4</tspan><tspan dy="-5">，I</tspan><tspan font-size="12" dy="-5">-</tspan><tspan dy="5">は</tspan></text>
  <text x="465" y="90">もともとK<tspan font-size="12" dy="-5">+</tspan><tspan dy="5">とくっついて</tspan></text>
  <text x="465" y="110">KIだったので，両辺に</text>
  <text x="465" y="130">SO<tspan font-size="12" dy="5">4</tspan><tspan font-size="12" dy="-10">2-</tspan><tspan dy="5">と2K</tspan><tspan font-size="12" dy="-5">+</tspan><tspan dy="5">を加える</tspan></text>

  <!-- (2) -->
  <text x="10" y="240">(2) (1)の反応で生じたI<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">が酸化剤，Na</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">S</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">O</tspan><tspan font-size="12" dy="4">3</tspan><tspan dy="-4">が還元剤としてはたらく</tspan></text>
  
  <text class="eq" x="220" y="270">I<tspan class="s" dy="5">2</tspan><tspan dy="-5"> + 2e</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"> → 2I</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"></tspan></text>
  <text class="eq" x="160" y="300">+)<tspan dx="25">2S</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">3</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"> → S</tspan><tspan class="s" dy="5">4</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">6</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"> + 2e</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"></tspan></text>
  <line x1="160" y1="310" x2="400" y2="310" class="line" />
  
  <rect class="frame" x="170" y="320" width="250" height="32" />
  <text class="eq" x="180" y="343">I<tspan class="s" dy="5">2</tspan><tspan dy="-5"> + 2S</tspan><tspan class="s" dy="5">2</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">3</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"> → 2I</tspan><tspan class="s" dy="-5">-</tspan><tspan dy="5"> + S</tspan><tspan class="s" dy="5">4</tspan><tspan dy="-5">O</tspan><tspan class="s" dy="5">6</tspan><tspan class="s" dy="-10">2-</tspan><tspan dy="5"></tspan></text>

  <!-- 吹き出し2 -->
  <path class="lead" d="M 460 250 L 400 262" />
  <rect class="noteBox" x="460" y="240" width="210" height="70" />
  <text x="465" y="260">半反応式よりNa<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">S</tspan><tspan font-size="12" dy="4">2</tspan><tspan dy="-4">O</tspan><tspan font-size="12" dy="4">3</tspan><tspan dy="-4">は還</tspan></text>
  <text x="465" y="280">元剤と判断できるので，</text>
  <text x="465" y="300">酸化剤であるI<tspan font-size="12" dy="4">2</tspan><tspan dy="-4">と反応した</tspan></text>

</svg>
