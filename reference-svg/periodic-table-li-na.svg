<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
  <!-- 周期表の陽性・陰性と、Li・Naの原子モデルの比較を示す図。
       元はスライドの図。文字サイズを確保するため SVG に描き直した（2026-09-24・字の床 14px）。 -->
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; font-size: 16px; }
    .titleText { font-family: "Times New Roman", serif; font-size: 24px; text-anchor: middle; }
    .descText { font-size: 14px; }
    .boxMetal { fill: #fae5b6; stroke: #222; stroke-width: 1; }
    .boxNonmetal { fill: #ccecf7; stroke: #222; stroke-width: 1; }
    .arrow { stroke: #1f618d; stroke-width: 6; fill: none; marker-end: url(#arrowhead); marker-start: url(#arrowhead-start); }
    .arrowRed { stroke: #ff0000; stroke-width: 2; fill: none; marker-end: url(#arrowheadRed); }
    .textOrange { fill: #e0762b; font-weight: bold; font-size: 18px; }
    .textBlue { fill: #1f618d; font-weight: bold; font-size: 18px; }
    .shell { fill: none; stroke: #222; stroke-width: 1.5; }
    .nucleus { fill: #fff; stroke: #e0762b; stroke-width: 1.5; }
    .electron { fill: #ffff00; stroke: #222; stroke-width: 1.5; }
    .strongBox { fill: #fff; stroke: #e0762b; stroke-width: 1.5; }
    .lead { stroke: #e0762b; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto">
      <polygon points="0,0 4,2 0,4" fill="#1f618d" />
    </marker>
    <marker id="arrowhead-start" markerWidth="4" markerHeight="4" refX="1" refY="2" orient="auto-start-reverse">
      <polygon points="0,0 4,2 0,4" fill="#1f618d" />
    </marker>
    <marker id="arrowheadRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#ff0000" />
    </marker>
  </defs>

  <!-- 左側: 周期表と説明 -->
  <g transform="translate(10, 10)">
    <g transform="scale(1.2)">
      <!-- 周期表のグリッド描画 (18列 x 7行, セルサイズ12x12) -->
      <!-- 1行目 -->
      <rect class="boxNonmetal" x="0" y="0" width="12" height="12" />
      <rect class="boxNonmetal" x="204" y="0" width="12" height="12" />
      <!-- 2行目 -->
      <rect class="boxMetal" x="0" y="12" width="12" height="12" />
      <rect class="boxMetal" x="12" y="12" width="12" height="12" />
      <rect class="boxMetal" x="144" y="12" width="12" height="12" />
      <rect class="boxNonmetal" x="156" y="12" width="12" height="12" />
      <rect class="boxNonmetal" x="168" y="12" width="12" height="12" />
      <rect class="boxNonmetal" x="180" y="12" width="12" height="12" />
      <rect class="boxNonmetal" x="192" y="12" width="12" height="12" />
      <rect class="boxNonmetal" x="204" y="12" width="12" height="12" />
      <!-- 3行目 -->
      <rect class="boxMetal" x="0" y="24" width="12" height="12" />
      <rect class="boxMetal" x="12" y="24" width="12" height="12" />
      <rect class="boxMetal" x="144" y="24" width="12" height="12" />
      <rect class="boxMetal" x="156" y="24" width="12" height="12" />
      <rect class="boxNonmetal" x="168" y="24" width="12" height="12" />
      <rect class="boxNonmetal" x="180" y="24" width="12" height="12" />
      <rect class="boxNonmetal" x="192" y="24" width="12" height="12" />
      <rect class="boxNonmetal" x="204" y="24" width="12" height="12" />
      <!-- 4行目 -->
      <rect class="boxMetal" x="0" y="36" width="24" height="12" />
      <rect class="boxMetal" x="24" y="36" width="120" height="12" />
      <rect class="boxMetal" x="144" y="36" width="36" height="12" />
      <rect class="boxNonmetal" x="180" y="36" width="36" height="12" />
      <!-- 5行目 -->
      <rect class="boxMetal" x="0" y="48" width="192" height="12" />
      <rect class="boxNonmetal" x="192" y="48" width="24" height="12" />
      <!-- 6行目 -->
      <rect class="boxMetal" x="0" y="60" width="204" height="12" />
      <rect class="boxNonmetal" x="204" y="60" width="12" height="12" />
      <!-- 7行目 -->
      <rect class="boxMetal" x="0" y="72" width="216" height="12" fill="#fff" />

      <!-- 凡例 -->
      <rect class="boxMetal" x="30" y="0" width="55" height="18" />
      <text x="57" y="14" style="font-size: 14px;" text-anchor="middle">金属</text>
      <rect class="boxNonmetal" x="30" y="18" width="55" height="18" />
      <text x="57" y="32" style="font-size: 14px;" text-anchor="middle">非金属</text>

      <!-- 矢印と文字 -->
      <path class="arrow" d="M 40 70 L 175 25" />
      <text x="15" y="95" class="textOrange" style="font-size: 18px;" text-anchor="start">陽性</text>
      <text x="225" y="15" class="textBlue" style="font-size: 18px;" text-anchor="start">陰性</text>
    </g>

    <!-- 説明文 -->
    <text x="0" y="135" class="descText">周期表の同一<tspan font-weight="bold">族</tspan>の元素は有効</text>
    <text x="0" y="155" class="descText">核電荷が同じで下側の元素ほ</text>
    <text x="0" y="175" class="descText">ど<tspan font-weight="bold">原子半径</tspan>が大きくなり，最</text>
    <text x="0" y="195" class="descText">外殻電子をひきつける力が弱</text>
    <text x="0" y="215" class="descText">くなるので陽性が強い（クー</text>
    <text x="0" y="235" class="descText">ロン力は距離の2乗に反比例）</text>
  </g>

  <!-- 右側: 原子モデル -->
  <g transform="translate(320, 10)">
    <!-- Li -->
    <text x="60" y="20" class="titleText">Li</text>
    <circle cx="60" cy="80" r="25" class="shell" />
    <circle cx="60" cy="80" r="40" class="shell" />
    <circle cx="60" cy="80" r="10" class="nucleus" />
    <text x="60" y="85" font-size="12" text-anchor="middle">+3</text>
    
    <circle cx="100" cy="80" r="4" class="electron" />
    <path class="arrowRed" d="M 96 80 L 75 80" stroke-width="3" />
    
    <!-- Li 強 -->
    <rect class="strongBox" x="110" y="25" width="20" height="20" />
    <text x="120" y="40" font-size="14" text-anchor="middle">強</text>
    <path class="lead" d="M 110 45 L 85 75" />

    <!-- Na -->
    <text x="240" y="20" class="titleText">Na</text>
    <circle cx="240" cy="80" r="20" class="shell" />
    <circle cx="240" cy="80" r="35" class="shell" />
    <circle cx="240" cy="80" r="50" class="shell" />
    <circle cx="240" cy="80" r="12" class="nucleus" />
    <text x="240" y="85" font-size="12" text-anchor="middle">+11</text>
    
    <circle cx="290" cy="80" r="4" class="electron" />
    <path class="arrowRed" d="M 286 80 L 257 80" stroke-width="1.5" />
    
    <!-- Na 弱 -->
    <rect class="strongBox" x="300" y="25" width="20" height="20" />
    <text x="310" y="40" font-size="14" text-anchor="middle">弱</text>
    <path class="lead" d="M 300 45 L 285 75" />

    <!-- 説明文 -->
    <text x="-30" y="165" class="descText">Liは最外殻がL殻， Naは最外殻がM殻であり，原子</text>
    <text x="-30" y="185" class="descText">核から最外殻電子までの距離は Li &lt; Na なので，Li</text>
    <text x="-30" y="205" class="descText">の方が最外殻電子を強く引きつけ自分の最外殻電</text>
    <text x="-30" y="225" class="descText">子をとられにくく（イオン化エネルギーが大き</text>
    <text x="-30" y="245" class="descText">く），他人の電子を奪う力が強い（電子親和力が</text>
    <text x="-30" y="265" class="descText">大きい）</text>
  </g>

</svg>
