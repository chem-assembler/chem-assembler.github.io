<svg xmlns="http://www.w3.org/2000/svg" width="648.421" height="169.474" viewBox="0 0 880 230" role="img">
  <!-- デンプン → デキストリン → マルトース → グルコース。丸1つがグルコース1個で、鎖が短くなっていく。
       ⚠ 図の正はこのファイル。PNG は tools/gen-svg-figure.mjs の生成物。 -->
  <style>
    .beads { stroke: #1565c0; stroke-width: 15; stroke-linecap: round; stroke-dasharray: 0.1 15; fill: none; }
    .arw { stroke: #333; stroke-width: 2.5; fill: none; }
    .lab { font-size: 18px; fill: #222; }
    .small { font-size: 14px; fill: #444; }
    .enz { font-size: 15px; fill: #c62828; }
  </style>

  <!-- デンプン -->
  <path class="beads" d="M 30 96 C 66 78, 92 110, 128 92 C 148 82, 158 98, 170 90" />
  <text class="lab" x="100" y="152" text-anchor="middle">デンプン</text>
  <text class="small" x="100" y="176" text-anchor="middle">長い鎖</text>

  <path class="arw" d="M 185 90 L 240 90" />
  <polygon points="250,90 236,84 236,96" fill="#333" />
  <text class="enz" x="215" y="72" text-anchor="middle">アミラーゼ</text>

  <!-- デキストリン -->
  <path class="beads" d="M 296 94 C 316 82, 340 104, 364 92" />
  <text class="lab" x="330" y="152" text-anchor="middle">デキストリン</text>
  <text class="small" x="330" y="176" text-anchor="middle">途中まで切れた短い鎖</text>

  <path class="arw" d="M 415 90 L 468 90" />
  <polygon points="478,90 464,84 464,96" fill="#333" />
  <text class="enz" x="444" y="72" text-anchor="middle">さらに切れる</text>

  <!-- マルトース -->
  <circle cx="531" cy="90" r="8" fill="#1565c0" />
  <circle cx="549" cy="90" r="8" fill="#1565c0" />
  <text class="lab" x="540" y="152" text-anchor="middle">マルトース</text>
  <text class="small" x="540" y="176" text-anchor="middle">グルコース2個ぶん（二糖）</text>

  <path class="arw" d="M 600 90 L 682 90" />
  <polygon points="692,90 678,84 678,96" fill="#333" />
  <text class="enz" x="642" y="72" text-anchor="middle">マルターゼ</text>

  <!-- グルコース -->
  <circle cx="760" cy="90" r="8" fill="#1565c0" />
  <text class="lab" x="760" y="152" text-anchor="middle">グルコース</text>
  <text class="small" x="760" y="176" text-anchor="middle">1個（単糖）</text>
</svg>
