<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img">
  <!-- 同じ周期（横）の比較: Li と F。最外殻はどちらも L殻で距離はほぼ同じ、実質の電荷が +1 と +7（2026-09-25・ユーザー校正「縦の比較とヨコの比較を明確にわけて、それぞれ図も用いて」）。
       図の正はこのファイル。PNG は gen-svg-figure.mjs の生成物。 -->
  <style>
