    <h1>イオンをつきとめる</h1>
    <p class="lead">
        容器の中に入っている金属イオンは <strong>1種類だけ</strong>です。<br>

        <span class="lead-sub">札を押す順番に決まりはありません。押した結果は下に残ります。</span>
