<div id="sep-app">

        <a class="hubLink" href="../index.html">🏠 化学レンズ</a>

    <h1>イオンをつきとめる</h1>
    <!-- ⚠ 導入に書いてよいのは、**画面から読み取れないこと**だけ。★ それが2つある:
         ① 中身が1種類だけであること
         ②★★ **1手ごとに、試料を新しく取り直していること**（2026-08-28・ユーザー指摘）
         ⚠⚠ ②が要る理由 —— 札を続けて押しても、前の札の結果が次に効かない。
           札が「希塩酸を加えたあと、できた沈殿に熱水を注ぐ」のように **1回で完結した実験**に
           なっているのはこのためで、⚠ 書かないと「操作が積み上がる」と読まれる。
         ★ 作りと合っていることは実測済み（`sepObserve` は履歴を受け取らず、
           順番を入れ替えた 5400 件で観察が1件も変わらない。tests.js が見張っている）。 -->
    <p class="lead">
        容器の中に、候補のうち <strong>1種類だけ</strong>が入っています。実験して、どのイオンかを当ててください。
        実験は毎回、試料を少しずつ取って新しく行います。
    </p>

    <!-- ★ 問題の一覧は持たない。⚠ 押すたびに容器ごと引き直す（2026-08-26・ユーザー決定） -->
    <section class="panel" id="panel-level">
        <h2>難易度</h2>
        <div id="levels" class="tabs"></div>
        <button id="btn-new" class="secondary">べつの容器にする</button>
    </section>

    <!-- ⚠⚠ ここに出題の説明文を書かないこと。★ 解き筋を先に配ることになる（2026-08-27）。
         出してよいのは難易度の印と候補の数だけ（tests.js が見張っている） -->
    <section class="panel" id="panel-problem">
        <!-- ★ 人に見せる問題 ID（2026-08-28・ユーザー「問題にIDを付与、成績の集計へ」）。
             ⚠⚠ 中身のイオンは入っていない —— ★ 入れたら、解いている最中に答えを配ってしまう。
             ⚠ 入っているのは候補の組だけで、それは下にそのまま並んでいる。 -->
        <h2 id="prob-title">この容器 <span class="pid" id="prob-id"></span></h2>
        <p class="note" id="prob-note"></p>
        <div id="cand-list" class="chips"></div>
    </section>

    <section class="panel" id="panel-ops">
        <h2>実験する</h2>
        <div id="ops" class="ops"></div>
    </section>

    <section class="panel" id="panel-log">
        <h2>結果 <span id="log-count" class="count"></span></h2>
        <p class="note" id="log-empty">まだ何もしていません。上の札を押すと、結果がここに並びます。</p>
        <ol id="log" class="log"></ol>
    </section>

    <section class="panel" id="panel-answer">
        <button id="btn-answer" class="primary">答える</button>
        <div id="answer-choices" class="chips hidden"></div>
        <div id="result" class="result hidden"></div>
        <div id="after" class="after hidden">
            <button id="btn-again" class="secondary">次の容器へ</button>
        </div>
    </section>

    <p class="foot">
        <a href="../privacy.html">プライバシーポリシー</a>
    </p>
</div>
