    <h1>すべてのイオンを分ける</h1>
    <!-- ⚠ 導入はこの1行だけ（文言はユーザーが決めたもの・2026-08-28）。
         ★ 「中身は分かっています」は落とした —— ツリーの「この容器」に中身のイオンが並び、
           手札にも同じイオンが揃っているので、推理ではないことは画面から読み取れる。
         ★ 「ぜんぶ置いてから提出すると…」も落とした —— 提出ボタンが見えていて、押せば分かる。 -->
    <p class="lead">容器の中に含まれているイオンを単離しよう。</p>

    <!-- ⚠⚠ ここに解き筋を書かないこと（型B と同じ縛り。tests.js が見張っている）。
         出してよいのは、やり方の名前と印だけ -->
    <section class="panel" id="panel-mode">
        <h2>やり方</h2>
        <div id="modes" class="tabs"></div>
        <!-- ★ 難易度は学習者が選ぶ（型B と同じ）。
             ⚠⚠ ここに解き筋を書かないこと。出してよいのは段の名前と印だけ。
             ★ 難易度そのものは門番が数えた値から出している（tree-model.js の treeDifficulty） -->
        <div id="probs" class="tabs"></div>
        <button id="btn-new" class="secondary" type="button">べつの容器にする</button>
    </section>

    <section class="panel" id="panel-hand">
        <h2>手札</h2>
        <!-- ★ タップで選び、タップで置く（⚠ ドラッグは使わない。理由は tree.js の冒頭） -->
        <p class="note">札を押してから、置きたいところを押します。置いた札はもう一度押すと戻ります。</p>
        <div id="op-deck" class="deck"></div>
        <div id="ion-deck" class="deck"></div>
        <p class="hint" id="hint"></p>
    </section>

    <!-- ★★ 流れ図は「主流1列 ＋ 深さ」で組む（2026-08-28・ユーザー指摘で作り直した）。
         ・溶液（ろ液）は **左の1列**を上から下へ。角丸
         ・沈殿は主流から **右へ**出て、そこで止まる。□
         ・⚠ 沈殿がさらに割れる問題を入れたら、そのさらに右へ伸びる（深さ＋1 ＝ 列＋1）
         ⚠⚠ 列の数を定数で持たないこと。★ データの深さから出す（tree.js の treeColumns）。
         ★ 深さ1のときの見た目が、ちょうど2カラムになる -->
    <section class="panel" id="panel-tree">
        <h2>ツリー</h2>
        <div class="flow" id="flow"></div>
    </section>

    <section class="panel" id="panel-submit">
        <!-- ⚠ 途中では何も返さない（§16-1）。★ 返すのは、ここを押したあとだけ -->
        <button id="btn-submit" class="primary" type="button">提出する</button>
        <button id="btn-reset" class="secondary" type="button">置き直す</button>
        <div id="result" class="result hidden"></div>
    </section>

    <p class="foot">
        <a href="../privacy.html">プライバシーポリシー</a>
    </p>
