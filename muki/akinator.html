    <h1>かくれた物質をつきとめる</h1>
    <!-- ⚠ 導入に書いてよいのは、**画面から読み取れないこと**だけ:
         ① 下の候補のうち1つがかくれていること
         ② 答えは「はい」か「いいえ」しか返らないこと
         ⛔ 解き筋（どの質問から訊くか）を書かない -->
    <p class="lead">
        下の候補のうち <strong>1つ</strong>をかくしました。質問には「はい」「いいえ」で答えます。
    </p>

    <section class="panel" id="panel-cands">
        <h2>候補 <span class="count" id="cand-count"></span> <span class="deck" id="deck-name"></span></h2>
        <p class="note">消えたと思ったものは、押して伏せておけます。</p>
        <div id="cand-list" class="chips"></div>
        <button id="btn-new" class="secondary">べつの物質をかくす</button>
    </section>

    <section class="panel" id="panel-cards">
        <h2>質問する <span class="count" id="card-count"></span></h2>
        <div class="finder">
            <div id="tags" class="tags"></div>
            <input id="q" type="search" placeholder="さがす（例: 黄、Cu、炎色）" autocomplete="off">
        </div>
        <p class="note hidden" id="card-empty">その言葉にあてはまる質問はありません。</p>
        <div id="card-rows" class="rows"></div>
    </section>

    <section class="panel" id="panel-log">
        <h2>きいたこと <span id="log-count" class="count"></span></h2>
        <p class="note" id="log-empty">まだ何も訊いていません。上の質問を押すと、答えがここに並びます。</p>
        <ol id="log" class="log"></ol>
    </section>

    <section class="panel" id="panel-answer">
        <button id="btn-answer" class="primary">答える</button>
        <div id="answer-choices" class="answer hidden"></div>
        <div id="result" class="result hidden"></div>
        <div id="after" class="after hidden">
            <button id="btn-again" class="secondary">つぎの物質へ</button>
        </div>
    </section>

    <p class="foot">
        <a href="../privacy.html">プライバシーポリシー</a>
    </p>
