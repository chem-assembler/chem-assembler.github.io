<header>
  <h1>反応の量的関係</h1>

<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（比例式と同じ「倍率」だけ）</summary>
      <ol>
        <li><b>係数の比が、反応する mol の比</b>。係数の行が基準になる。</li>
        <li>実際に反応した量は <b>係数 × 倍率</b>。同じ倍率がすべての物質にはたらく。</li>
        <li>過不足は<b>倍率の比べっこ</b>。<b>量 ÷ 係数</b>が一番小さいところで反応は止まる。</li>
        <li>比べられるのは <b>mol</b>（g は分子量が物質ごとに違うので直接比べられない）。
            ただし<b>気体同士なら体積の比がそのまま係数の比</b>なので、
            <b>mol に直さなくてよい</b>。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <!-- 反応インデックス（別アプリ）から来たときだけ出る戻り道。
         横断が片道だと、辞書引きの流れがここで途切れる -->

    <div id="eqBox"></div>

    <div id="convIn"></div>

    <div id="barsWrap" hidden>
      <div class="barsHead" id="barsHead"></div>
      <svg id="bars" viewBox="0 0 500 120" role="img" aria-label="過不足の図"></svg>
      <div id="hypoBar"></div>

    <div id="board"></div>

    <div id="convOut"></div>

    <div class="actions">

      <button id="nextBtn" hidden>次の問題 →</button>
    </div>
    <div id="msg"></div>
  </section>
