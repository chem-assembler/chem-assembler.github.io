<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 開発中のため検索避け。完成・公開告知の時点で外す -->
<meta name="robots" content="noindex">
<title>反応の量的関係（比例式でみる化学計算）</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header>
  <h1>反応の量的関係</h1>
  <div class="version">v11 プロトタイプ</div>
  <a class="modeLink" href="index.html">← 比例式モード</a>
  <a class="modeLink" href="balance.html">天秤でみる平均 →</a>
</header>
<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（比例式と同じ「倍率」だけ）</summary>
      <ol>
        <li><b>係数の比が、反応する mol の比</b>。係数の行が基準になる。</li>
        <li>実際に反応した量は <b>係数 × 倍率</b>。同じ倍率がすべての物質にはたらく。</li>
        <li>過不足は<b>倍率の比べっこ</b>。<b>mol ÷ 係数</b>が一番小さいところで反応は止まる。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <div id="eqBox"></div>

    <div id="convIn"></div>

    <div id="barsWrap" hidden>
      <div class="barsHead">どこまで進めるか（<b>mol ÷ 係数</b>）を比べる</div>
      <svg id="bars" viewBox="0 0 500 120" role="img" aria-label="過不足の図"></svg>
      <div id="limitBar"></div>
    </div>

    <div id="board"></div>

    <div id="convOut"></div>

    <div class="actions">
      <button id="checkBtn">たしかめる</button>
      <button id="nextBtn" hidden>次の問題 →</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script src="model.js?v=11"></script>
<script src="stoich.js?v=11"></script>
</body>
</html>
