<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>比例式でみる化学計算 回帰テスト</title>
<style>
body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; margin: 20px; background: #f7f9fb; }
h1 { font-size: 18px; }
.version { color: #888; font-size: 12px; }
h2.pass, #total.pass { color: #2e8b57; }
h2.fail, #total.fail { color: #c0392b; }
#total { font-size: 20px; }
.case { padding: 3px 0; }
.case.pass { color: #2e8b57; }
.case.fail { color: #c0392b; font-weight: bold; }
h3 { margin-top: 24px; color: #666; }
iframe { width: 720px; max-width: 100%; height: 620px; border: 1px solid #ccc; background: #fff; }
</style>
<!-- 回帰テストは実際に問題を解くので、進捗（localStorage）を書き換えてしまう。
     逆に、残っている進捗があると「この段階ではクリアにならない」などが落ちる。
     **iframe が読み込まれる前**に控えを取って消す必要があるので、ここでやる。
     戻すのは tests.js の finish()（restoreProgress）。 -->
<script src="progress.js?v=29"></script>
<script>
(function () {
  var P = window.ChemRatioProgress;
  window.__prgBackup = {};
  P.MODES.forEach(function (m) {
    try {
      window.__prgBackup[m] = localStorage.getItem(P.key(m));
      localStorage.removeItem(P.key(m));
    } catch (e) {
      window.__prgBackup[m] = null;
    }
  });
})();
</script>
</head>
<body>
<h1>比例式でみる化学計算 回帰テスト <span class="version">v29</span></h1>
<h2 id="total">実行中…</h2>
<div id="results"></div>
<div id="uiresults"></div>
<h3>入口（モード選択）</h3>
<iframe id="appPortal" src="index.html?v=29"></iframe>
<h3>テスト対象アプリ（iframe・UIテストが操作する）</h3>
<iframe id="app" src="proportion.html?v=29"></iframe>
<h3>天秤モード（iframe・UIテストが操作する）</h3>
<iframe id="appBalance" src="balance.html?v=29"></iframe>
<h3>反応の量的関係モード（iframe・UIテストが操作する）</h3>
<iframe id="appStoich" src="stoich.html?v=29"></iframe>
<h3>中和滴定モード（iframe・UIテストが操作する）</h3>
<iframe id="appTitration" src="titration.html?v=29"></iframe>
<h3>熱化学モード（iframe・UIテストが操作する）</h3>
<iframe id="appThermo" src="thermo.html?v=29"></iframe>
<h3>横断リンクで開いた量的関係（stoich.html?r=r14）</h3>
<iframe id="appLinked" src="stoich.html?v=29&amp;r=r14"></iframe>
<h3>存在しない id で開いた量的関係（stoich.html?r=nope）</h3>
<iframe id="appBadLink" src="stoich.html?v=29&amp;r=nope"></iframe>
<script src="model.js?v=29"></script>
<script src="tests.js?v=29"></script>
</body>
</html>
