<body>
<header>
  <h1>比例式で解く mol 計算</h1>
  <div class="version">v35 プロトタイプ</div>
  <div class="headLinks">
    <a class="modeLink hub" href="../index.html">🏠 化学レンズ</a>

<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（ルールは1つだけ）</summary>
      <ol>
        <li><b>たての列には同じ種類の量</b>を置く。g は g と、mol は mol と比べる。</li>
        <li>上の行が<b>基準</b>（1 mol あたり）、下の行が<b>知りたい量</b>。</li>
        <li><b>倍率が同じ</b>ところを探す。<b>たて</b>（行→行）でも<b>よこ</b>（列→列）でもよく、
            楽なほうを選べばよい。倍率が分かればかけ算1回で終わる。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <div id="orientBar"></div>
    <div id="board"></div>
    <div id="eqLine"></div>

    <div class="actions">
      <button id="checkBtn">たしかめる</button>
      <button id="nextBtn" hidden>次の問題 →</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
