<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 開発中のため検索避け。完成・公開告知の時点で外す -->
<meta name="robots" content="noindex">
<title>天秤でみる平均（比例式でみる化学計算）</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header>
  <h1>天秤でみる平均</h1>
  <div class="version">v9 プロトタイプ</div>
  <a class="modeLink" href="index.html">← 比例式モード</a>
</header>
<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（ルールは1つだけ）</summary>
      <ol>
        <li>平均は、軽いほうと重いほうの<b>あいだ</b>に必ず来る。</li>
        <li><b>多いほうに支点が寄る</b>。同じ数なら真ん中。</li>
        <li><b>腕の長さの比は、個数の比の逆</b>。腕が短いほうが多い。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <div id="divBar"></div>
    <svg id="beam" viewBox="0 0 500 210" role="img" aria-label="天秤の図"></svg>
    <div id="pickNote"></div>

    <div id="answerArea"></div>

    <div class="actions">
      <button id="checkBtn">たしかめる</button>
      <button id="nextBtn" hidden>次の問題 →</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script src="model.js?v=9"></script>
<script src="balance.js?v=9"></script>
</body>
</html>
