<!-- 自分の端末と開発用の駆動を計測から外す。
     (1) 各端末で一度だけ ?slz_internal=1 を付けて開くと印が残り、**IP が変わっても以後ずっと対象外**。
         IP での内部トラフィック除外は、リレーだと出口が変わり携帯回線だと他人と共有するため
         この環境では成立しなかった（2026-08-10）。解除は localStorage の slz_internal を消す
     (2) test.html / audit.html / devices.html の iframe に埋め込まれているときも止める。
         **回帰テストがキーイベントまで GA4 へ送っていた**（(direct) に古い版つきの URL が実データとして
         記録されていた）。iframe の src を1つずつ直す手もあるが、tests.js が動的に作る iframe が
         20か所以上あって取りこぼす。**読み込まれた側で気づく**ほうが確実。
         top が別オリジンなら参照で例外になるので、外部サイトへの正当な埋め込みは止めない -->
<script>try{var _i=localStorage.getItem('slz_internal')||location.search.indexOf('slz_internal')>-1;if(_i&&location.search.indexOf('slz_internal')>-1)localStorage.setItem('slz_internal','1');if(!_i&&window.top!==window.self){try{_i=/\/(test|audit|devices)\.html$/.test(window.top.location.pathname);}catch(e){}}if(_i)window['ga-disable-G-403BPCLQ0D']=true;}catch(e){}</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-403BPCLQ0D"></script>

  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-403BPCLQ0D');
</script>

<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（数えるのは粒ではなく H⁺）</summary>
      <ol>
        <li><b>H⁺ と OH⁻ が結びついて消える</b>。同じ数になったところが中和点。</li>
        <li>出せる数は <b>価数 × 物質量</b>。H<sub>2</sub>SO<sub>4</sub> は1粒から
            H⁺ を<b>2個</b>出すので、同じ mol でもブロックは2倍の長さになる。</li>
        <li>物質量は <b>濃度 × 体積</b>。<b>体積は mL なので 1000 で割る</b>。</li>
        <li>強い酸か弱い酸かは<b>関係ない</b>。出せる H⁺ の数だけで決まる。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <div class="barsHead">H⁺ と OH⁻ の数をつり合わせる</div>
    <svg id="blocks" viewBox="0 0 500 150" role="img" aria-label="中和のつり合いの図"></svg>

    <div id="equivRow"></div>
    <div id="answerArea"></div>

    <div class="actions">
      <button id="checkBtn">たしかめる</button>
      <button id="nextBtn" hidden>次の問題 →</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
