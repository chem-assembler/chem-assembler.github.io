<main>
  <section id="pane">
    <details class="howto" open>
      <summary>❓ 考え方（高さの差を読むだけ）</summary>
      <ol>
        <li>物質のもつエネルギーを<b>高さ</b>として図に置く。</li>
        <li><b>ΔH ＝（到達点の高さ）−（出発点の高さ）</b>。
            下がれば −（発熱）、上がれば ＋（吸熱）。</li>
        <li><b>逆向きにたどると符号が反転する</b>。</li>
        <li><b>どの経路を通っても高さの差は同じ</b>（ヘスの法則）。
            だから直接測れない反応熱も、回り道から求められる。</li>
      </ol>
    </details>

    <nav id="stageNav" aria-label="問題を選ぶ"></nav>

    <div id="qTitle"></div>
    <div id="qHint"></div>

    <div id="givenBox"></div>
    <svg id="chart" viewBox="0 0 500 210" role="img" aria-label="エネルギー図"></svg>

    <div id="levelRows"></div>
    <div id="answerArea"></div>

    <div class="actions">
