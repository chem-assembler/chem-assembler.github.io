<title>イオンでみる化学反応式 - 電池と電気分解</title>
<link rel="stylesheet" href="style.css?v=165">

<body>
<header>
  <!-- data-short は「狭い縦画面でだけ使う短い呼び名」。札が題名の行から溢れて
       ヘッダーが1段太るのを防ぐ（style.css の「モード名の札を短い呼び名に差し替える」）。
       redox / condition と同じ3段構成にそろえてあるので、ヘッダーの高さも同じ -->

  <h1>イオンでみる化学反応式 <span class="modeTag" data-short="電池">電池と電気分解</span></h1>
  <div class="version">v165</div>
  <div class="stageBar">
    <span class="navCount" aria-hidden="true" hidden></span>
    <div class="hscroll"><nav id="stageNav" class="strip" aria-label="ステージを選ぶ"></nav></div>
  </div>
  <div class="hscroll"><nav class="modeBar strip">
    <a class="modeLink hub" href="../index.html">🏠 化学レンズ</a>
    <a class="modeLink" href="redox.html">← 酸化還元モード</a>
  </nav></div>
</header>
<main class="timelineMain">
  <div id="stageTitle"></div>
  <!-- 手で解く順番をそのまま上から下へ並べる（redox / condition と同じ縦スクロール式）。
       DESIGN_battery_electrolysis.md §2 の学習ループの順:
         ① どちらが溶けるか予想 → ② つないでみる（発見）→ ③ 倍率合わせ → ④ 足し合わせ
       **半反応式を先に見せない**のがこのモードの肝。段1で式を出すと
       「負極 Zn → Zn²⁺ ＋ 2e⁻」が答えそのものになり、予想する意味が消える -->
  <div id="timeline">
    <section class="step" id="stepPredict">
      <div class="stepHead"><span class="stepNo">1</span><span id="predictHead">どちらの板が溶ける？ — 板をタップして予想しよう</span></div>
      <!-- 電極パレット（b2 の「電極を選ぶ」課題でだけ出る）。
           どちらが負極かはデータではなく negativeOf が決めるので、ここは金属を選ぶだけ -->
      <div id="palette" hidden></div>
      <div id="discovery" hidden></div>
      <!-- 上端を −14 から始めるのは、導線のいちばん上に置く「電流」の札が
           y=0 で切れていたため（第5歩で発見）。図そのものの座標は変えていない -->
      <svg id="cell" viewBox="0 -14 480 354" role="img" aria-label="2枚の金属板を電解液にひたし、導線でつないだ電池の図"></svg>
      <div id="predictMsg"></div>
      <div id="toolbar"></div>
      <div id="ionCounts"></div>
      <div id="msg"></div>
    </section>

    <section class="step" id="stepHalves" hidden>
      <div class="stepHead"><span class="stepNo">2</span>両極の半反応式 — 式はこのまま。倍率だけ決める</div>
      <div class="sheetScroll"><div id="halfSheet"></div></div>
      <div id="eTally"></div>
    </section>

    <section class="step" id="stepSum" hidden>
      <div class="sheetScroll"><div id="calcSheet"></div></div>
    </section>

    <div id="clearBanner" hidden></div>
  </div>
</main>

</body>
</html>
