<!-- 自分の端末と開発用の駆動を計測から外す。
     (1) **localhost / 127.0.0.1 / *.local / file:// は無条件で止める**。ここが一番の穴だった:
         GA4 の (direct) 1,394 セッションのうち **1,366（98%）がホスト名 localhost** ＝ ボットではなく
         自分たちの回帰テストと開発だった（2026-08-12 に判明）。(2) の印は localStorage ＝
         **オリジンごと**なので、本番で押しても localhost 側には一切効かない。だから印より先に見る
     (2) 各端末で一度だけ ?slz_internal=1 を付けて開くと印が残り、**IP が変わっても以後ずっと対象外**。
         IP での内部トラフィック除外は、リレーだと出口が変わり携帯回線だと他人と共有するため
         この環境では成立しなかった（2026-08-10）。解除は localStorage の slz_internal を消す
     (3) test.html / audit.html / devices.html の iframe に埋め込まれているときも止める。
         **回帰テストがキーイベントまで GA4 へ送っていた**（(direct) に古い版つきの URL が実データとして
         記録されていた）。iframe の src を1つずつ直す手もあるが、tests.js が動的に作る iframe が
         20か所以上あって取りこぼす。**読み込まれた側で気づく**ほうが確実。
         top が別オリジンなら参照で例外になるので、外部サイトへの正当な埋め込みは止めない -->
<script>try{var _h=location.hostname,_p=location.search.indexOf('slz_internal')>-1,_i=_h==='localhost'||_h==='127.0.0.1'||_h==='[::1]'||_h===''||/\.local$/.test(_h);if(_p){try{localStorage.setItem('slz_internal','1');}catch(e){}}if(!_i){try{_i=_p||!!localStorage.getItem('slz_internal');}catch(e){_i=_p;}}if(!_i&&window.top!==window.self){try{_i=/\/(test|audit|devices)\.html$/.test(window.top.location.pathname);}catch(e){}}if(_i)window['ga-disable-G-403BPCLQ0D']=true;}catch(e){}</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- AI 学習・生成への利用を拒否する意思表示（ルートの robots.txt と対） -->
<meta name="robots" content="noai, noimageai">
<title>イオンでみる化学反応式 - 電気分解</title>
<link rel="stylesheet" href="style.css?v=212">
</head>
<!-- どちらのモードのページかを名乗る（DESIGN_battery_electrolysis.md §8-1）。
     cell.js はこれだけを見てステージ表を絞る。電池は battery.html のほう。
     描画・アニメ・倍率合わせは cell.js が共通で持ち、このページだけの段（何が反応するか）が
     electrolysis.js。「物理は同じで名前だけが違う」を2本のコードに写さないための作り。 -->
<body data-cell-kind="electrolysis">
<header>
  <!-- data-short は「狭い縦画面でだけ使う短い呼び名」。札が題名の行から溢れて
       ヘッダーが1段太るのを防ぐ（style.css の「モード名の札を短い呼び名に差し替える」）。
       redox / condition と同じ3段構成にそろえてあるので、ヘッダーの高さも同じ -->

  <h1>イオンでみる化学反応式 <span class="modeTag" data-short="電気分解">電気分解をする</span></h1>
  <div class="version">v212</div>
  <div class="stageBar">
    <span class="navCount" aria-hidden="true" hidden></span>
    <div class="hscroll"><nav id="stageNav" class="strip" aria-label="ステージを選ぶ"></nav></div>
  </div>
  <div class="hscroll"><nav class="modeBar strip" data-mode="elyz"></nav></div>
</header>
<main class="timelineMain">
  <div id="stageTitle"></div>
  <!-- 電気分解は「まず、何が反応するか」から始める（DESIGN_battery_electrolysis.md §9）。
       **電極に来たイオンが、そのまま反応するとはかぎらない**——Na⁺ は析出せず水が還元され、
       SO₄²⁻ は酸化されず水が酸化される。ここが最初の関門なので、図より前に置き、
       答えるまで下の段を出さない（式を先に見せると、それが答えそのものになる）。
         ① 何が反応する？ → ② 電源につなぐ → ③ 倍率合わせ → ④ 足し合わせ
       電池（battery.html）は①が無く、代わりに「どちらの板が溶けるか」の予想が入る -->
  <div id="timeline">
    <section class="step" id="stepWhat">
      <div class="stepHead"><span class="stepNo">1</span>まず、何が反応する？ — 両極で e⁻ をやりとりする相手を選ぶ</div>
      <!-- 液に溶けているイオンと、**必ずそこにいる水**を並べる区画。中身は electrolysis.js が作る -->
      <div id="whatLead"></div>
      <div id="whatPick"></div>
      <!-- 選んだあとの判定と、▸ で開く順位表。**順位は暗記させず、選んでから確かめる** -->
      <div id="whatWhy"></div>
    </section>

    <section class="step" id="stepPredict">
      <div class="stepHead"><span class="stepNo">2</span><span id="predictHead">電源につなぐと、両極で何が起きる？</span></div>
      <!-- 電極パレットと「発見」の帯は電池だけのもの。ここでは cell.js が常に隠す
           （電気分解では電極を選ばせない・§3-3）が、DOM の形は battery.html とそろえておく -->
      <div id="palette" hidden></div>
      <div id="discovery" hidden></div>
      <svg id="cell" viewBox="0 -14 480 368" role="img" aria-label="電源につないだ2本の電極を、電解液にひたした電気分解の図"></svg>
      <div id="predictMsg"></div>
      <div id="toolbar"></div>
      <div id="ionCounts"></div>
      <div id="msg"></div>
    </section>

    <section class="step" id="stepHalves" hidden>
      <div class="stepHead"><span class="stepNo">3</span>両極の半反応式 — 式はこのまま。倍率だけ決める</div>
      <div class="sheetScroll"><div id="halfSheet"></div></div>
      <div id="eTally"></div>
      <div id="sumBar"></div>
    </section>

    <section class="step" id="stepSum" hidden>
      <!-- 段の番号はページが決める（cell.js は data-step-no を読むだけ）。
           電池は段が3つなので 3、電気分解は「何が反応するか」がある ぶん 4 -->
      <div class="sheetScroll"><div id="calcSheet" data-step-no="4"></div></div>
    </section>

    <div id="clearBanner" hidden></div>
  </div>
</main>
<footer class="pageFoot"><a href="../privacy.html">プライバシーポリシー</a></footer>
<script src="model.js?v=212"></script>
<script src="schematic.js?v=212"></script>
<script src="header-ui.js?v=212"></script>
<script src="cell.js?v=212"></script>
<script src="electrolysis.js?v=212"></script>
</body>
</html>
