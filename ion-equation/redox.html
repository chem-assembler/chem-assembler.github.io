<html lang="ja">

<!-- Google tag (gtag.js) — SchoolLenz 共通。媒体別の流入を測る（SNS_PLAN.md の KPI） -->
<!-- 自分の端末と開発用の駆動を計測から外す。
     (1) **localhost / 127.0.0.1 / *.local / file:// は無条件で止める**。ここが一番の穴だった:
         GA4 の (direct) 1,394 セッションのうち **1,366（98%）がホスト名 localhost** ＝ ボットではなく
         自分たちの回帰テストと開発だった（2026-08-12 に判明）。(2) の印は localStorage ＝
         **オリジンごと**なので、本番で押しても localhost 側には一切効かない。だから印より先に見る
     (2) 各端末で一度だけ ?slz_internal=1 を付けて開くと印が残り、**IP が変わっても以後ずっと対象外**。
         IP での内部トラフィック除外は、リレーだと出口が変わり携帯回線だと他人と共有するため
         この環境では成立しなかった（2026-08-10）。解除は localStorage の slz_internal を消す
     (3) test.html / audit.html / devices.html の iframe に埋め込まれているときも止める。
         **回帰テストがキーイベントまで GA4 へ送っていた**（(direct) に古い版つきの URL が実データとして
         記録されていた）。iframe の src を1つずつ直す手もあるが、tests.js が動的に作る iframe が
         20か所以上あって取りこぼす。**読み込まれた側で気づく**ほうが確実。
         top が別オリジンなら参照で例外になるので、外部サイトへの正当な埋め込みは止めない -->
<script>try{var _h=location.hostname,_p=location.search.indexOf('slz_internal')>-1,_i=_h==='localhost'||_h==='127.0.0.1'||_h==='[::1]'||_h===''||/\.local$/.test(_h);if(_p){try{localStorage.setItem('slz_internal','1');}catch(e){}}if(!_i){try{_i=_p||!!localStorage.getItem('slz_internal');}catch(e){_i=_p;}}if(!_i&&window.top!==window.self){try{_i=/\/(test|audit|devices)\.html$/.test(window.top.location.pathname);}catch(e){}}if(_i)window['ga-disable-G-403BPCLQ0D']=true;}catch(e){}</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-403BPCLQ0D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-403BPCLQ0D');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- AI 学習・生成への利用を拒否する意思表示（ルートの robots.txt と対） -->
<meta name="robots" content="noai, noimageai">
<title>イオンでみる化学反応式 - 酸化還元</title>
<link rel="stylesheet" href="style.css?v=179">
</head>
<body>
<header>
  <!-- data-short は「狭い縦画面でだけ使う短い呼び名」。札が題名の行から溢れて
       ヘッダーが1段太るのを防ぐ（style.css の「モード名の札を短い呼び名に差し替える」） -->
  <h1>イオンでみる化学反応式 <span class="modeTag" data-short="酸化還元">酸化還元（半反応式）</span></h1>
  <div class="version">v179</div>
  <div class="stageBar">
    <span class="navCount" aria-hidden="true" hidden></span>
    <div class="hscroll"><nav id="stageNav" class="strip" aria-label="ステージを選ぶ"></nav></div>
  </div>
  <div class="hscroll"><nav class="modeBar strip" data-mode="redox"></nav></div>
</header>
<main class="timelineMain">
  <div id="stageTitle"></div>
  <!-- 手で解く順番をそのまま上から下へ並べる。前の段が片づくと次の段が下に現れ、
       上にスクロールすればいつでも最初から振り返れる（縦スクロール式タイムライン） -->
  <div id="timeline">
    <!-- 自由組み立てモード（redox.html?free=1）だけに出る段0。
         ヨードホルムの #stepCleave と同じ「条件つきで現れる段0」の言い回しに乗せる。
         **ヘッダーには何も足さない**（DESIGN_redox_matching.md §4-1）ので、
         ピッカーは必ず <main> の中に置く。320px では3つの区画を縦に積む（§4-2）。 -->
    <section class="step" id="stepPick" hidden>
      <div class="stepHead"><span class="stepNo">0</span>反応させる相手を選ぶ — 組み合わせて、反応するかどうかを確かめる</div>
      <div class="pickGrid">
        <div class="pickRow">
          <label class="pickLabel" for="pickOx">e⁻ を受け取る側（酸化剤）</label>
          <select id="pickOx"></select>
          <div class="pickNote" id="pickOxNote"></div>
        </div>
        <div class="pickRow">
          <label class="pickLabel" for="pickRed">e⁻ を出す側（還元剤）</label>
          <select id="pickRed"></select>
          <div class="pickNote" id="pickRedNote"></div>
        </div>
        <!-- 液性（M6-D）。選べるようにしたので、選択肢を出す（§9-4）。
             中性・塩基性を選んでも「反応しない」とは言わない ＝ 式が変わる（§2-4）。
             ラジオは 320px でも縦積みで収まり、タップ標的は 40px 以上（style.css） -->
        <div class="pickRow">
          <span class="pickLabel">液性</span>
          <div class="condChoice" id="pickCond" role="radiogroup" aria-label="液性を選ぶ">
            <label class="condOpt"><input type="radio" name="pickCondition" value="acid" checked><span class="dot" aria-hidden="true"></span><span>硫酸酸性</span></label>
            <label class="condOpt"><input type="radio" name="pickCondition" value="basic"><span class="dot" aria-hidden="true"></span><span>中性・塩基性</span></label>
          </div>
          <div class="pickNote" id="pickCondNote"></div>
        </div>
      </div>
      <div class="pickActions"><button id="pickGo" class="react" type="button">⚡ この組み合わせで試す</button></div>
      <div id="pickMsg"></div>
      <!-- 収録ステージへの橋（M6-E・DESIGN_redox_matching.md §3-3）。
           選んだ組み合わせと同じ (ox, red) を持つステージが REDOX_STAGES にあれば、
           解説つきのそちらへ渡す。中身は実行時の走査で作るので、ここは器だけ -->
      <div id="pickBridge" hidden></div>
      <div id="pickWhy" hidden></div>
    </section>

    <!-- ヨードホルム反応のように、半反応式の前に「切り離す」段がある反応だけ出る -->
    <section class="step" id="stepCleave" hidden>
      <div class="stepHead"><span class="stepNo">0</span>まずメチル基を切り離す — ここは酸化還元ではない</div>
      <div class="sheetScroll"><div id="cleaveSheet"></div></div>
      <div id="cleaveMsg"></div>
    </section>

    <section class="step" id="step1">
      <div class="stepHead"><span class="stepNo">1</span>半反応式 — 部品はこの2本（式はこのまま。倍率だけ決める）</div>
      <div class="sheetScroll"><div id="halfSheet"></div></div>
    </section>

    <section class="step" id="step2">
      <div class="stepHead"><span class="stepNo">2</span>e⁻ の数を合わせる — 出す数と受け取る数がそろうまで</div>
      <div id="toolbar"></div>
      <div class="labRow">
        <div class="labCol">
          <svg id="beaker" viewBox="0 0 480 430" role="img" aria-label="金属板と溶液中のイオン"></svg>
          <div id="ionCounts"></div>
        </div>
        <div class="labCol">
          <div id="schematicWrap">
            <div class="schematicHead" id="schematicHead">e⁻ の受け渡し（模式図）</div>
            <svg id="schematic" viewBox="0 0 460 150" role="img" aria-label="還元剤が出す e⁻ と酸化剤が受け取る e⁻ のブロック模式図"></svg>
            <div id="schematicAdd"></div>
            <div id="schematicMsg"></div>
          </div>
          <div id="acidSourceWrap" hidden>
            <div class="schematicHead">この H⁺ は誰が出す？</div>
            <svg id="acidSource" viewBox="0 0 460 150" role="img" aria-label="必要な H⁺ が、用意した硝酸のどこから来るのかを示す図"></svg>
            <div id="acidSourceMsg"></div>
          </div>
          <div id="eTally"></div>
        </div>
      </div>
      <div id="msg"></div>
    </section>

    <!-- ③〜⑤ は1枚の筆算。→ の位置がそろうよう同じグリッドに置き、段ごとに現れる -->
    <section class="step" id="stepCalc" hidden>
      <div class="sheetScroll"><div id="calcSheet"></div></div>
    </section>

    <div id="clearBanner" hidden></div>
  </div>
</main>
<footer class="pageFoot"><a href="../privacy.html">プライバシーポリシー</a></footer>
<script src="model.js?v=179"></script>
<script src="schematic.js?v=179"></script>
<script src="header-ui.js?v=179"></script>
<script src="redox.js?v=179"></script>
</body>
</html>
