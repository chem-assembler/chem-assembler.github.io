<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イオンでみる化学反応式 - 酸化還元</title>
<link rel="stylesheet" href="style.css?v=99">
</head>
<body>
<header>
  <h1>イオンでみる化学反応式 <span class="modeTag">酸化還元（半反応式）</span></h1>
  <div class="version">v99</div>
  <nav id="stageNav"></nav>
  <a class="modeLink" href="index.html">← イオン反応モード</a>
</header>
<main>
  <section id="labPane">
    <div id="stageTitle"></div>
    <div id="toolbar"></div>
    <svg id="beaker" viewBox="0 0 480 430" role="img" aria-label="金属板と溶液中のイオン"></svg>
    <div id="ionCounts"></div>
    <div id="msg"></div>
  </section>
  <section id="eqPane">
    <h2>筆算で組み立てよう（半反応式 → イオン反応式 → 化学反応式）</h2>
    <div id="sheetScroll">
      <div id="calcSheet"></div>
    </div>
    <div id="schematicWrap">
      <div class="schematicHead" id="schematicHead">e⁻ の受け渡し（模式図）</div>
      <svg id="schematic" viewBox="0 0 460 150" role="img" aria-label="還元剤が出す e⁻ と酸化剤が受け取る e⁻ のブロック模式図"></svg>
      <div id="schematicAdd"></div>
      <div id="schematicMsg"></div>
    </div>
    <div id="clearBanner" hidden></div>
  </section>
</main>
<script src="model.js?v=99"></script>
<script src="schematic.js?v=99"></script>
<script src="redox.js?v=99"></script>
</body>
</html>
