<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イオンでみる化学反応式 - 酸化還元</title>
<link rel="stylesheet" href="style.css?v=122">
</head>
<body>
<header>
  <h1>イオンでみる化学反応式 <span class="modeTag">酸化還元（半反応式）</span></h1>
  <div class="version">v122</div>
  <div class="stageBar">
    <span class="navCount" aria-hidden="true" hidden></span>
    <div class="hscroll"><nav id="stageNav" class="strip" aria-label="ステージを選ぶ"></nav></div>
  </div>
  <div class="hscroll"><nav class="modeBar strip">
    <a class="modeLink" href="portal.html">☰ 単元から入る</a>
    <a class="modeLink" href="index.html">← イオン反応モード</a>
    <a class="modeLink" href="condition.html">液性で書き換える →</a>
  </nav></div>
</header>
<main class="timelineMain">
  <div id="stageTitle"></div>
  <!-- 手で解く順番をそのまま上から下へ並べる。前の段が片づくと次の段が下に現れ、
       上にスクロールすればいつでも最初から振り返れる（縦スクロール式タイムライン） -->
  <div id="timeline">
    <!-- ヨードホルム反応のように、半反応式の前に「切り離す」段がある反応だけ出る -->
    <section class="step" id="stepCleave" hidden>
      <div class="stepHead"><span class="stepNo">0</span>まずメチル基を切り離す — ここは酸化還元ではない</div>
      <div class="sheetScroll"><div id="cleaveSheet"></div></div>
      <div id="cleaveMsg"></div>
    </section>

    <section class="step" id="step1">
      <div class="stepHead"><span class="stepNo">1</span>半反応式 — 部品はこの2本（式はこのまま。倍率だけ決める）</div>
      <div class="sheetScroll"><div id="halfSheet"></div></div>
    </section>

    <section class="step" id="step2">
      <div class="stepHead"><span class="stepNo">2</span>e⁻ の数を合わせる — 出す数と受け取る数がそろうまで</div>
      <div id="toolbar"></div>
      <div class="labRow">
        <div class="labCol">
          <svg id="beaker" viewBox="0 0 480 430" role="img" aria-label="金属板と溶液中のイオン"></svg>
          <div id="ionCounts"></div>
        </div>
        <div class="labCol">
          <div id="schematicWrap">
            <div class="schematicHead" id="schematicHead">e⁻ の受け渡し（模式図）</div>
            <svg id="schematic" viewBox="0 0 460 150" role="img" aria-label="還元剤が出す e⁻ と酸化剤が受け取る e⁻ のブロック模式図"></svg>
            <div id="schematicAdd"></div>
            <div id="schematicMsg"></div>
          </div>
          <div id="acidSourceWrap" hidden>
            <div class="schematicHead">この H⁺ は誰が出す？</div>
            <svg id="acidSource" viewBox="0 0 460 150" role="img" aria-label="必要な H⁺ が、用意した硝酸のどこから来るのかを示す図"></svg>
            <div id="acidSourceMsg"></div>
          </div>
          <div id="eTally"></div>
        </div>
      </div>
      <div id="msg"></div>
    </section>

    <!-- ③〜⑤ は1枚の筆算。→ の位置がそろうよう同じグリッドに置き、段ごとに現れる -->
    <section class="step" id="stepCalc" hidden>
      <div class="sheetScroll"><div id="calcSheet"></div></div>
    </section>

    <div id="clearBanner" hidden></div>
  </div>
</main>
<script src="model.js?v=122"></script>
<script src="schematic.js?v=122"></script>
<script src="header-ui.js?v=122"></script>
<script src="redox.js?v=122"></script>
</body>
</html>
