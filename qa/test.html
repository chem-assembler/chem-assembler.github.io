<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- AI 学習・生成への利用を拒否する意思表示（ルートの robots.txt と対） -->
<meta name="robots" content="noai, noimageai">
<title>一問一答 回帰テスト</title>
<style>
body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; margin: 20px; background: #f7f9fb; }
h1 { font-size: 18px; }
.version { color: #888; font-size: 12px; }
#total { font-size: 20px; }
#total.pass { color: #2e8b57; }
#total.fail { color: #c0392b; }
h3 { margin-top: 24px; color: #666; font-size: 14px; }
.case { padding: 3px 0; font-size: 13px; }
.case.pass { color: #2e8b57; }
.case.fail { color: #c0392b; font-weight: bold; }
.case .err { color: #c0392b; font-weight: normal; display: block; margin-left: 1.4em; white-space: pre-wrap; }
iframe { width: 960px; max-width: 100%; height: 640px; border: 1px solid #ccc; background: #fff; }
</style>
</head>
<body>
<h1>一問一答（qa）回帰テスト <span class="version">v91</span></h1>
<h2 id="total">実行中…</h2>
<div id="results"></div>

<h3>テスト対象アプリ（iframe・UIテストが操作する）</h3>
<iframe id="app" src="index.html?v=91"></iframe>

<script src="tests.js?v=91"></script>
<script>
(function () {
  var out = document.getElementById('results');
  var total = document.getElementById('total');
  var all = [];

  function section(title, results) {
    var h = document.createElement('h3');
    h.textContent = title + '（' + results.filter(function (r) { return r.ok; }).length + '/' + results.length + '）';
    out.appendChild(h);
    results.forEach(function (r) {
      var div = document.createElement('div');
      div.className = 'case ' + (r.ok ? 'pass' : 'fail');
      div.textContent = (r.ok ? '✓ ' : '✗ ') + r.name;
      if (!r.ok) {
        var e = document.createElement('span');
        e.className = 'err';
        e.textContent = r.err;
        div.appendChild(e);
      }
      out.appendChild(div);
    });
    all = all.concat(results);
  }

  // ⚠ **完了の合図に `ALL PASS` / `FAILED` を混ぜる**（2026-08-07）。
  // `tools/run-tests.mjs`（ヘッドレスの門番）は #summary の ✅❌ か #total の
  // `ALL PASS` / `FAIL` を見て完了を判定する。qa だけが日本語のまま独自の書式だったので、
  // **走らせても完了を検出できず 600 秒待って落ちる**（＝ 実質この門番が使えなかった）。
  // ratio・muki は同じ理由で `ALL PASS (n)` を出している。人が読む日本語は残したまま足す
  function finish() {
    var ng = all.filter(function (r) { return !r.ok; }).length;
    total.textContent = ng === 0
      ? '全 ' + all.length + ' 件 合格 — ALL PASS (' + all.length + ')'
      : all.length + ' 件中 ' + ng + ' 件 失敗 — ' + ng + ' FAILED / ' + all.length;
    total.className = ng === 0 ? 'pass' : 'fail';
  }

  // ⚠ **隣のアプリのデータは必ずキャッシュを外して読む**（2026-08-06 実発生）。
  // `?v=` は自分のアプリの版に合わせる仕組みなので、**相手のファイルには効かない**。
  // バスター無しで読んでいたため、assembler が stages.json に id を振ったあとも
  // **id が1つも無い古い実体**が配られ、「ID がライブラリに無い」という嘘の失敗が出た
  // （逆に、相手が消したものを「まだある」と嘘の合格にすることもありうる ＝ こちらが危ない）。
  // テストページは毎回いまのファイルを見るのが正しいので、読み込みごとに変わる鍵を付ける。
  var FRESH = '?nocache=' + Date.now();

  // データと版のテスト → アプリの読み込みを待って UI テスト
  Promise.all([
    fetch('questions.json?v=91').then(function (r) { return r.json(); }),
    fetch('index.html?v=91').then(function (r) { return r.text(); }),
    fetch('app.js?v=91').then(function (r) { return r.text(); }),
    // 隣のアプリのデータ（飛び道具の指す先が実在するかを実データで検査するため）
    fetch('../assembler/compounds.json' + FRESH).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
    fetch('../assembler/stages.json' + FRESH).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    // 棚卸し表（283項目に「何を見せるか」を決めた正の表。JSONL なので1行ずつ読む）
    fetch('data/assembler_links.jsonl?v=91').then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (txt) {
        return txt.split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (l) { return JSON.parse(l); });
      }).catch(function () { return []; }),
    // assembler の反応の在庫（増えたら「見直し候補」を拾い直す合図になる）
    fetch('../assembler/reactor.js' + FRESH).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
    // assembler のクイズの語彙（出題範囲のレベルと分野の名前）。
    // 棚卸しの `scope` / `field` は**向こうの語彙**なので、綴りが合っているかを実データで見る
    // （合っていないと assembler は黙って無視する ＝ 分野を問わないに戻るだけで、誰も気づかない）
    fetch('../assembler/quiz.js' + FRESH).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
    fetch('../assembler/reactions.json' + FRESH).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    // 出題実績（入試問題の解析レーンが生成する外部の資産。無くても本体は動くが、あるなら検査する）
    fetch('data/exam_usage.jsonl' + FRESH).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
    // 確度の一覧（qa/tools/gen_certainty_ledger.js が questions.json から生成する写し）。
    // 手で書けるファイルではないので、ずれていないかをここで見る
    fetch('CERTAINTY_LEDGER.md' + FRESH).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
    // assembler の絞り込みモードのタブ名（`.nw-mode-tab[data-panel]`）。
    // 棚卸しの `panel` は**向こうの語彙**で、綴りが違っても assembler は黙って既定のタブを
    // 開く（受け口⑦は DOM に聞いて、無ければ何もしない）＝ 画面では気づけない壊れ方。
    // ⚠ **末尾に足す**（途中に挟むと下の res[N] が全部1つずれる）
    fetch('../assembler/index.html' + FRESH).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; })
  ]).then(function (res) {
    var DATA = res[0], indexHtml = res[1], appJs = res[2], COMPOUNDS = res[3], STAGES = res[4], LINKS = res[5];
    var REACTOR_JS = res[6], QUIZ_JS = res[7], REACTIONS = res[8], USAGE_TEXT = res[9], LEDGER = res[10];
    var ASM_HTML = res[11];
    section('データ（questions.json の構造と作問規約）', runDataTests(DATA));
    section('版の同期（キャッシュ事故の防止）', runVersionTests(indexHtml, appJs));
    section('飛び道具の指す先（assembler のライブラリと突き合わせ）', runLinkTargetTests(DATA, COMPOUNDS, STAGES));
    section('棚卸し表（283項目に何を見せるか・配信データとの一致）',
      runInventoryTests(DATA, LINKS, COMPOUNDS, STAGES, REACTOR_JS, REACTIONS, QUIZ_JS, ASM_HTML));
    section('出題実績（どの大学でどう問われたか・著作権の門番）', runUsageTests(DATA, USAGE_TEXT));
    section('確度の一覧（CERTAINTY_LEDGER.md との一致）', runLedgerTests(DATA, LEDGER));

    var frame = document.getElementById('app');
    function whenReady(cb) {
      var tries = 0;
      (function poll() {
        var d = frame.contentDocument;
        var list = d && d.getElementById('unit-list');
        if (list && list.children.length > 0) return cb();
        if (++tries > 100) return cb();   // 諦めて実行し、UIテスト側で落とす
        setTimeout(poll, 100);
      })();
    }
    whenReady(function () {
      runUiTests(document, DATA).then(function (ui) {
        section('UI（実アプリを iframe で操作）', ui);
        finish();
      });
    });
  }).catch(function (e) {
    section('起動', [{ name: 'テストの読み込み', ok: false, err: String(e) }]);
    finish();
  });
})();
</script>
</body>
</html>
