<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!-- YouTube 動画透かし用（150x150・背景透過）。動画右下に小さく重なるため
       シンプルなレンズマークのみ・視認性重視でやや明るめ -->
  <defs>
    <linearGradient id="irid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2cd0c8"/>
      <stop offset="100%" stop-color="#8c88ff"/>
    </linearGradient>
  </defs>
  <circle cx="66" cy="66" r="38" fill="#0a1013" opacity="0.35"/>
  <circle cx="55" cy="59" r="11" fill="#2cd0c8"/>
  <circle cx="78" cy="76" r="8" fill="#8c88ff"/>
  <circle cx="66" cy="66" r="38" fill="none" stroke="url(#irid)" stroke-width="11"/>
  <line x1="94" y1="94" x2="120" y2="120" stroke="url(#irid)" stroke-width="14" stroke-linecap="round"/>
</svg>
