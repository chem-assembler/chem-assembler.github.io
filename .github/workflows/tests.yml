# 門番をローカル機の外で回す（2026-09-19・DEVELOPMENT.md「CI」の節）
#
# なぜ: assembler の全走は 15〜45 分かかり、ノートPC 1台で並行レーンが順番待ちになっていた。
# リポジトリは public なので GitHub Actions は無料・無制限。ここで回せば、
# レーンはブランチを push するだけで全走の結果を受け取れる（手元の機械は空く）。
#
# ⚠ これは「コミット前の全テスト合格」の代わりではなく、追加の網。
#    手元の run-tests.mjs と同じ道具を同じ引数で呼ぶので、結果の読み方も同じ
#    （合否の行が1行も無ければ「赤」ではなく「起動失敗」＝ DEVELOPMENT.md の同名の節）。
name: tests

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'scan/**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ブラウザ不要の検査（数秒）。落ちたらブラウザの全走を待たずに分かる
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 改行を手元（Windows）と同じ CRLF で展開する
        # リポジトリの中身は LF。手元は core.autocrlf=true で CRLF に展開しており、
        # compounds.json・requests.json は「CRLF であること」まで検査している（CLAUDE.md の規約）
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 規則5・8 は git の履歴と origin/main との差し引きを見る
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 規則8 の比較先を main にする（main 以外のブランチの push のとき）
        # 規則8は追跡先（@{u}）との差し引きで「push するコミットで版が上がっているか」を見る。
        # チェックアウトしたブランチには追跡先が無いので、そのままだと黙って飛ばされる
        if: github.ref != 'refs/heads/main'
        run: git branch -u origin/main
      - name: verify-release（版・化け・BOM・死にリンク・規則8）
        run: node tools/verify-release.js
      - name: verify-compounds（compounds.json の形・書き戻し事故）
        run: node tools/verify-compounds.js
      - name: 構文
        run: for f in assembler/*.js; do node --check "$f"; done

  browser:
    # ⚠ Windows で回す。ion-equation は Segoe UI / Yu Gothic UI を指定していて、Linux では別の字形に
    #   置き換わり「狭い画面で2行に収まる」類の検査が手元と食い違う（2026-09-19 の試走で4件）。
    #   テストの基準は手元の Windows なので、同じ OS の字幅で測る
    runs-on: windows-latest
    timeout-minutes: 90
    # ⚠ ion-equation・muki は外した。「375px で高さ N px 以内」「32px 以上」の上限が runner の字の描き方で
    #   1〜2% 超えて毎回落ちる（1913/1900px・31/32px）。毎回赤のメールが来ると本物の赤が読まれなくなる。
    #   どちらも手元なら数十秒なので、門番は手元の全走のまま
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # ★ assembler は4本に分けて並列に流す（2026-09-19・全走1本で約50分 → 1本あたり 1/4）。
        #   `--shard=i/n` は全件を**連続した区間**で切る（並びを変えない・tests.js の TF4）。
        #   4本がそろって全部通ったかは、下の shard-gate が件数の合計で確かめる。
        #   ⚠ 分ける数を変えるときは、ここの4行と shard-gate の SHARDS を一緒に変える
        include:
          - { page: assembler, shard: '1/4', key: assembler-1 }
          - { page: assembler, shard: '2/4', key: assembler-2 }
          - { page: assembler, shard: '3/4', key: assembler-3 }
          - { page: assembler, shard: '4/4', key: assembler-4 }
          - { page: qa, shard: '', key: qa }
          - { page: ratio, shard: '', key: ratio }
    steps:
      - name: 改行を手元（Windows）と同じ CRLF で展開する
        # リポジトリの中身は LF。手元は core.autocrlf=true で CRLF に展開しており、
        # compounds.json・requests.json は「CRLF であること」まで検査している（CLAUDE.md の規約）
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: playwright（tools/record のものを借りる ＝ 手元と同じ置き場所）
        working-directory: tools/record
        run: npm install --no-audit --no-fund && npx playwright install chromium
      - name: 全走（${{ matrix.key }}）
        # サーバーは同じ step の中で立てる（Windows の runner では step をまたぐ裏の処理が残る保証が無い）
        #
        # ★ 落ちたテストだけもう一度流す（DEVELOPMENT.md「RX13・ST29 … 1回落ちて再実行で通ったらゆらぎ」の手順を機械でやる）。
        #   runner は手元より遅く、assembler の全走3回で毎回ちがう1件（QUIZ_UNIFORM・REF11 …）が時間待ちで落ちた。
        #   流し直しで通れば「ゆらぎ」として警告を出して緑、流し直しでも落ちれば赤。
        #   ⚠ 合否の行が1行も無いとき（起動失敗）は流し直さずに赤（DEVELOPMENT.md「出力ゼロ・終了コード1」）
        run: |
          python -m http.server 8134 --bind 127.0.0.1 >/dev/null 2>&1 &
          URL=http://127.0.0.1:8134/${{ matrix.page }}/test.html
          for i in $(seq 1 30); do curl -sf "$URL" >/dev/null && break; sleep 1; done
          SHARD_OPT=""
          [ -n "${{ matrix.shard }}" ] && SHARD_OPT="--shard=${{ matrix.shard }}"
          set +e
          node tools/run-tests.mjs "$URL" $SHARD_OPT --report=report.json | tee full.txt
          code=${PIPESTATUS[0]}
          set -e
          # 分割実行は全部通っても終了コード 4（1本の分割は「全テスト合格」ではない ＝ 全体の合否は shard-gate）
          [ "$code" = 0 ] && exit 0
          [ -n "$SHARD_OPT" ] && [ "$code" = 4 ] && exit 0
          ids=$(sed -n '/^--- 失敗 ---$/,$p' full.txt | grep -oE '^  [A-Z_]+[0-9]*[a-z]?:' | tr -d ' :' | paste -sd, -)
          if [ -z "$ids" ] || [ "${{ matrix.page }}" != assembler ]; then exit "$code"; fi
          echo "::group::落ちたテストだけ流し直す: $ids"
          set +e
          node tools/run-tests.mjs "$URL" --only="$ids" | tee retry.txt
          rcode=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          # --only= は全部通っても終了コード 3（絞り込みの印）を返す
          if [ "$rcode" = 3 ]; then
            echo "::warning title=ゆらぎ::全走で落ちた $ids が、流し直しでは通った（時間待ちの揺れ。続けば直す）"
            exit 0
          fi
          exit 1
      - name: 分割の記録を残す（shard-gate が数える）
        if: always() && matrix.shard != ''
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.key }}
          path: report.json
          if-no-files-found: error

  shard-gate:
    # ★ assembler の4区間が**そろって**流れたかを確かめる。browser の4本がすべて緑のときだけ走る
    #   （needs の既定）。見るのは「1〜n の区間が1本ずつある・どれも全件数が同じ・件数の和が全件数」。
    #   ⚠ これが無いと、matrix の行を1つ消しただけで「一部しか流さない門番」が黙って緑になる
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-assembler-*
          path: shards
      - name: 4区間がそろい、件数の和が全件数になっているか
        env:
          SHARDS: 4
        run: |
          node -e "
          const fs=require('fs'),path=require('path');const n=Number(process.env.SHARDS);
          const reps=fs.readdirSync('shards').map(d=>JSON.parse(fs.readFileSync(path.join('shards',d,'report.json'),'utf8')));
          const bad=m=>{console.error('::error::'+m);process.exit(1)};
          if(reps.length!==n)bad('分割の記録が '+reps.length+' 本（'+n+' 本のはず）');
          const seen=new Set(reps.map(r=>r.shard&&r.shard.i));
          for(let i=1;i<=n;i++)if(!seen.has(i))bad('区間 '+i+'/'+n+' の記録が無い');
          if(reps.some(r=>!r.shard||r.shard.n!==n))bad('n の違う記録が混じっている');
          const totals=new Set(reps.map(r=>r.total));if(totals.size!==1)bad('区間ごとに全件数が違う: '+[...totals]);
          const total=reps[0].total,sum=reps.reduce((s,r)=>s+r.selected,0);
          if(sum!==total)bad('件数の和 '+sum+' が全件数 '+total+' と合わない');
          console.log('✅ assembler 全 '+total+' 件を '+n+' 区間で流した（'+reps.map(r=>r.selected).join('+')+'）');
          "
