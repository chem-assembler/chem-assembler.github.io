<!DOCTYPE html>

<head>
<!-- Google tag (gtag.js) — SchoolLenz 共通。媒体別の流入を測る（SNS_PLAN.md の KPI） -->
<!-- 自分の端末と開発用の駆動を計測から外す。
     (1) **localhost / 127.0.0.1 / *.local / file:// は無条件で止める**。ここが一番の穴だった:
         GA4 の (direct) 1,394 セッションのうち **1,366（98%）がホスト名 localhost** ＝ ボットではなく
         自分たちの回帰テストと開発だった（2026-08-12 に判明）。(2) の印は localStorage ＝
         **オリジンごと**なので、本番で押しても localhost 側には一切効かない。だから印より先に見る
     (2) 各端末で一度だけ ?slz_internal=1 を付けて開くと印が残り、**IP が変わっても以後ずっと対象外**。
         IP での内部トラフィック除外は、リレーだと出口が変わり携帯回線だと他人と共有するため
         この環境では成立しなかった（2026-08-10）。解除は localStorage の slz_internal を消す
     (3) test.html / audit.html / devices.html の iframe に埋め込まれているときも止める。
         **回帰テストがキーイベントまで GA4 へ送っていた**（(direct) に古い版つきの URL が実データとして
         記録されていた）。iframe の src を1つずつ直す手もあるが、tests.js が動的に作る iframe が
         20か所以上あって取りこぼす。**読み込まれた側で気づく**ほうが確実。
         top が別オリジンなら参照で例外になるので、外部サイトへの正当な埋め込みは止めない -->
<script>try{var _h=location.hostname,_p=location.search.indexOf('slz_internal')>-1,_i=_h==='localhost'||_h==='127.0.0.1'||_h==='[::1]'||_h===''||/\.local$/.test(_h);if(_p){try{localStorage.setItem('slz_internal','1');}catch(e){}}if(!_i){try{_i=_p||!!localStorage.getItem('slz_internal');}catch(e){_i=_p;}}if(!_i&&window.top!==window.self){try{_i=/\/(test|audit|devices)\.html$/.test(window.top.location.pathname);}catch(e){}}if(_i)window['ga-disable-G-403BPCLQ0D']=true;}catch(e){}</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-403BPCLQ0D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-403BPCLQ0D');
</script>

<link rel="canonical" href="https://chem.schoollenz.com/shape/">
<link rel="stylesheet" href="style.css?v=2">
<!-- 参考書のページに埋め込まれたとき（?embed=1）の1つめ（DESIGN_reference_centric.md §2-4 (2) ①・ion-equation と同じ1行）。
     ⚠ head の同期な1行でなければならない（body の末尾で消すと看板が一瞬ちらつく）。
     ・`<html class="embed">` … style.css が header・footer・.refBack を隠す
     ・`<base target="_top">` … target の無い <a> をタブごと動かす。⚠ href は付けない -->
<script>try{if(new URLSearchParams(location.search).get("embed")==="1"){document.documentElement.classList.add("embed");var b=document.createElement("base");b.target="_top";document.head.appendChild(b);}}catch(e){}</script>
</head>
<body>
<header>
  <h1>電子対でみる分子のかたち</h1>
  <div class="version">v2</div>
  <a class="hubLink" href="../index.html">化学レンズ</a>
</header>
<main>
  <div class="bar taskBar">
    <div class="seg" role="group" aria-label="進め方">
      <button type="button" id="taskMode" class="on">お題</button>
      <button type="button" id="freeMode">自由</button>
    </div>
    <button type="button" id="prevTask" class="arrow" aria-label="前のお題">◀</button>
    <div id="taskLabel" class="taskLabel"></div>
    <button type="button" id="nextTask" class="arrow" aria-label="次のお題">▶</button>
  </div>
  <div class="bar viewBar">
    <div class="seg" role="group" aria-label="組む・形">
      <button type="button" id="buildView" class="on">組む</button>
      <button type="button" id="shapeViewBtn" disabled>形</button>
    </div>
    <div class="seg" role="group" aria-label="書き方">
      <button type="button" id="dotMode" class="on">電子式</button>
      <button type="button" id="lineMode">構造式</button>
    </div>
    <button type="button" id="checkBtn">確かめ</button>
  </div>
  <!-- 組む台と形の画面は同じ場所・同じ大きさ（固定の viewBox）。切り替えても高さは変わらない -->
  <svg id="board" class="stage" viewBox="0 0 400 300" role="img" aria-label="原子を並べる台"></svg>
  <svg id="shapeView" class="stage" viewBox="0 0 400 300" role="img" aria-label="分子の形" style="display:none"></svg>
  <p id="msg" class="msg" aria-live="polite"></p>
  <div class="bar subBar">
    <button type="button" id="undoBtn">戻す</button>
    <button type="button" id="resetBtn">最初から</button>
    <button type="button" id="centerBtn" style="display:none">もう一方の中心</button>
  </div>
  <div id="palette" class="palette" role="group" aria-label="置く原子"></div>
  <p class="legend"><span class="dotU"></span>不対電子 <span class="dotP"></span>非共有電子対 <span class="dotS"></span>共有電子対</p>
</main>
<footer class="pageFoot"><a href="../privacy.html">プライバシーポリシー</a></footer>
